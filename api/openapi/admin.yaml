openapi: 3.0.3
info:
  title: Admin API (A)
  version: 4.1.0
  description: |
    平台运营管理端。破坏性变更须提升本文件 `info.version` 的 **major**，
    并按 `docs/API_STANDARDS.md` 走弃用与发布说明。
    2.0.0：生产级信封/分页上限/错误模型（相对 1.0.0 骨架契约）。
    3.0.0：移除历史订单契约（破坏性）。
    3.1.0：登录新增 `MFABindingRequired` 分支与 `mfa_setup_ticket`（§7.2.1）。
    4.0.0：`Permission` 移除 `action` / `kind` / `parent_code` / `path`，`resource` 改为服务端生成（破坏性）；
    新增 `GET /admin/v1/menus` 与 `MenuTreeNode`；移除冗余的 `/admin/v1/iam/permissions/tree`。
    4.1.0：新增菜单资源管理端点（`/admin/v1/iam/menus*`），菜单停用代替物理删除。
servers:
  - url: http://localhost:8081
    description: 本地直连（make run-admin）
  - url: http://admin.localhost
    description: 开发集群（deploy values-dev.yaml）。Ingress path /admin 原样转发，路径已含 /admin/v1，勿重复拼接
  - url: https://admin.staging.example.com
    description: 预发（deploy values-staging.yaml）
  - url: https://admin.example.com
    description: 生产（deploy values-prod.yaml）
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
  - name: iam
    description: |
      RBAC / IAM 管理。写接口要求 `If-Match` 或 body `version` 与当前版本一致（乐观锁），
      冲突返回 40900；每次变更写审计事件 `rbac.role_change` / `rbac.binding_change`，
      审计失败即失败关闭（不落库）。
  - name: auth
    description: |
      身份认证：密码登录、一次性刷新、登出与会话管理。令牌不携带角色，
      权限以 IAM 快照为唯一来源；错误码覆盖 40000 / 40100 / 42900 / 50300。
paths:
  /healthz:
    get:
      tags: [probe]
      summary: Liveness
      operationId: adminHealthz
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [probe]
      summary: Readiness
      operationId: adminReadyz
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /version:
    get:
      tags: [probe]
      summary: Build version
      operationId: adminVersion
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /admin/v1/auth/login:
    post:
      tags: [auth]
      summary: 密码登录
      description: |
        账号不存在、密码错误、账号停用与锁定统一返回 40100；真实原因只写审计。
        请求中的 `channel` / `roles` / `merchant_id` 一律拒绝（40000）。

        A 端已绑定 MFA 时返回 `MFAChallenge`（不含任何令牌），需再调用
        `POST /admin/v1/auth/mfa/verify` 完成第二步；A 端强制绑定但尚未完成绑定时
        返回 `MFABindingRequired`（不含任何令牌），需先用 `POST /admin/v1/auth/mfa/setup`
        与 `POST /admin/v1/auth/mfa/verify` 完成绑定，绑定成功后直接签发令牌。
        两种中间态都不得签发管理令牌（AC-ENT-01-4、AC-ENT-01-6）。
      operationId: adminAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 令牌对，或需要完成 MFA 校验 / 绑定的中间态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "./components.yaml#/components/schemas/TokenPair"
                          - $ref: "./components.yaml#/components/schemas/MFAChallenge"
                          - $ref: "./components.yaml#/components/schemas/MFABindingRequired"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./components.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌（一次性轮换）
      description: 旧令牌成功轮换后立即失效；已轮换令牌再次出现视为重放，撤销整条会话链。
      operationId: adminAuthRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/TokenPair"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出当前会话
      description: 幂等；同时把当前访问令牌的 `jti` 加入黑名单。
      operationId: adminAuthLogout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: no content
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/logout-all:
    post:
      tags: [auth]
      summary: 登出全部会话
      description: 递增账号 `token_version`，使所有已签发访问令牌失效，并撤销全部会话。
      operationId: adminAuthLogoutAll
      security:
        - bearerAuth: []
      responses:
        "204":
          description: no content
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/sessions:
    get:
      tags: [auth]
      summary: 列出本账号会话
      description: 仅返回本账号会话；不下发任何令牌、IP 或 UA 原文。
      operationId: adminAuthListSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/AuthSessionListData"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/sessions/revoke-all:
    post:
      tags: [auth]
      summary: 撤销全部会话
      description: 语义等同 `logout-all`，便于会话管理页调用。
      operationId: adminAuthRevokeAllSessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: no content
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: 撤销指定会话
      description: 仅可撤销本账号会话；他人会话与不存在统一返回 40400，避免横向枚举。
      operationId: adminAuthRevokeSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: no content
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/mfa/setup:
    post:
      tags: [auth]
      summary: 初始化 TOTP 绑定
      description: |
        生成 TOTP 密钥与 10 个一次性恢复码，保存未确认绑定。
        密钥与恢复码只在本次响应出现；已确认绑定再次调用返回 40900。

        两种入口：

        - 携带 `Authorization`：为已登录账号（重新）初始化绑定；
        - 不携带 `Authorization`：在请求体提交登录返回的 `mfa_setup_ticket`，
          用于「强制绑定但尚未绑定」的登录前引导（§7.2.1）。

        票据路径只校验票据本身，不签发任何业务令牌；重复调用覆盖未确认绑定。
      operationId: adminAuthMFASetup
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/MFASetupRequest"
      responses:
        "200":
          description: 绑定初始化信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/MFASetupData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: 完成 MFA 校验
      description: |
        三种用法：

        - 不携带 `Authorization` 且提交 `mfa_ticket`：完成两步登录，返回 `TokenPair`；
          票据一次性消费，动态码错误同样消耗票据。
        - 不携带 `Authorization` 且提交 `mfa_setup_ticket`：完成强制绑定并直接签发
          `TokenPair`（不要求重新登录）；票据一次性消费，首码错误同样作废。
        - 携带 `Authorization`：使用动态码或恢复码确认首次绑定，返回 204（无响应体）。

        `mfa_ticket` 与 `mfa_setup_ticket` 互斥，同时提交返回 40000。
        A 端未完成 MFA 校验前不得获得管理令牌（AC-ENT-01-4、AC-ENT-01-6）。
      operationId: adminAuthMFAVerify
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: 令牌对（两步登录 / 强制绑定完成）；已登录绑定确认走 204
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/TokenPair"
        "204":
          description: no content
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "429":
          $ref: "./components.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/auth/mfa/disable:
    post:
      tags: [auth]
      summary: 解绑 MFA
      description: |
        需提交当前动态码或一次性恢复码；成功后删除绑定并撤销该账号全部会话，
        递增 `token_version` 使已签发管理令牌失效。
      operationId: adminAuthMFADisable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/MFADisableRequest"
      responses:
        "204":
          description: no content
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./components.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /admin/v1/iam/permissions:
    get:
      tags: [iam]
      summary: 权限点目录（分页）
      description: 需要 `iam:permission:read`。目录为只读基线，变更走迁移与发布。
      operationId: adminListIAMPermissions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: channel
          description: 按端别过滤；空表示全部
          schema:
            $ref: "#/components/schemas/Channel"
        - in: query
          name: keyword
          description: 按权限码 / 名称模糊匹配
          schema:
            type: string
        - $ref: "./components.yaml#/components/parameters/Page"
        - $ref: "./components.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PermissionListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/roles:
    get:
      tags: [iam]
      summary: 角色列表
      description: 需要 `iam:role:read`。B 端强制按 Principal 的 merchant_id 收窄。
      operationId: adminListIAMRoles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: channel
          schema:
            $ref: "#/components/schemas/Channel"
        - in: query
          name: merchant_id
          description: A 端可选；B 端忽略并由令牌决定
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/RoleStatus"
        - in: query
          name: keyword
          description: 按角色码 / 名称模糊匹配
          schema:
            type: string
        - $ref: "./components.yaml#/components/parameters/Page"
        - $ref: "./components.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RoleListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: 创建角色
      description: 需要 `iam:role:write`。权限码必须存在于目录且与端别匹配。
      operationId: adminCreateIAMRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/roles/{id}:
    get:
      tags: [iam]
      summary: 角色详情（含绑定数）
      description: 需要 `iam:role:read`。
      operationId: adminGetIAMRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    patch:
      tags: [iam]
      summary: 更新角色基础信息 / 启停
      description: 需要 `iam:role:write`。需提供 `version`（或 `If-Match`）。
      operationId: adminUpdateIAMRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    delete:
      tags: [iam]
      summary: 软删角色
      description: |
        需要 `iam:role:write`。版本可由 body `version` 或 `If-Match` 提供；
        仍存在绑定时返回 40900（须先解绑）。
      operationId: adminDeleteIAMRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoleRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IdOnly"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/roles/{id}/permissions:
    put:
      tags: [iam]
      summary: 全量替换角色权限与数据范围
      description: |
        需要 `iam:role:grant`。语义为全量替换，响应返回 added / removed 差量；
        `data_scopes` 省略表示不修改，空数组表示清空。审计记录差量。
      operationId: adminReplaceIAMRolePermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePermissionsRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReplacePermissionsData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/roles/{id}/constraints:
