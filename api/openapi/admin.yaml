openapi: 3.0.3
info:
  title: Admin API (A)
  version: 7.3.0
  description: |
    平台运营管理端。破坏性变更须提升本文件 `info.version` 的 **major**，
    并按 `docs/API_STANDARDS.md` 走弃用与发布说明。
    2.0.0：生产级信封/分页上限/错误模型（相对 1.0.0 骨架契约）。
    3.0.0：移除历史订单契约（破坏性）。
    3.1.0：登录新增 `MFABindingRequired` 分支与 `mfa_setup_ticket`（§7.2.1）。
    4.0.0：`Permission` 移除 `action` / `kind` / `parent_code` / `path`，`resource` 改为服务端生成（破坏性）；
    新增 `GET /admin/v1/menus` 与 `MenuTreeNode`；移除冗余的 `/admin/v1/iam/permissions/tree`。
    4.1.0：新增菜单资源管理端点（`/admin/v1/iam/menus*`），菜单停用代替物理删除。
    5.0.0：`GET /admin/v1/menus` 重命名为 `GET /admin/v1/iam/me/menus`，与 `/iam/me/permissions` 对齐（破坏性）。
    5.1.0：新增 `GET /admin/v1/me`（当前主体资料）。
    6.0.0：角色 `scope_type` 枚举由 `admin` 更正为 `platform`，与后端 RBAC 语义一致（破坏性）；
    登记角色模板端点与契约（`/admin/v1/iam/role-templates*`）。
    6.1.0：新增自助改密与账号生命周期管理端点（停用 / 启用 / 解锁 / 重置 MFA）。
    6.2.0：`GET /admin/v1/me` 增补 `has_password` / `phone_bound` / `password_updated_at` /
    `must_change_password`（纯增量），供前端安全设置页展示真实状态。
    6.3.0：新增 `PATCH /admin/v1/me` 与 `MeView.display_name`（纯增量），支持自助修改展示昵称。
    7.0.0：`AuthSession` 移除 `ip_hash` / `ua_hash`，改为下发设备画像与脱敏 IP（破坏性）；
    设备画像由服务端从 User-Agent / IP 派生，仅用于展示。
    7.1.0：新增租户生命周期端点（`/admin/v1/tenants*`，ENT-09，纯增量）；租户状态机
    `pending → active → suspended → terminated`，停用与终止必须给原因。
    7.2.0：新增租户成员与配额端点（`/admin/v1/tenants/{id}/members*`、`/quotas*`，ENT-09，纯增量）；
    成员停用代替物理删除，最后一名 owner 不可降级；配额 `-1` 表示不限，执行由 ENT-14 承担。
    7.3.0：租户创建支持 `plan_code`（T-24，套餐配额创建时物化）与 `owner_subject_id`（T-12）；
    `activate` 要求租户至少有一名在册 owner（否则 40900）；`Tenant` 响应增加 `plan_id`（纯增量）。
servers:
  - url: http://localhost:8081
    description: 本地直连（make run-admin）
  - url: http://admin.localhost
    description: 开发集群（deploy values-dev.yaml）。Ingress path /admin 原样转发，路径已含 /admin/v1，勿重复拼接
  - url: https://admin.staging.example.com
    description: 预发（deploy values-staging.yaml）
  - url: https://admin.example.com
    description: 生产（deploy values-prod.yaml）
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
  - name: iam
    description: |
      RBAC / IAM 管理。写接口要求 `If-Match` 或 body `version` 与当前版本一致（乐观锁），
      冲突返回 40900；每次变更写审计事件 `rbac.role_change` / `rbac.binding_change`，
      审计失败即失败关闭（不落库）。
  - name: tenant
    description: |
      租户生命周期（ENT-09）。租户是唯一隔离边界，`tenant.id` 即 B 端 `merchant_id`。
      写接口要求 `tenant:write`，四个动作（开通 / 停用 / 恢复 / 终止）各自写审计；
      非法迁移返回 40900，停用与终止缺 `reason` 返回 40000。
  - name: auth
    description: |
      身份认证：密码登录、一次性刷新、登出与会话管理。令牌不携带角色，
      权限以 IAM 快照为唯一来源；错误码覆盖 40000 / 40100 / 42900 / 50300。
