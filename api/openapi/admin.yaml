openapi: 3.0.3
info:
  title: Admin API (A)
  version: 2.0.0
  description: |
    平台运营管理端。破坏性变更须提升本文件 `info.version` 的 **major**，
    并按 `docs/API_STANDARDS.md` 走弃用与发布说明。
    2.0.0：生产级信封/分页上限/错误模型（相对 1.0.0 骨架契约）。
servers:
  - url: http://localhost:8081
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
  - name: orders
    description: 全局订单
paths:
  /healthz:
    get:
      tags: [probe]
      summary: Liveness
      operationId: adminHealthz
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [probe]
      summary: Readiness
      operationId: adminReadyz
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /version:
    get:
      tags: [probe]
      summary: Build version
      operationId: adminVersion
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /admin/v1/orders:
    get:
      tags: [orders]
      summary: 全局订单列表
      operationId: adminListOrders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: merchant_id
          description: 按商户过滤；空表示不限商户
          schema:
            type: string
        - $ref: "./components.yaml#/components/parameters/Page"
        - $ref: "./components.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/orders/{id}:
    get:
      tags: [orders]
      summary: 订单详情（含运营内部字段）
      operationId: adminGetOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: 运营取消订单
      operationId: adminCancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
components:
  parameters:
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "演示 Token：admin.<subject_id>（生产替换为 A 端独立 JWT）"
  schemas:
    VersionInfo:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: admin-api
        version:
          type: string
          example: 1.4.2
        commit:
          type: string
          description: git commit（RELS-03）；本地可为 none
          example: abcdef0
        build_time:
          type: string
          description: UTC 构建时间（RELS-03）
          example: "2026-10-13T12:00:00Z"
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              error:
                type: string
    Order:
      type: object
      required:
        - id
        - merchant_id
        - user_id
        - amount_cent
        - currency
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        merchant_id:
          type: string
        user_id:
          type: string
        amount_cent:
          type: integer
          format: int64
        currency:
          type: string
          example: CNY
        status:
          type: string
          enum: [created, paid, cancelled]
        remark:
          type: string
          description: 运营内部备注；禁止出现在 C 端契约
        cost_cent:
          type: integer
          format: int64
          description: 内部成本；禁止出现在 C 端契约
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderListData:
      allOf:
        - $ref: "./components.yaml#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Order"
