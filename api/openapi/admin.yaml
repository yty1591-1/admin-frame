components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A 端 JWT（Bearer）。权限与主体以 IAM 快照为准，令牌不携带角色。仅 auth.mode=demo 的本地/测试形态使用演示令牌 admin.<subject_id>，生产禁止。"
    scimBearerAuth:
      type: http
      scheme: bearer
      description: "SCIM 目录同步令牌（Bearer scim_<32B base64url>）。只能访问 /admin/scim/v2/*，不能调用任何 /{端}/v1/* 业务端点；A 端账号 JWT 也不能调用 SCIM（docs/identity-authn.md 21.1.2）。"

