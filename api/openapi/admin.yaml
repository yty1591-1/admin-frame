      summary: 审批破玻璃并立即生效
      description: |
        需要 `iam:breakglass:approve`。审批人必须与申请人不同（职责分离），
        否则返回 40300。通过后立即创建一条带 expires_at 的临时绑定，
        该主体在绑定期内的鉴权快照会展开 `*`。
        已 applied 的单子按幂等成功返回；审批已通过但应用失败时可重试。
      operationId: adminApproveIAMBreakglass
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 破玻璃审批单 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BreakglassGrant"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"

  /admin/v1/iam/breakglass/{id}/revoke:
    post:
      tags: [iam]
      summary: 撤销破玻璃授权
      description: |
        需要 `iam:breakglass:approve`。提前删除临时绑定，快照在缓存 TTL 内失效。
        version 必须与审批单当前版本一致，避免旧页面误撤新授权，否则返回 40900。
      operationId: adminRevokeIAMBreakglass
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 破玻璃审批单 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BreakglassGrant"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"

  /admin/v1/iam/change-requests:
    get:
      tags: [iam]
      summary: 审批单列表
      description: |
        需要 `iam:change:read`。按申请时间倒序（同一时刻按 ID 倒序），
        分页参数与其它列表接口一致（page / page_size，上限 100）。
        A 端只看平台级审批单（merchant_id 为空）；商户级审批单由
        `/biz/v1/iam/change-requests` 按 Principal 的商户隔离展示。
      operationId: adminListIAMChangeRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 审批状态过滤
          schema:
            $ref: "#/components/schemas/ChangeStatus"
        - name: action
          in: query
          required: false
          description: 变更动作过滤
          schema:
            $ref: "#/components/schemas/ChangeAction"
        - name: requested_by
          in: query
          required: false
          description: 申请人主体 ID 过滤
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequestListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: 创建审批单
      description: |
        需要 `iam:role:write`。审批单只记录「待执行的变更」而不立即生效。
        payload 必须是 JSON 对象，且：
        - 大小不超过 16 KiB；
        - 禁止包含 token / password / secret / private_key 等敏感字段（SEC-14）；
        - B 端载荷禁止包含 merchant_id：商户只能来自认证主体，命中返回 40300；
        - breakglass_request 仅在 iam.breakglass.enabled=true 时可用，否则返回 40300；
        - B 端（/biz/v1/iam/change-requests）不允许 breakglass_request，固定返回 40300；
      operationId: adminCreateIAMChangeRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/change-requests/{id}/approve:
    post:
      tags: [iam]
      summary: 通过审批单
      description: |
        需要 `iam:change:approve`。审批人不得与申请人相同，自审返回 40300（SoD）。
        非 pending 状态或版本不一致返回 40900。
      operationId: adminApproveIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/change-requests/{id}/reject:
    post:
      tags: [iam]
      summary: 拒绝审批单
      description: 需要 `iam:change:approve`。同样适用职责分离，自审返回 40300。
      operationId: adminRejectIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/change-requests/{id}/cancel:
    post:
      tags: [iam]
      summary: 撤销审批单
      description: 需要 `iam:change:read`。仅申请人本人可撤销，否则返回 40300。
      operationId: adminCancelIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/change-requests/{id}/apply:
    post:
      tags: [iam]
      summary: 应用审批单
      description: |
        需要 `iam:change:approve`。仅 approved 状态可应用；执行时会重新加载目标聚合
        并按当前版本写入，因此审批期间目标被改动不会静默覆盖（失败返回 40000/40400/40900）。
        应用失败时审批单保持 approved，可重试，不会标记为 applied。
      operationId: adminApplyIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/sod-groups:
    get:
      tags: [iam]
      summary: 互斥角色组列表
      description: 需要 `iam:sod:read`。B 端强制只返回本商户。
      operationId: adminListIAMSodGroups
      security:
        - bearerAuth: []
      parameters:
        - {name: channel, in: query, schema: {type: string, enum: [admin, biz]}}
        - {name: merchant_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, disabled]}}
        - {name: keyword, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SodGroupListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: 创建互斥角色组
      description: 需要 `iam:sod:write`。存在存量违规时返回 40900，建议先调用 preflight。
      operationId: adminCreateIAMSodGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSodGroupRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SodGroup"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/sod-groups/preflight:
    post:
      tags: [iam]
      summary: 互斥组候选配置预检
      description: 需要 `iam:sod:read`。返回当前租户内会被该候选配置直接判为违规的主体。
      operationId: adminPreflightIAMSodGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightSodGroupRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SodViolationListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/sod-groups/{id}:
    get:
      tags: [iam]
      summary: 互斥角色组详情
      description: 需要 `iam:sod:read`。跨端 / 跨商户返回 40400。
      operationId: adminGetIAMSodGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SodGroupID"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SodGroup"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    patch:
      tags: [iam]
      summary: 更新互斥角色组
      description: 需要 `iam:sod:write`。成员 / 阈值 / 启用变更会重新做存量预检。
      operationId: adminUpdateIAMSodGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SodGroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSodGroupRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SodGroup"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    delete:
      tags: [iam]
      summary: 软删互斥角色组
      description: 需要 `iam:sod:write`。软删后保留编码与历史关系。
      operationId: adminDeleteIAMSodGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SodGroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSodGroupRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /admin/v1/iam/sod-groups/{id}/violations:
    get:
      tags: [iam]
      summary: 互斥组存量违规
      description: 需要 `iam:sod:read`。返回当前超阈值的主体，用于整改与预检核对。
      operationId: adminListIAMSodGroupViolations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SodGroupID"
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SodViolationListData"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
components:
  parameters:
    SodGroupID:
      name: id
      in: path
      required: true
      description: 互斥组 ID
      schema:
        type: string
        minLength: 1
    RoleID:
      name: id
      in: path
      required: true
      description: 角色 ID
      schema:
        type: string
        minLength: 1
    BindingID:
      name: id
      in: path
      required: true
      description: 绑定 ID
      schema:
        type: string
        minLength: 1
    ChangeRequestID:
      name: id
      in: path
      required: true
      description: 审批单 ID
      schema:
        type: string
        minLength: 1
    SubjectTypePath:
      name: subject_type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SubjectType"
    SubjectIDPath:
      name: subject_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IfMatchVersion:
      name: If-Match
      in: header
      required: false
      description: 期望版本号（与 body.version 二选一，冲突返回 40000）
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A 端 JWT（Bearer）。权限与主体以 IAM 快照为准，令牌不携带角色。仅 auth.mode=demo 的本地/测试形态使用演示令牌 admin.<subject_id>，生产禁止。"
  schemas:
    VersionInfo:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: admin-api
        version:
          type: string
          example: 1.4.2
        commit:
          type: string
          description: git commit（RELS-03）；本地可为 none
          example: abcdef0
        build_time:
          type: string
          description: UTC 构建时间（RELS-03）
          example: "2026-10-13T12:00:00Z"
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              error:
                type: string
    # ---- IAM ----
    Channel:
      type: string
      description: 端别；IAM 角色与绑定必须与端别一致
      enum: [admin, biz]
    RoleStatus:
      type: string
      enum: [active, disabled]
    RoleType:
      type: string
      enum: [system, custom, breakglass]
    SubjectType:
      type: string
      description: staff 仅 A 端；merchant_staff 仅 B 端
      enum: [staff, merchant_staff]
    DataScopeType:
      type: string
      description: all / merchant_set 仅 A 端允许
      enum: [all, merchant, self, merchant_set]
    DataScope:
      type: object
      required: [resource, scope_type]
      properties:
        resource:
          type: string
          description: 资源段："*" 或权限码首段（如 iam）
          example: iam
        scope_type:
          $ref: "#/components/schemas/DataScopeType"
        merchant_ids:
          type: array
          description: 仅 scope_type=merchant_set 使用，最多 100 个
          items:
            type: string
    MenuAdmin:
      type: object
      required: [id, channel, code, node_type, route_name, route_path, title, sort, status, version, updated_by, created_at, updated_at]
      description: 菜单管理视图；version 为乐观锁版本
      properties:
        id:
          type: string
        channel:
          type: string
          enum: [admin, biz]
        code:
          type: string
          description: 创建后不可修改
        parent_code:
          type: string
        node_type:
          type: string
          enum: [catalog, menu, iframe, link]
        route_name:
          type: string
        route_path:
          type: string
        component:
          type: string
        redirect:
          type: string
        title:
          type: string
        title_key:
