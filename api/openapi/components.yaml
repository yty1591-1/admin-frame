openapi: 3.0.3
info:
  title: Shared API Components
  version: 1.0.0
  description: |
    A/B/C 三端共用的信封、分页与错误响应模型。
    各端 OpenAPI 通过相对路径 $ref 引用；禁止在此文件定义业务路径。
paths: {}
components:
  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: 每页条数；超过上限须返回业务错误码 40000
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写操作幂等键（A 端账号处置与 C 端写操作）；同一键重复提交须返回同一结果
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    Envelope:
      type: object
      required: [code, message]
      description: 统一成功/失败响应信封
      properties:
        code:
          type: integer
          description: 0 表示成功；非 0 为稳定业务错误码（见 ErrorCode）
          example: 0
        message:
          type: string
          description: 人类可读说明；C 端宜笼统，细节进日志
          example: ok
        data:
          description: 成功时的业务载荷；失败时省略
        trace_id:
          type: string
          description: 请求追踪 ID，与日志字段对齐
          example: a1b2c3d4e5f60708
    ErrorEnvelope:
      type: object
      required: [code, message]
      description: 错误响应（无 data 或 data 为空）
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          example: not found
        trace_id:
          type: string
    ErrorCode:
      type: integer
      description: |
        稳定业务错误码（`internal/shared/apperr`）。
        新增码只追加；禁止复用已发布码的语义。
        该码表按 API-04 只增不减，故声明为可扩展开放集合（`x-extensible-enum`）：
        客户端必须对未知码按「未知错误」兜底，不得据此改变已实现分支。
      x-extensible-enum:
        [40000, 40100, 40300, 40400, 40900, 40951, 40952, 42900, 50000, 50300, 50351]
      x-enum-descriptions:
        - 请求参数非法
        - 未认证或令牌无效
        - 已认证但无权限
        - 资源不存在（含越权对外表现为不存在）
        - 状态冲突
        - 限流或配额耗尽
        - 内部错误
        - 依赖不可用（鉴权等关键依赖无法完成判定时失败关闭）
    PageMeta:
      type: object
      required: [items, total]
      description: |
        列表 data 载荷的公共形状（items + total）。
        具体元素类型由各分端的 `XxxListData` 定义；本 schema 只约束外层形状，
        供代码生成器产出可用的分页类型，避免 `items` 缺失导致退化为 any。
      properties:
        items:
          type: array
          description: 当前页条目；元素类型见各分端 ListData 定义（此处仅约束外层为数组）
          items:
            type: object
            description: 单条记录；具体字段由各分端 ListData 定义
        total:
          type: integer
          minimum: 0
          description: 符合过滤条件的总条数（或当前页估计，须在实现中保持一致）
    LoginRequest:
      type: object
      required: [subject, password]
      additionalProperties: false
      description: |
        A/B 端密码登录请求。`channel` / `roles` 由服务端推导；
        B 端必须携带 `merchant_id`（租户上下文），A 端传入返回 40000。
      properties:
        subject:
          type: string
          minLength: 1
          description: 登录主体（账号或邮箱）
          example: alice@example.com
        password:
          type: string
          minLength: 1
          format: password
          description: 明文密码；仅通过 TLS 传输，服务端不落库、不写日志
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
          description: B 端商户 ID；与 subject 一起构成租户内唯一登录主体
    BizLoginRequest:
      type: object
      required: [subject, password, merchant_id]
      additionalProperties: false
      description: |
        B 端密码登录请求。`merchant_id` 必填且必须与账号绑定租户一致；
        账号不存在、密码错误、账号停用与锁定统一返回 40100，令牌不得跨商户。
      properties:
        subject:
          type: string
          minLength: 1
          description: 登录主体（账号或邮箱）
          example: alice@example.com
        password:
          type: string
          minLength: 1
          format: password
          description: 明文密码；仅通过 TLS 传输，服务端不落库、不写日志
        merchant_id:
          type: string
          minLength: 1
          maxLength: 64
          description: B 端商户 ID；与 subject 一起构成租户内唯一登录主体
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      description: 一次性刷新令牌；成功轮换后旧令牌立即失效，重放会撤销整条会话链。
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Access JWT（不携带角色，权限以 IAM 快照为准）
        refresh_token:
          type: string
          description: 一次性刷新令牌；只在签发响应中出现一次
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          description: 访问令牌有效期（秒）
        absolute_expires_at:
          type: string
          format: date-time
          description: 设备绝对到期时间；刷新不会延长，达到后需重新登录

    # 租户切换（ENT-09 T-22，B 端多租户）。
    TenantSwitchRequest:
      type: object
      required: [tenant_id]
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          maxLength: 64
          description: 目标租户；须为当前主体的在册成员租户，否则 40300。

    TenantSwitchResult:
      type: object
      required: [access_token, token_type, expires_in, current_tenant]
      properties:
        access_token:
          type: string
          description: 同会话重签的访问令牌；`current_tenant` 已更新。
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          description: 访问令牌有效期（秒）。
        current_tenant:
          type: string
          description: 切换后的生效租户；旧令牌继续以 merchant_id 生效至自然过期。
    SMSSendRequest:
      type: object
      required: [phone]
      additionalProperties: false
      description: |
        发送短信验证码请求。手机号必须为 E.164；无论账号是否存在都返回 204，
        防止手机号枚举。受重发间隔、单手机号日限与单 IP 时限约束（超限 42900）。
      properties:
        phone:
          type: string
          pattern: '^\+[1-9]\d{2,14}$'
          example: "+8613800138000"
    SMSLoginRequest:
      type: object
      required: [phone, code]
      additionalProperties: false
      description: |
        短信验证码登录请求。验证码 6 位数字，有效期与最大错误次数由服务端配置；
        验证码错误、过期与账号不存在统一返回 40100。
      properties:
        phone:
          type: string
          pattern: '^\+[1-9]\d{2,14}$'
          example: "+8613800138000"
        code:
          type: string
          pattern: '^\d{6}$'
          example: "123456"
    SMSRebindRequest:
      type: object
      required: [phone, code, old_code]
      additionalProperties: false
      description: |
        换绑手机号请求。`code` 证明持有新号，`old_code` 证明持有当前手机号；
        仅凭 Bearer 无法换绑。两个验证码都必须通过 sms/send 预先生成。
      properties:
        phone:
          type: string
          pattern: '^\+[1-9]\d{2,14}$'
          example: "+8613800138002"
        code:
          type: string
          pattern: '^\d{6}$'
          description: 新手机号验证码
          example: "123456"
        old_code:
          type: string
          pattern: '^\d{6}$'
          description: 当前手机号验证码
          example: "654321"
    SMSDeleteRequest:
      type: object
      required: [code]
      additionalProperties: false
      description: |
        注销账号请求。短信启用时 `code` 为当前手机号验证码，用于再认证；
        OAuth-only 账号无手机号时可省略。
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          example: "123456"
    OAuthAuthorizeResult:
      type: object
      required: [authorize_url, state]
      additionalProperties: false
      description: 授权发起结果；`state` 一次性有效，回调必须原样带回。
      properties:
        authorize_url:
          type: string
          format: uri
          description: 第三方授权地址（含 PKCE S256 challenge）
        state:
          type: string
          minLength: 1
          description: 一次性 state，禁止复用或写入日志
    MFAChallenge:
      type: object
      required: [mfa_required, mfa_ticket]
      additionalProperties: false
      description: |
        密码已通过但需要完成第二步 MFA 的响应；不包含任何令牌。
        `mfa_ticket` 为一次性短期票据（5 分钟），只能用于 `POST /admin/v1/auth/mfa/verify`。
      properties:
        mfa_required:
          type: boolean
          enum: [true]
        mfa_ticket:
          type: string
          minLength: 1
          description: 两步登录票据；一次性消费，禁止写日志
    MFABindingRequired:
      type: object
      required: [mfa_binding_required, mfa_setup_ticket]
      additionalProperties: false
      description: |
        密码已通过、但账号尚未完成 MFA 绑定且 A 端强制绑定时返回；不包含任何业务令牌。
        `mfa_setup_ticket` 为一次性短期票据（10 分钟），只能用于
        `POST /admin/v1/auth/mfa/setup` 与 `POST /admin/v1/auth/mfa/verify`
        （§7.2.1，AC-ENT-01-6）。绑定完成后由 `mfa/verify` 直接签发 `TokenPair`。
      properties:
        mfa_binding_required:
          type: boolean
          enum: [true]
        mfa_setup_ticket:
          type: string
          minLength: 1
          description: 强制绑定票据；scope=mfa_setup，一次性消费，禁止写日志
    MFASetupRequest:
      type: object
      additionalProperties: false
      description: |
        绑定初始化请求。已登录绑定可省略整个请求体；
        登录前强制绑定时必须提交登录返回的 `mfa_setup_ticket`，且不携带 `Authorization`。
      properties:
        mfa_setup_ticket:
          type: string
          minLength: 1
          description: 强制绑定票据；scope=mfa_setup，禁止写日志
    MFASetupData:
      type: object
      required: [secret, otpauth_uri, recovery_codes]
      additionalProperties: false
      description: TOTP 绑定初始化数据；密钥与恢复码只在本次响应出现。
      properties:
        secret:
          type: string
          description: Base32（无填充）TOTP 密钥
        otpauth_uri:
          type: string
          description: otpauth:// URI，供客户端扫码录入
        recovery_codes:
          type: array
          minItems: 1
          items:
            type: string
          description: 一次性恢复码；库内只保存 SHA-256 哈希
    MFAVerifyRequest:
      type: object
      required: [code]
      additionalProperties: false
      description: |
        `mfa_ticket` 用于两步登录，`mfa_setup_ticket` 用于强制绑定（§7.2.1）；
        两者互斥，同时提交返回 40000。都省略时按已认证会话确认绑定。
      properties:
        mfa_ticket:
          type: string
          description: 两步登录票据；登录返回的一次性 `mfa_ticket`
        mfa_setup_ticket:
          type: string
          description: 强制绑定票据；登录返回的一次性 `mfa_setup_ticket`
        code:
          type: string
          minLength: 6
          description: 6 位 TOTP 动态码或一次性恢复码
    MFADisableRequest:
      type: object
      required: [code]
      additionalProperties: false
      description: 解绑需要当前动态码或一次性恢复码。
      properties:
        code:
          type: string
          minLength: 6
          description: 6 位 TOTP 动态码或一次性恢复码
    ChangePasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      description: |
        两种模式：
        - Bearer 自助改密：必须提交 `old_password`；
        - 强制改密：提交 `password_change_ticket`，不得携带 `Authorization`，也无需 `old_password`。
        成功后递增 token_version 并撤销全部会话。
      properties:
        old_password:
          type: string
          minLength: 1
          description: 当前密码；仅本次请求使用，禁止写日志
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: 新密码；须满足密码策略且不得与当前密码 / 临时口令相同
        password_change_ticket:
          type: string
          minLength: 1
          description: 管理员重置密码后登录返回的一次性改密票据；5 分钟有效、一次性消费
    PasswordChangeRequired:
      type: object
      required: [password_change_required, password_change_ticket]
      additionalProperties: false
      description: |
        管理员重置密码后，登录只返回该中间态，不签发任何业务令牌；
        凭 `password_change_ticket` 调用 `POST /admin/v1/auth/password/change` 完成改密。
      properties:
        password_change_required:
          type: boolean
          enum: [true]
        password_change_ticket:
          type: string
          minLength: 1
          description: 强制改密票据；scope=password_change，一次性消费，禁止写日志
    AccountActionRequest:
      type: object
      additionalProperties: false
      description: |
        管理员账号操作的可选原因与特权操作二次认证。
        启用 / 解锁 / 锁定 / 恢复 / 密码重置 / MFA 重置 / 删除 / 全量撤销 /
        单会话撤销在 `identity.mfa.admin_required=true` 时必须携带 `mfa_code`
        （TOTP 或恢复码），缺失返回 40000。
      properties:
        reason:
          type: string
          maxLength: 64
          description: 操作原因（如 left_company / lost_device）；空值时使用服务端默认原因
        mfa_code:
          type: string
          minLength: 6
          maxLength: 32
          description: 特权操作二次认证码；TOTP 6 位或一次性恢复码
    AccountLockRequest:
      type: object
      additionalProperties: false
      description: |
        管理员主动锁定；duration_minutes 省略时使用默认锁定策略。
        `identity.mfa.admin_required=true` 时必须携带 `mfa_code`，缺失返回 40000。
      properties:
        reason:
          type: string
          maxLength: 64
          description: 锁定原因；写入审计
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 10080
          description: 锁定时长（分钟），范围 [1, 10080]（7 天）
        mfa_code:
          type: string
          minLength: 6
          maxLength: 32
          description: 特权操作二次认证码；TOTP 6 位或一次性恢复码
    AccountSummary:
      type: object
      required: [id, subject, channel, status, token_version, created_at, updated_at]
      additionalProperties: false
      description: 账号摘要；软删账号同样返回，并附带 deleted_at。
      properties:
        id:
          type: string
        subject:
          type: string
          description: 规范化登录主体（C 端为不可逆手机号摘要）
        channel:
          type: string
          enum: [admin, biz, c]
        status:
          type: string
          enum: [pending, active, locked, disabled]
        merchant_id:
          type: string
        token_version:
          type: integer
          format: int64
        locked_until:
          type: string
          format: date-time
          description: 锁定到期时间；未锁定时省略
        deleted_at:
          type: string
          format: date-time
          description: 软删时间；未删除时省略
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountDetail:
      allOf:
        - $ref: "#/components/schemas/AccountSummary"
        - type: object
          required: [mfa_enabled, must_change_password, has_password, phone_bound]
          properties:
            mfa_enabled:
              type: boolean
            must_change_password:
              type: boolean
            has_password:
              type: boolean
            phone_bound:
              type: boolean
    AccountListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        total:
          type: integer
          minimum: 0
    ResetPasswordData:
      type: object
      required: [temporary_password]
      additionalProperties: false
      description: 一次性临时口令；只在本次响应出现，禁止缓存与日志。
      properties:
        temporary_password:
          type: string
          minLength: 1
    AuthSession:
      type: object
      required: [id, current, status, created_at, last_used_at, expires_at, absolute_expires_at]
      description: |
        设备会话视图；`id` 为设备（family）ID，同一设备刷新只轮换内部令牌代。
        不包含任何令牌；接口只返回可展示的设备画像与脱敏 IP，不返回 IP / UA 原文或摘要。
        设备画像由服务端从登录请求的 User-Agent 与客户端 IP 派生，仅供展示，
        不得作为鉴权或风控依据；历史会话无法识别时相关字段省略。
      properties:
        id:
          type: string
        current:
          type: boolean
          description: 是否为当前请求使用的设备
        status:
          type: string
          enum: [active, rotated, revoked, expired]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 当前令牌代到期时间；刷新会推进但不超过 absolute_expires_at
        absolute_expires_at:
          type: string
          format: date-time
          description: 设备绝对到期时间；刷新不会延长
        idle_expires_at:
          type: string
          format: date-time
          description: 空闲到期时间；无空闲策略时省略
        revoked_at:
          type: string
          format: date-time
          description: 撤销时间；未撤销时省略
        device_label:
          type: string
          description: 可直接展示的设备名（如 `Chrome · Windows`）；无法识别时省略
          example: Chrome · Windows
        device_type:
          type: string
          description: 设备形态；无法识别时省略
          enum: [desktop, mobile, tablet]
        os:
          type: string
          description: 操作系统；无法识别时省略
          enum: [windows, macos, ios, android, linux, chromeos]
        browser:
          type: string
          description: 浏览器；无法识别时省略
          enum: [chrome, edge, safari, firefox, wechat, opera]
        ip_masked:
          type: string
          description: 脱敏客户端 IP；IPv4 保留前两段（`1.2.x.x`），IPv6 保留前四组
          example: 1.2.x.x
    AuthSessionListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthSession"
        next_cursor:
          type: string
          description: 下一页游标；省略表示没有更多设备
    M2MClient:
      type: object
      description: M2M 机器客户端视图；不含任何密钥材料（docs/identity-authn.md 21.2.4）
      required: [id, client_id, name, status, allowed_channels, allowed_scopes, token_version]
      properties:
        id: {type: string}
        client_id:
          type: string
          description: 形如 svc_<22 字符 base64url>；软删后不可复用
        name: {type: string}
        status: {type: string, enum: [active, disabled, deleted]}
        allowed_channels:
          type: array
          items: {type: string, enum: [admin, biz, c]}
        allowed_scopes:
          type: array
          items: {type: string}
        owner: {type: string}
        token_version:
          type: integer
          minimum: 1
          description: 撤销版本；递增后旧令牌在 60s 内失效
        rotation_due_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
    M2MTokenRequest:
      type: object
      description: RFC 6749 客户端凭据请求（application/x-www-form-urlencoded）
      required: [grant_type, scope]
      properties:
        grant_type: {type: string, enum: [client_credentials]}
        scope:
          type: string
          description: 空格分隔的权限码；必填、无隐式默认值，必须同时命中客户端与服务端白名单
        client_id: {type: string, description: Basic 认证时可省略}
        client_secret: {type: string, description: Basic 认证时可省略；禁止经 query 传参}
    M2MTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, minimum: 300, maximum: 3600}
        scope: {type: string}
    OAuth2Error:
      type: object
      description: RFC 6749 5.2 错误体；本仓库统一信封的显式例外
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_scope, unsupported_grant_type, temporarily_unavailable]
        error_description: {type: string}
    SCIMUser:
      type: object
      description: SCIM 2.0 User（RFC 7643）；响应体不使用统一信封
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          items: {type: string}
        id: {type: string, description: 服务端生成，稳定不可变}
        externalId:
          type: string
          description: IdP 侧用户 ID；必填，幂等键，重复返回 409 uniqueness
        userName:
          type: string
          description: A 端登录主体；改名即主体变更（重算索引与密文）
        name:
          type: object
          properties:
            formatted: {type: string}
            givenName: {type: string}
            familyName: {type: string}
        displayName: {type: string}
        active:
          type: boolean
          description: false 等价于停用：撤销全部会话并递增 token_version
        password:
          type: string
          description: 一律拒绝（400 mutability）；SSO-only 账号禁止经 SCIM 下发口令
        groups:
          type: array
          description: 只读投影，来自 Group.members
          items:
            type: object
            properties:
              value: {type: string}
              display: {type: string}
              type: {type: string}
        meta:
          $ref: "#/components/schemas/SCIMMeta"
    SCIMGroup:
      type: object
      description: SCIM 2.0 Group（RFC 7643）
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          items: {type: string}
        id: {type: string}
        externalId: {type: string, description: 必填，幂等键，provider 内唯一}
        displayName: {type: string, description: 必填；group_role_map 的映射键}
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: {type: string, description: 账号 ID 或 externalId}
              display: {type: string}
              type: {type: string}
        meta:
          $ref: "#/components/schemas/SCIMMeta"
    SCIMMeta:
      type: object
      properties:
        resourceType: {type: string}
        created: {type: string, format: date-time}
        lastModified: {type: string, format: date-time}
        version:
          type: string
          description: 弱 ETag（W/"<version>"），与 If-Match 校验同源
        location: {type: string}
    SCIMListResponse:
      type: object
      description: SCIM 列表响应（RFC 7644 §3.4.2）
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items: {type: string}
        totalResults: {type: integer}
        startIndex: {type: integer, minimum: 1}
        itemsPerPage: {type: integer}
        Resources:
          type: array
          items: {type: object}
    SCIMPatchRequest:
      type: object
      description: SCIM PATCH（RFC 7644 §3.5.2）；仅 add / replace / remove
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items: {type: string}
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: {type: string, enum: [add, replace, remove]}
              path:
                type: string
                description: 限定 active / userName / externalId / displayName / name / members
              value: {}
    SCIMError:
      type: object
      description: RFC 7644 §3.12 协议错误体；本仓库统一信封的显式例外
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items: {type: string}
        status: {type: string}
        scimType:
          type: string
          enum: [invalidSyntax, invalidValue, invalidPath, invalidFilter, noTarget, mutability, uniqueness]
        detail: {type: string}
    SCIMToken:
      type: object
      description: SCIM 令牌视图；不含原文
      required: [id, provider, fingerprint, status, created_at]
      properties:
        id: {type: string}
        provider: {type: string}
        fingerprint: {type: string}
        status: {type: string, enum: [active, retiring, revoked]}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    SCIMGroupSummary:
      type: object
      description: 管理端组视图（含映射角色与成员数量）
      required: [id, external_id, display_name, mapped_role, member_count, version]
      properties:
        id: {type: string}
        external_id: {type: string}
        display_name: {type: string}
        mapped_role:
          type: string
          description: 映射到的 A 端角色 code；空串表示未映射（不产生授权）
        member_count: {type: integer}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    InstallState:
      type: object
      description: |
        首次安装 / 重配置（repair）态（ADR-0017 / ADR-0018）。`ready` 之外的状态下
        业务进程按 ADR-0018 决定降级或失败关闭；`lease_until` 只在 `installing` 有值。
      required: [env, status, version, updated_at]
      properties:
        env: {type: string}
        status:
          type: string
          enum: [pending, installing, ready, failed]
        mode:
          type: string
          enum: [first_install, repair]
          description: |
            向导模式（ADR-0018）：`ready` 之前是首装（first_install），
            之后是补配/修复（repair）。前端据此决定是否只渲染阻塞键。
        owner:
          type: string
          description: 持有租约的安装者标识（`installing` 期间有效）
        repair_keys:
          type: array
          description: |
            repair 轮次在 begin 时冻结的阻塞键白名单，元素为 `namespace/key`（ADR-0018）。
            首装为空数组；repair 期间 apply 只接受白名单内的键。
          items:
            type: string
        lease_until: {type: string, format: date-time}
        version:
          type: integer
          format: int64
        last_error: {type: string}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    InstallGap:
      type: object
      description: |
        缺失的必填键（ADR-0018）。`status.gaps` 与 `apply.remaining_gaps` 用它回答
        「为什么进程起不来」，前端据此高亮需要填写的字段。
      required: [namespace, key, reason]
      properties:
        namespace: {type: string}
        key: {type: string}
        reason:
          type: string
          enum: [no_active_release, missing_in_snapshot]
          description: |
            `no_active_release`：该 namespace 尚无生效指针（首装）；
            `missing_in_snapshot`：指针存在但快照里缺这个必填键（升级/修复）。
  responses:
    BadRequest:
      description: 参数非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40000
            message: invalid json
            trace_id: a1b2c3d4e5f60708
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40100
            message: unauthorized
            trace_id: a1b2c3d4e5f60708
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40300
            message: forbidden
            trace_id: a1b2c3d4e5f60708
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40400
            message: not found
            trace_id: a1b2c3d4e5f60708
    Conflict:
      description: 状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 40900
            message: resource state conflict
            trace_id: a1b2c3d4e5f60708
    TooManyRequests:
      description: 限流或配额耗尽
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 42900
            message: too many requests
            trace_id: a1b2c3d4e5f60708
    InternalError:
      description: 内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 50000
            message: internal error
            trace_id: a1b2c3d4e5f60708
    ServiceUnavailable:
      description: 依赖不可用（鉴权等关键依赖无法完成判定时失败关闭；带 Retry-After）
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 50300
            message: service temporarily unavailable
            trace_id: a1b2c3d4e5f60708
    SCIMBadRequest:
      description: SCIM 协议错误（RFC 7644 3.12）；scimType=invalidSyntax / invalidValue / invalidPath / invalidFilter / noTarget / mutability
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/SCIMError"
          example:
            schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
            status: "400"
            scimType: invalidValue
            detail: externalId is required
    SCIMUnauthorized:
      description: SCIM 令牌缺失或无效；只接受 scim_ 前缀令牌
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/SCIMError"
    SCIMNotFound:
      description: 资源不存在或已删除
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/SCIMError"
    SCIMConflict:
      description: 唯一性冲突（scimType=uniqueness）
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/SCIMError"
          example:
            schemas: ["urn:ietf:params:scim:api:messages:2.0:Error"]
            status: "409"
            scimType: uniqueness
            detail: externalId already exists
    SCIMPreconditionFailed:
      description: If-Match 与资源版本不匹配
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/SCIMError"
    SCIMTooManyRequests:
      description: 超过单令牌或单 IP 限流；带 Retry-After
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/SCIMError"
