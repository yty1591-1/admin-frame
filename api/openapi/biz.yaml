openapi: 3.0.3
info:
  title: Biz API (B)
  version: 3.0.0
  description: |
    商家/企业端。数据范围强制 Token 内 `merchant_id`。
    破坏性变更须提升本文件 `info.version` 的 **major**（见 `docs/API_STANDARDS.md`）。
    2.0.0：生产级信封/分页上限/错误模型（相对 1.0.0 骨架契约）。
    3.0.0：移除订单演示域契约（破坏性）。
servers:
  - url: http://localhost:8082
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
  - name: iam
    description: 本商户角色、授权与绑定（自助管理）
paths:
  /healthz:
    get:
      tags: [probe]
      summary: Liveness
      operationId: bizHealthz
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [probe]
      summary: Readiness
      operationId: bizReadyz
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /version:
    get:
      tags: [probe]
      summary: Build version
      operationId: bizVersion
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /biz/v1/iam/permissions:
    get:
      tags: [iam]
      summary: 权限点目录（分页）
      description: 需要 `iam:role:read`（B 端不使用 A 端专属的 iam:permission:read）。目录为只读基线，变更走迁移与发布。
      operationId: bizListIAMPermissions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: channel
          description: 按端别过滤；空表示全部
          schema:
            $ref: "#/components/schemas/Channel"
        - in: query
          name: keyword
          description: 按权限码 / 名称模糊匹配
          schema:
            type: string
        - $ref: "./components.yaml#/components/parameters/Page"
        - $ref: "./components.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PermissionListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/permissions/tree:
    get:
      tags: [iam]
      summary: 权限点目录（树）
      description: 需要 `iam:role:read`（B 端不使用 A 端专属的 iam:permission:read）。用于管理端菜单/授权界面渲染。
      operationId: bizIAMPermissionTree
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: channel
          schema:
            $ref: "#/components/schemas/Channel"
        - in: query
          name: keyword
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PermissionTreeNode"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/roles:
    get:
      tags: [iam]
      summary: 角色列表
      description: 需要 `iam:role:read`。本端强制按 Principal 的 merchant_id 收窄，并拒绝 channel=admin 的创建请求。
      operationId: bizListIAMRoles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: channel
          schema:
            $ref: "#/components/schemas/Channel"
        - in: query
          name: merchant_id
          description: A 端可选；B 端忽略并由令牌决定
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/RoleStatus"
        - in: query
          name: keyword
          description: 按角色码 / 名称模糊匹配
          schema:
            type: string
        - $ref: "./components.yaml#/components/parameters/Page"
        - $ref: "./components.yaml#/components/parameters/PageSize"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RoleListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: 创建角色
      description: 需要 `iam:role:write`。权限码必须存在于目录且与端别匹配。
      operationId: bizCreateIAMRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/roles/{id}:
    get:
      tags: [iam]
      summary: 角色详情（含绑定数）
      description: 需要 `iam:role:read`。
      operationId: bizGetIAMRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    patch:
      tags: [iam]
      summary: 更新角色基础信息 / 启停
      description: 需要 `iam:role:write`。需提供 `version`（或 `If-Match`）。
      operationId: bizUpdateIAMRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    delete:
      tags: [iam]
      summary: 软删角色
      description: |
        需要 `iam:role:write`。版本可由 body `version` 或 `If-Match` 提供；
        仍存在绑定时返回 40900（须先解绑）。
      operationId: bizDeleteIAMRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoleRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IdOnly"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/roles/{id}/permissions:
    put:
      tags: [iam]
      summary: 全量替换角色权限与数据范围
      description: |
        需要 `iam:role:grant`。语义为全量替换，响应返回 added / removed 差量；
        `data_scopes` 省略表示不修改，空数组表示清空。审计记录差量。
      operationId: bizReplaceIAMRolePermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePermissionsRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReplacePermissionsData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/roles/{id}/clone:
    post:
      tags: [iam]
      summary: 复制角色
      description: 需要 `iam:role:write`。新角色为 disabled 状态，需显式启用。
      operationId: bizCloneIAMRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneRoleRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/bindings:
    get:
      tags: [iam]
      summary: 查询绑定
      description: 需要 `iam:binding:read`。`role_id` 优先；否则按 subject 查询。
      operationId: bizListIAMBindings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role_id
          schema:
            type: string
        - in: query
          name: subject_type
          schema:
            $ref: "#/components/schemas/SubjectType"
        - in: query
          name: subject_id
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BindingListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: 绑定主体角色
      description: |
        需要 `iam:binding:write`。校验：主体与角色同端别、同商户；角色须 enabled；
        单主体绑定数受 `iam.limits.max_bindings_per_subject` 约束（只统计未过期绑定）。
        同一 (主体, 角色) 重复绑定不会新增行：刷新 `expires_at` / `granted_by` 并保留原 ID，
        因此过期后重新绑定会立即重新生效。
      operationId: bizCreateIAMBinding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBindingRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Binding"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/bindings/{id}:
    delete:
      tags: [iam]
      summary: 解绑
      description: 需要 `iam:binding:write`。删除后主动失效该主体快照。
      operationId: bizDeleteIAMBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BindingID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnbindRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IdOnly"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/change-requests:
    get:
      tags: [iam]
      summary: 本商户审批单列表
      description: |
        需要 `iam:change:request`。只返回本商户的审批单，商户来自 Token（Principal），
        query 中的 channel / merchant_id 一律忽略。按申请时间倒序，page_size 上限 100。
      operationId: bizListIAMChangeRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 审批状态过滤
          schema:
            $ref: "#/components/schemas/ChangeStatus"
        - name: action
          in: query
          required: false
          description: 变更动作过滤
          schema:
            $ref: "#/components/schemas/ChangeAction"
        - name: requested_by
          in: query
          required: false
          description: 申请人主体 ID 过滤
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequestListData"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
    post:
      tags: [iam]
      summary: 发起变更申请
      description: |
        需要 `iam:change:request`。审批单记录「待执行的变更」而不立即生效；
        channel 固定为 biz，merchant_id 只来自 Token，载荷中出现 merchant_id 返回 40300。
        breakglass_request 属于平台级能力，B 端固定返回 40300。
      operationId: bizCreateIAMChangeRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/change-requests/{id}/approve:
    post:
      tags: [iam]
      summary: 通过审批单
      description: |
        需要 `iam:change:review`。审批人不得与申请人相同，自审返回 40300（SoD）；
        跨商户访问返回 40400（不泄露存在性）；非 pending 或版本不一致返回 40900。
      operationId: bizApproveIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/change-requests/{id}/reject:
    post:
      tags: [iam]
      summary: 拒绝审批单
      description: 需要 `iam:change:review`。同样适用职责分离与跨商户 40400。
      operationId: bizRejectIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/change-requests/{id}/cancel:
    post:
      tags: [iam]
      summary: 撤销审批单
      description: 需要 `iam:change:request`。只有申请人本人可撤销 pending 单据。
      operationId: bizCancelIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/change-requests/{id}/apply:
    post:
      tags: [iam]
      summary: 应用审批单
      description: |
        需要 `iam:change:review`。仅 approved 单据可应用；目标变更与审批单状态同事务提交，
        失败保持 approved 可重试。目标角色 / 绑定必须属于本商户，跨商户返回 40400。
      operationId: bizApplyIAMChangeRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ChangeRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideChangeRequestRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChangeRequest"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "409":
          $ref: "./components.yaml#/components/responses/Conflict"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/subjects/{subject_type}/{subject_id}/permissions:
    get:
      tags: [iam]
      summary: 主体有效权限（快照）
      description: 需要 `iam:binding:read`。B 端只能查询本商户主体。
      operationId: bizGetIAMSubjectPermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SubjectTypePath"
        - $ref: "#/components/parameters/SubjectIDPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SubjectPermissions"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./components.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
  /biz/v1/iam/me/permissions:
    get:
      tags: [iam]
      summary: 当前主体权限
      description: 仅需认证，不额外要求权限点。返回调用者自身的有效权限快照。
      operationId: bizGetIAMMePermissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SubjectPermissions"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
components:
  parameters:
    RoleID:
      name: id
      in: path
      required: true
      description: 角色 ID
      schema:
        type: string
        minLength: 1
    BindingID:
      name: id
      in: path
      required: true
      description: 绑定 ID
      schema:
        type: string
        minLength: 1
    SubjectTypePath:
      name: subject_type
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SubjectType"
    SubjectIDPath:
      name: subject_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IfMatchVersion:
      name: If-Match
      in: header
      required: false
      description: 期望版本号（与 body.version 二选一，冲突返回 40000）
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
    ChangeRequestID:
      name: id
      in: path
      required: true
      description: 审批单 ID
      schema:
        type: string
        minLength: 1

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "演示 Token：biz.<merchant_id>.<subject_id>（生产替换为 B 端独立 JWT）"
  schemas:
    VersionInfo:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: biz-api
        version:
          type: string
          example: 1.4.2
        commit:
          type: string
          description: git commit（RELS-03）；本地可为 none
          example: abcdef0
        build_time:
          type: string
          description: UTC 构建时间（RELS-03）
          example: "2026-10-13T12:00:00Z"
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              error:
                type: string
    # ---- IAM ----
    Channel:
      type: string
      description: 端别；IAM 角色与绑定必须与端别一致
      enum: [admin, biz]
    RoleStatus:
      type: string
      enum: [active, disabled]
    RoleType:
      type: string
      enum: [system, custom, breakglass]
    SubjectType:
      type: string
      description: staff 仅 A 端；merchant_staff 仅 B 端
      enum: [staff, merchant_staff]
    DataScopeType:
      type: string
      description: all / merchant_set 仅 A 端允许
      enum: [all, merchant, self, merchant_set]
    DataScope:
      type: object
      required: [resource, scope_type]
      properties:
        resource:
          type: string
          description: 资源段："*" 或权限码首段（如 iam）
          example: iam
        scope_type:
          $ref: "#/components/schemas/DataScopeType"
        merchant_ids:
          type: array
          description: 仅 scope_type=merchant_set 使用，最多 100 个
          items:
            type: string
    Permission:
      type: object
      required: [code, name, channel, kind, data_bearing, status, sort]
      properties:
        code:
          type: string
          description: 稳定权限码，形如 domain:resource:action
          example: iam:role:read
        name:
          type: string
        channel:
          type: string
          description: admin / biz / both
          enum: [admin, biz, both]
        kind:
          type: string
          enum: [api, menu, button]
        data_bearing:
          type: boolean
          description: 为 true 时角色必须声明对应数据范围
        status:
          type: string
          enum: [active, deprecated]
        sort:
          type: integer
        parent_code:
          type: string
        path:
          type: string
        description:
          type: string
    PermissionTreeNode:
      allOf:
        - $ref: "#/components/schemas/Permission"
        - type: object
          properties:
            children:
              type: array
              items:
                $ref: "#/components/schemas/PermissionTreeNode"
    PermissionListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        total:
          type: integer
    Role:
      type: object
      required:
        - id
        - channel
        - scope_type
        - code
        - name
        - role_type
        - status
        - version
        - permissions
        - data_scopes
        - created_at
        - updated_at
      properties:
        id:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        scope_type:
          type: string
          description: 角色作用域；A 端为 admin，B 端为 merchant
          enum: [admin, merchant]
        merchant_id:
          type: string
        code:
          type: string
          description: 端别内唯一角色码
        name:
          type: string
        description:
          type: string
        role_type:
          $ref: "#/components/schemas/RoleType"
        status:
          $ref: "#/components/schemas/RoleStatus"
        version:
          type: integer
          format: int64
          description: 乐观锁版本；写接口必须回传
        permissions:
          type: array
          items:
            type: string
        data_scopes:
          type: array
          items:
            $ref: "#/components/schemas/DataScope"
        binding_count:
          type: integer
          description: 仅详情返回
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoleListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        total:
          type: integer
    CreateRoleRequest:
      type: object
      required: [code, name, scope_type, permissions]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        scope_type:
          type: string
          enum: [admin, merchant]
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        data_scopes:
          type: array
          items:
            $ref: "#/components/schemas/DataScope"
        reason:
          type: string
          description: 变更原因，写入审计
    UpdateRoleRequest:
      type: object
      required: [version]
      description: |
        nil 字段表示不修改；至少提供一个字段，否则 40000。
        status=disabled 属高风险变更：`iam.security.require_reason=true` 时 `reason` 必填。
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/RoleStatus"
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          description: 变更原因，写入审计；停用角色时强制
    ReplacePermissionsRequest:
      type: object
      required: [permissions, version]
      properties:
        permissions:
          type: array
          description: 全量替换；空数组表示清空
          items:
            type: string
        data_scopes:
          type: array
          description: 省略表示不修改；空数组表示清空
          items:
            $ref: "#/components/schemas/DataScope"
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
    ReplacePermissionsData:
      type: object
      required: [role, added, removed]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
    CloneRoleRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    DeleteRoleRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
    Binding:
      type: object
      required:
        [id, channel, subject_type, subject_id, role_id, granted_by, created_at]
      properties:
        id:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        subject_type:
          $ref: "#/components/schemas/SubjectType"
        subject_id:
          type: string
        merchant_id:
          type: string
        role_id:
          type: string
        expires_at:
          type: string
          format: date-time
          description: 空表示永久绑定
        granted_by:
          type: string
        created_at:
          type: string
          format: date-time
    BindingListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Binding"
        total:
          type: integer
    CreateBindingRequest:
      type: object
      required: [subject_type, subject_id, role_id]
      properties:
        subject_type:
          $ref: "#/components/schemas/SubjectType"
        subject_id:
          type: string
          minLength: 1
        role_id:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
          description: 可选；必须晚于当前时间
        reason:
          type: string
    UnbindRequest:
      type: object
      properties:
        reason:
          type: string
    SubjectPermissions:
      type: object
      required:
        [
          channel,
          subject_type,
          subject_id,
          roles,
          permissions,
          data_scopes,
          snapshot_version,
          generated_at,
        ]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        subject_type:
          $ref: "#/components/schemas/SubjectType"
        subject_id:
          type: string
        merchant_id:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        data_scopes:
          type: array
          items:
            $ref: "#/components/schemas/DataScope"
        snapshot_version:
          type: integer
          format: int64
        generated_at:
          type: string
          format: date-time
    IdOnly:
      type: object
      required: [id]
      properties:
        id:
          type: string
    ChangeStatus:
      type: string
      description: |
        审批单状态机：pending → approved → applied；
        pending → rejected；pending → cancelled。终态不可再流转。
      enum: [pending, approved, rejected, applied, cancelled]
    ChangeAction:
      type: string
      description: |
        B 端可申请的动作；breakglass_request 属平台级能力，B 端固定返回 40300。
      enum:
        - role_create
        - role_update
        - role_permission_replace
        - role_clone
        - role_delete
        - binding_create
        - binding_delete
    ChangeTargetType:
      type: string
      enum: [iam_role, iam_binding]
    ChangeRequest:
      type: object
      required:
        - id
        - channel
        - action
        - target_type
        - status
        - reason
        - requested_by
        - requested_at
        - version
      description: B 端响应不回显 merchant_id（商户取自 Token，回显无信息增益）
      properties:
        id:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        action:
          $ref: "#/components/schemas/ChangeAction"
        target_type:
          $ref: "#/components/schemas/ChangeTargetType"
        target_id:
          type: string
          description: 目标聚合 ID；新建类动作为空，应用成功后才回填
        payload:
          type: object
          description: 申请载荷原样返回，便于审批人核对；不得包含敏感字段
          additionalProperties: true
        status:
          $ref: "#/components/schemas/ChangeStatus"
        reason:
          type: string
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    ChangeRequestListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRequest"
        total:
          type: integer
    CreateChangeRequestRequest:
      type: object
      required: [action, payload, reason]
      properties:
        channel:
          description: 可选；只能为空或 biz，传 admin 返回 40000
          allOf:
            - $ref: "#/components/schemas/Channel"
        action:
          $ref: "#/components/schemas/ChangeAction"
        target_id:
          type: string
          description: 新建类动作可为空；其它动作必填
        payload:
          type: object
          description: |
            动作载荷，JSON 对象，最大 16 KiB，未知字段返回 40000；
            禁止包含 merchant_id（返回 40300）与 token / secret 等敏感字段。
          additionalProperties: true
        reason:
          type: string
    DecideChangeRequestRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: 乐观锁版本；与当前审批单不一致返回 40900
        reason:
          type: string
