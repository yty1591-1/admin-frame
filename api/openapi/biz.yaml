components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "B 端 JWT（Bearer）。merchant_id 由令牌声明推导，不接受请求参数覆盖。仅 auth.mode=demo 的本地/测试形态使用演示令牌 biz.<merchant_id>.<subject_id>，生产禁止。"

