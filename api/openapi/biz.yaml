openapi: 3.0.3
info:
  title: Biz API (B)
  version: 6.1.0
  description: |
    商家/企业端。数据范围强制 Token 内 `merchant_id`。
    破坏性变更须提升本文件 `info.version` 的 **major**（见 `docs/API_STANDARDS.md`）。
    6.0.0：B 端令牌 claims 新增 `current_tenant` 声明（T-22，当前生效租户）——
    旧令牌无该声明时以 `merchant_id` 兜底（行为明确定义，非破坏性）；
    新增 `POST /biz/v1/auth/tenant-switch` 租户切换端点（同会话重签，写审计）。
    2.0.0：生产级信封/分页上限/错误模型（相对 1.0.0 骨架契约）。
    3.0.0：移除历史订单契约（破坏性）。
    4.0.0：`Permission` 移除 `action` / `kind` / `parent_code` / `path`，`resource` 改为服务端生成（破坏性）；
    新增 `GET /biz/v1/menus` 与 `MenuTreeNode`；移除冗余的 `/biz/v1/iam/permissions/tree`。
    5.0.0：`GET /biz/v1/menus` 重命名为 `GET /biz/v1/iam/me/menus`，与 `/iam/me/permissions` 对齐（破坏性）。
    5.1.0：新增 `GET /biz/v1/me`（当前主体资料），与 A 端 `/admin/v1/me` 字段对齐。
    5.2.0：新增 `PATCH /biz/v1/me` 与 `MeView.display_name`（纯增量），支持自助修改展示昵称。
servers:
  - url: http://localhost:8082
    description: 本地直连（make run-biz）
  - url: http://biz.localhost
    description: 开发集群（deploy values-dev.yaml）。Ingress path /biz 原样转发，路径已含 /biz/v1，勿重复拼接
  - url: https://biz.staging.example.com
    description: 预发（deploy values-staging.yaml）
  - url: https://biz.example.com
    description: 生产（deploy values-prod.yaml）
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
  - name: iam
    description: 本商户角色、授权与绑定（自助管理）
  - name: auth
    description: |
      身份认证：密码登录、一次性刷新与登出。令牌不携带角色，权限以 IAM 快照为唯一来源；
      错误码覆盖 40000 / 40100 / 42900 / 50300。
