components:
  schemas:
    # 审计事件（AUD-04 必填字段全集）。
    AuditEvent:
      type: object
      required:
        [event_id, action, actor_id, channel, resource_type, resource_id, outcome, occurred_at, trace_id, service]
      properties:
        event_id:
          type: string
          description: 事件 ID（雪花 ID），重复投递的幂等键。
        action:
          type: string
          description: 稳定动作枚举，见 `docs/audit/EVENTS.md`。
          example: auth.login
        actor_id:
          type: string
          description: 操作者主体 ID。
        actor_type:
          type: string
          description: 操作者类型：user / admin / system。
        channel:
          type: string
          enum: [admin, biz, c, worker]
        merchant_id:
          type: string
          description: B 端商户 ID；A / C 端为空。
        resource_type:
          type: string
          description: 目标资源类型，如 account / session / iam_role。
        resource_id:
          type: string
          description: 目标资源 ID。
        outcome:
          type: string
          enum: [success, failure, denied]
        occurred_at:
          type: string
          format: date-time
          description: 事件发生时间（UTC）。
        trace_id:
          type: string
          description: 请求追踪 ID；定时任务以事件 ID 兜底。
        service:
          type: string
          description: 产生事件的服务名。
        reason:
          type: string
          description: 操作原因；禁止包含 PII 与密钥（AUD-08）。
        attrs:
          type: object
          additionalProperties:
            type: string
          description: 附加结构化字段；禁止包含敏感原文。

    AuditEventListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        total:
          type: integer

    # 异步导出任务状态（ENT-04 T5）。
    AuditExportJob:
      type: object
      required: [export_id, status, rows, created_at, expires_at]
      properties:
        export_id:
          type: string
          description: 任务 ID，同时是下载资源标识。
        status:
          type: string
          enum: [pending, running, succeeded, failed, expired]
          description: 任务状态；succeeded 且未过期时才有下载路径。
        rows:
          type: integer
          description: 成功导出的行数；未完成时为 0。
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 文件保留截止时间；到期后文件删除、状态置 expired。
        finished_at:
          type: string
          format: date-time
          description: 进入终态的时间；进行中不返回。
        download_path:
          type: string
          description: 可下载时的相对路径（仍需 `audit:read`）；否则为空。
          example: /admin/v1/audit/exports/1234567890/download
        error:
          type: string
          description: 终态失败原因（截断）；成功时不返回。
