# M2：业务密钥管理端 Schema（仅 A 端）。
#
# 明文永不出现在列表 / 详情 / 导出响应中；仅创建与轮换请求体可携带一次性明文。
# 指纹为 SHA-256(plaintext) 前 8 字节 hex（ADR-0014）。
components:
  schemas:
    ConfigSecret:
      type: object
      description: 业务密钥元数据（脱敏；无明文 / 密文 / DEK）。
      properties:
        id:
          type: integer
          format: int64
        env:
          type: string
          enum: [local, dev, test, staging, prod]
        namespace:
          type: string
        name:
          type: string
          description: 小写点分密钥名（如 notification.smtp.password）。
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [draft, pending_review, active, rejected, revoked, destroyed]
        active_version:
          type: integer
          format: int64
          nullable: true
        version:
          type: integer
          format: int64
          description: 元数据乐观锁版本。
        fingerprint:
          type: string
          description: 当前 active 版本指纹；无版本时为空。
        rotate_interval_days:
          type: integer
        dual_version:
          type: boolean
        pending_action:
          type: string
          description: 待审动作（rotate/revoke/grant）；空表示无待审变更。
          enum: ["", rotate, revoke, grant]
        submitted_by:
          type: string
          description: 最近一次送审主体；审批人不得相同。
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - env
        - namespace
        - name
        - description
        - owner
        - status
        - version
        - fingerprint
        - rotate_interval_days
        - dual_version
        - created_by
        - updated_by
        - created_at
        - updated_at

    ConfigSecretListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigSecret"
        total:
          type: integer

    ConfigSecretCreateRequest:
      type: object
      required: [env, namespace, name, owner, plaintext]
      properties:
        env:
          type: string
          enum: [local, dev, test, staging, prod]
        namespace:
          type: string
        name:
          type: string
        description:
          type: string
          default: ""
        owner:
          type: string
        plaintext:
          type: string
          description: 一次性明文；响应不回显。
          writeOnly: true
        dual_version:
          type: boolean
          default: false
        rotate_interval_days:
          type: integer
          default: 90
        expires_at:
          type: string
          format: date-time
          nullable: true

    ConfigSecretRotateRequest:
      type: object
      required: [plaintext]
      properties:
        plaintext:
          type: string
          writeOnly: true
        comment:
          type: string
          default: ""

    ConfigSecretActivateRequest:
      type: object
      required: [break_glass, break_glass_reason]
      properties:
        break_glass:
          type: boolean
          description: 必须为 true；激活历史版本绕过轮换审批（CC-R-14）。
        break_glass_reason:
          type: string
          description: 破玻璃原因；审计后须在 24h 内补审。

    ConfigSecretRevokeRequest:
      type: object
      properties:
        comment:
          type: string
          default: ""

    ConfigSecretReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        comment:
          type: string
          default: ""

    ConfigSecretVersion:
      type: object
      description: 密钥版本元数据；不含密文 / DEK / nonce。
      properties:
        version:
          type: integer
          format: int64
        fingerprint:
          type: string
        status:
          type: string
          enum: [active, grace, revoked, destroyed]
        algorithm:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required: [version, fingerprint, status, algorithm, created_by, created_at]

    ConfigSecretVersionListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigSecretVersion"
        total:
          type: integer

    ConfigSecretGrant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        env:
          type: string
        namespace:
          type: string
        service_identity:
          type: string
          description: 证书 SAN / SPIFFE ID；禁止通配符。
        permission:
          type: string
          enum: [resolve]
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - env
        - namespace
        - service_identity
        - permission
        - created_by
        - created_at

    ConfigSecretGrantListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigSecretGrant"
        total:
          type: integer

    ConfigSecretGrantCreateRequest:
      type: object
      required: [service_identity]
      properties:
        service_identity:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true

    ConfigSecretAccess:
      type: object
      description: 解析访问审计摘要（不含明文）。
      properties:
        occurred_at:
          type: string
          format: date-time
        service_identity:
          type: string
        secret_name:
          type: string
        secret_version:
          type: integer
          format: int64
        result:
          type: string
          enum: [ok, denied, not_found, kms_unavailable, error]
        trace_id:
          type: string
      required:
        - occurred_at
        - service_identity
        - secret_name
        - secret_version
        - result
        - trace_id

    ConfigSecretAccessListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigSecretAccess"
        total:
          type: integer
