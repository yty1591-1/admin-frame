components:
  schemas:
    # 租户（ENT-09，隔离边界；B 端 merchant_id 取同一 id，见 ADR-0006）。
    Tenant:
      type: object
      required: [id, code, name, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          description: 租户 ID；B 端各表的 `merchant_id` 即此值。
          example: "1970000000000000001"
        code:
          type: string
          maxLength: 64
          description: |
            业务编码（T-11），全局唯一，仅允许小写字母、数字与 `.` `_` `-`。
            未显式提供时以租户 ID 兜底；创建后不可变（外部对账引用）。
          example: acme-co
        name:
          type: string
          maxLength: 128
          description: 租户名称（企业 / 商户简称）。
          example: 示例科技
        status:
          type: string
          enum: [pending, active, suspended, terminated]
          description: |
            生命周期状态。`pending` 未开通、`active` 正常服务、`suspended` 停用（数据保留、可恢复）、
            `terminated` 已终止（终态，不可恢复）。
        plan_id:
          type: string
          description: 开账套餐（T-24）；配额已在创建时物化进配额列表，本字段用于对账与报表。
        status_reason:
          type: string
          maxLength: 255
          description: 最近一次状态变更原因；停用与终止必填。
        contact_name:
          type: string
          maxLength: 64
          description: 联系人姓名（T-11）；可空。
        contact_email:
          type: string
          maxLength: 128
          description: 联系邮箱（T-11）；可空。
        industry:
          type: string
          maxLength: 64
          description: 所属行业（T-11）；可空。
        timezone:
          type: string
          maxLength: 64
          description: IANA 时区（T-11），如 `Asia/Shanghai`；可空。
        locale:
          type: string
          maxLength: 16
          description: 语言标签（T-11），如 `zh-CN`；可空。
        external_id:
          type: string
          maxLength: 128
          description: 外部系统 ID（T-11，CRM / 结算）；可空。
        version:
          type: integer
          format: int64
          description: 乐观锁版本；每次成功迁移或资料变更 +1，可用于检测并发变更。
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次停用时间；恢复后仍保留，供回溯。
        terminated_at:
          type: string
          format: date-time
          nullable: true
          description: 终止时间；非空即终态。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # 创建租户请求。
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: 租户名称；首尾空白会被去除，空值返回 40000。
        code:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9._-]+$'
          description: |
            业务编码（T-11）；省略时以租户 ID 兜底。重复返回 40900，
            创建后不可变。
        plan_code:
          type: string
          description: |
            套餐编码（T-24）；省略时使用默认套餐（`standard`）。
            未知编码返回 40400。套餐配额在创建时物化，之后改套餐不影响本租户。
        owner_subject_id:
          type: string
          maxLength: 64
          description: |
            首名 owner 的主体 ID（T-12）；可选——允许「先建租户、迁移成员、再开通」
            两步操作，但开通（activate）前必须存在至少一名在册 owner，否则返回 40900。

    # 资料变更请求（T-11）。
    TenantUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        全部字段可选，至少提供一个（缺失返回 40000）。字段缺省表示不变；
        显式传空串表示清空该字段。`code` 不可变，不在本请求中。
      properties:
        name:
          type: string
          maxLength: 128
        contact_name:
          type: string
          maxLength: 64
        contact_email:
          type: string
          maxLength: 128
          description: 须包含 `@` 且不含空白，否则返回 40000。
        industry:
          type: string
          maxLength: 64
        timezone:
          type: string
          maxLength: 64
          description: IANA 时区标签，如 `Asia/Shanghai`。
        locale:
          type: string
          maxLength: 16
          description: 语言标签，如 `zh-CN`。
        external_id:
          type: string
          maxLength: 128
        expected_version:
          type: integer
          format: int64
          description: 期望的乐观锁版本（T-15）；与 `If-Match` 头二选一，不符返回 40900（消息携带当前版本）。
      anyOf:
        - required: [name]
        - required: [contact_name]
        - required: [contact_email]
        - required: [industry]
        - required: [timezone]
        - required: [locale]
        - required: [external_id]

    # 状态迁移请求（activate / resume 可省略请求体）。
    TenantTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 255
          description: 迁移原因；`suspend` 与 `terminate` 必填，缺失返回 40000。
        expected_version:
          type: integer
          format: int64
          description: |
            期望的乐观锁版本（T-15）；与 `If-Match` 头二选一，同时提供时必须一致。
            版本不符返回 40900（消息携带当前版本）。版本可从详情响应的 `ETag` 头获取。

    # 租户列表数据。
    TenantListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
          description: 满足过滤条件的总数。
        page:
          type: integer
          description: 当前页码（1-based）。
        page_size:
          type: integer
          description: 每页条数；超过上限时按上限收敛。

    # 租户成员（ENT-09）。停用成员保留记录，不做物理删除。
    TenantMember:
      type: object
      required: [tenant_id, subject_id, role, status, created_at, updated_at]
      properties:
        tenant_id:
          type: string
        subject_id:
          type: string
          description: 成员主体 ID（账号主体）。
        role:
          type: string
          enum: [owner, admin, member]
          description: |
            `owner` 管理成员与租户自身（每个租户至少保留一名在册 owner）；
            `admin` 管业务配置；`member` 只读业务。更细的权限仍由 IAM 解析。
        status:
          type: string
          enum: [active, disabled]
          description: "`disabled` 表示已停用但保留成员关系（离职回溯与审计需要）。"
        created_at:
          type: string
          format: date-time
          description: 首次加入时间；改角色或停用再启用不会重置。
        updated_at:
          type: string
          format: date-time

    TenantMemberCreateRequest:
      type: object
      additionalProperties: false
      required: [subject_id, role]
      properties:
        subject_id:
          type: string
          maxLength: 64
        role:
          type: string
          enum: [owner, admin, member]

    TenantMemberUpdateRequest:
      type: object
      additionalProperties: false
      description: "`role` 与 `status` 至少提供一个；同时提供时先改角色再改状态。"
      properties:
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, disabled]
        reason:
          type: string
          maxLength: 255
          description: 启停原因，写入审计。

    TenantMemberListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantMember"
        total:
          type: integer
        page:
          type: integer
          description: 当前页码（1-based）。
        page_size:
          type: integer
          description: 每页条数；超过上限时按上限收敛。

    # 租户配额（ENT-09 定义上限，ENT-14 执行）。
    TenantQuota:
      type: object
      required: [tenant_id, resource, limit, updated_at]
      properties:
        tenant_id:
          type: string
        resource:
          type: string
          description: 资源键，仅允许小写字母、数字与 `.` `_` `-`，如 `user` / `api.rps` / `storage.mb`。
        limit:
          type: integer
          format: int64
          description: 上限；`-1` 表示不限。
        updated_at:
          type: string
          format: date-time

    TenantQuotaSetRequest:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit:
          type: integer
          format: int64
          minimum: -1
          description: 上限；-1 表示不限。缺失返回 40000（与「设为 0」区分）。

    TenantQuotaListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantQuota"
        total:
          type: integer

    # 租户成员邀请（ENT-09 T-14）。token 摘要化存储，明文仅创建/重发时下发一次。
    TenantInvitation:
      type: object
      required: [id, tenant_id, email, role, status, invited_by, expires_at, created_at, updated_at]
      properties:
        id:
          type: string
          description: 邀请 ID。
        tenant_id:
          type: string
        email:
          type: string
          maxLength: 128
          description: 被邀请人邮箱；邮件投递依赖 ENT-10，就绪前仅记录（线下转交 token）。
        role:
          type: string
          enum: [owner, admin, member]
          description: 受邀角色；接受时据此建立成员关系。
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
          description: |
            生命周期：`pending` 待处理；`accepted` 已接受（重复接受幂等）；
            `revoked` 已撤销；`expired` 已过期（接受时惰性判定回写）。
        invited_by:
          type: string
          description: 发起邀请的操作者主体。
        accepted_by:
          type: string
          description: 实际接受的主体（与 email 解耦）；仅 accepted 状态存在。
        expires_at:
          type: string
          format: date-time
          description: 过期时间；默认 7 天，重发时顺延。
        accepted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantInvitationCreateRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 128
          description: 须包含 `@` 且不含空白；同租户同邮箱仅一个 pending 邀请（重复返回 40900，走 resend）。
        role:
          type: string
          enum: [owner, admin, member]

    # 创建 / 重发响应：明文 token 仅此一次下发，服务端只存 SHA-256 摘要。
    TenantInvitationWithToken:
      allOf:
        - $ref: "#/components/schemas/TenantInvitation"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 一次性明文 token；ENT-10 就绪前由运营线下转交，泄露时用 resend 轮换。

    TenantInvitationAcceptRequest:
      type: object
      additionalProperties: false
      required: [token, subject_id]
      properties:
        token:
          type: string
          description: 创建 / 重发响应中下发的一次性明文 token；无效统一 400（防枚举）。
        subject_id:
          type: string
          maxLength: 64
          description: 实际接受邀请的主体 ID（成员关系的键，与 email 解耦）。

    TenantInvitationAcceptData:
      type: object
      required: [member, invitation, idempotent]
      properties:
        member:
          $ref: "#/components/schemas/TenantMember"
        invitation:
          $ref: "#/components/schemas/TenantInvitation"
        idempotent:
          type: boolean
          description: 为 true 表示重复接受（同一主体此前已生效），成员关系不变。

    TenantInvitationRevokeRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 255
          description: 撤销原因，写入审计。

    TenantInvitationListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantInvitation"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
