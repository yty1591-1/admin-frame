components:
  schemas:
    # 租户（ENT-09，隔离边界；B 端 merchant_id 取同一 id，见 ADR-0006）。
    Tenant:
      type: object
      required: [id, name, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          description: 租户 ID；B 端各表的 `merchant_id` 即此值。
          example: "1970000000000000001"
        name:
          type: string
          maxLength: 128
          description: 租户名称（企业 / 商户简称）。
          example: 示例科技
        status:
          type: string
          enum: [pending, active, suspended, terminated]
          description: |
            生命周期状态。`pending` 未开通、`active` 正常服务、`suspended` 停用（数据保留、可恢复）、
            `terminated` 已终止（终态，不可恢复）。
        status_reason:
          type: string
          maxLength: 255
          description: 最近一次状态变更原因；停用与终止必填。
        version:
          type: integer
          format: int64
          description: 乐观锁版本；每次成功迁移 +1，可用于检测并发变更。
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次停用时间；恢复后仍保留，供回溯。
        terminated_at:
          type: string
          format: date-time
          nullable: true
          description: 终止时间；非空即终态。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # 创建租户请求。
    TenantCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: 租户名称；首尾空白会被去除，空值返回 40000。

    # 状态迁移请求（activate / resume 可省略请求体）。
    TenantTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 255
          description: 迁移原因；`suspend` 与 `terminate` 必填，缺失返回 40000。

    # 租户列表数据。
    TenantListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
          description: 满足过滤条件的总数。
        page:
          type: integer
          description: 当前页码（1-based）。
        page_size:
          type: integer
          description: 每页条数；超过上限时按上限收敛。

    # 租户成员（ENT-09）。停用成员保留记录，不做物理删除。
    TenantMember:
      type: object
      required: [tenant_id, subject_id, role, status, created_at, updated_at]
      properties:
        tenant_id:
          type: string
        subject_id:
          type: string
          description: 成员主体 ID（账号主体）。
        role:
          type: string
          enum: [owner, admin, member]
          description: |
            `owner` 管理成员与租户自身（每个租户至少保留一名在册 owner）；
            `admin` 管业务配置；`member` 只读业务。更细的权限仍由 IAM 解析。
        status:
          type: string
          enum: [active, disabled]
          description: "`disabled` 表示已停用但保留成员关系（离职回溯与审计需要）。"
        created_at:
          type: string
          format: date-time
          description: 首次加入时间；改角色或停用再启用不会重置。
        updated_at:
          type: string
          format: date-time

    TenantMemberCreateRequest:
      type: object
      additionalProperties: false
      required: [subject_id, role]
      properties:
        subject_id:
          type: string
          maxLength: 64
        role:
          type: string
          enum: [owner, admin, member]

    TenantMemberUpdateRequest:
      type: object
      additionalProperties: false
      description: "`role` 与 `status` 至少提供一个；同时提供时先改角色再改状态。"
      properties:
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, disabled]
        reason:
          type: string
          maxLength: 255
          description: 启停原因，写入审计。

    TenantMemberListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantMember"
        total:
          type: integer

    # 租户配额（ENT-09 定义上限，ENT-14 执行）。
    TenantQuota:
      type: object
      required: [tenant_id, resource, limit, updated_at]
      properties:
        tenant_id:
          type: string
        resource:
          type: string
          description: 资源键，仅允许小写字母、数字与 `.` `_` `-`，如 `user` / `api.rps` / `storage.mb`。
        limit:
          type: integer
          format: int64
          description: 上限；`-1` 表示不限。
        updated_at:
          type: string
          format: date-time

    TenantQuotaSetRequest:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit:
          type: integer
          format: int64
          minimum: -1
          description: 上限；-1 表示不限。缺失返回 40000（与「设为 0」区分）。

    TenantQuotaListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenantQuota"
        total:
          type: integer
