components:
  schemas:
    Permission:
      type: object
      required: [code, name, channel, resource, data_bearing, status, sort]
      properties:
        code:
          type: string
          description: 稳定权限码，形如 domain:resource:action
          example: iam:role:read
        name:
          type: string
        channel:
          type: string
          description: admin / biz / both
          enum: [admin, biz, both]
        resource:
          type: string
          readOnly: true
          description: 资源段，由权限码首段派生（服务端生成），供前端按资源分组
          example: iam
        data_bearing:
          type: boolean
          description: 为 true 时角色必须声明对应数据范围
        status:
          type: string
          enum: [active, deprecated]
        sort:
          type: integer
        description:
          type: string

    PermissionListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        total:
          type: integer
