# M1-3：配置中心管理端 Schema（仅 A 端）。
#
# 敏感项（sensitive=true）的明文不进入管理面：Item / ItemVersion 响应
# 只返回 value_hash，value 字段不出现。时间均为 UTC RFC3339。
components:
  schemas:
    ConfigNamespace:
      type: object
      description: 代码 key spec 已声明的 namespace 及其键数量。
      properties:
        namespace:
          type: string
          description: 小写命名空间标识（如 platform、identity）。
          example: platform
        key_count:
          type: integer
          description: 该 namespace 已声明的键数量。
      required: [namespace, key_count]

    ConfigNamespaceListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigNamespace"
        total:
          type: integer

    ConfigDeclaredKey:
      type: object
      description: 代码 key spec 声明（不含敏感默认值）。
      properties:
        key:
          type: string
        value_type:
          type: string
          enum: [string, int, bool, duration, json]
        default:
          type: string
          description: 代码默认值；敏感键为空。
        description:
          type: string
        owner:
          type: string
        reload_mode:
          type: string
          enum: [startup, hot]
          description: KeySpec 声明的 reloadable 枚举（CFG-02）。
        hot_whitelist:
          type: boolean
          description: |
            是否属于 ADR-0015 运行期热更白名单（HotKeySet）。
            仅 true 时发布后可在刷新周期内热更；false 表示需重启进程才生效。
        sensitive:
          type: boolean
        required:
          type: boolean
        deprecated:
          type: boolean
        enum:
          type: array
          items:
            type: string
      required: [key, value_type, description, owner, reload_mode, hot_whitelist, sensitive, required, deprecated]

    ConfigDeclaredKeyListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigDeclaredKey"
        total:
          type: integer

    ConfigItem:
      type: object
      description: |
        配置键元数据。敏感项不返回 value；value_hash 用于核对内容而不泄露明文。
      properties:
        id:
          type: integer
          format: int64
        env:
          type: string
          enum: [local, dev, test, staging, prod]
        namespace:
          type: string
        key:
          type: string
          description: 小写点分配置键（如 http.timeout）。
        value_type:
          type: string
          enum: [string, int, bool, duration, json]
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [draft, active, deprecated, archived]
        current_version:
          type: integer
          format: int64
          description: 最近一次写入的版本号；0 表示尚无值。
        version:
          type: integer
          format: int64
          description: 元数据乐观锁版本。
        sensitive:
          type: boolean
          description: true 时不返回 value，仅返回 value_hash。
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        value_hash:
          type: string
          description: 当前版本值的 SHA-256；敏感项也返回。
        value:
          type: string
          nullable: true
          description: 仅非敏感项返回当前值；敏感项不出现该字段。
      required:
        - id
        - env
        - namespace
        - key
        - value_type
        - status
        - current_version
        - version
        - sensitive
        - created_by
        - updated_by
        - created_at
        - updated_at

    ConfigItemListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigItem"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    ConfigItemCreate:
      type: object
      required: [env, namespace, key]
      properties:
        env:
          type: string
          enum: [local, dev, test, staging, prod]
        namespace:
          type: string
        key:
          type: string
          description: 必须已在代码 key spec 声明；未声明返回 40000。
        value:
          type: string
          nullable: true
          description: 可选初始值；提供时同时写入版本 1。
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [draft, active, deprecated, archived]
          default: draft
        expires_at:
          type: string
          format: date-time
          nullable: true
        change_summary:
          type: string

    ConfigItemUpdate:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: 只追加新版本，不原地修改。
        change_summary:
          type: string
        expected_version:
          type: integer
          format: int64
          description: 元数据乐观锁版本；不匹配返回 40900。

    ConfigItemTransition:
      type: object
      required: [to]
      properties:
        to:
          type: string
          enum: [draft, active, deprecated, archived]
          description: 目标治理状态；须符合状态机（如 active→deprecated→archived）。
        expected_version:
          type: integer
          format: int64
          description: 元数据乐观锁版本；不匹配返回 40900。

    ConfigItemVersion:
      type: object
      description: 不可变版本快照；敏感项不出现 value。
      properties:
        id:
          type: integer
          format: int64
        item_id:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        value_hash:
          type: string
          description: 值的 SHA-256；敏感项也返回。
        change_summary:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        value:
          type: string
          nullable: true
          description: 仅非敏感项返回；敏感项不出现该字段。
      required: [id, item_id, version, value_hash, created_by, created_at]

    ConfigItemVersionListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigItemVersion"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    ConfigReleaseItem:
      type: object
      description: 发布快照中的一条键版本映射；只含摘要，不含明文。
      properties:
        item_id:
          type: integer
          format: int64
        item_version:
          type: integer
          format: int64
        config_key:
          type: string
        value_hash:
          type: string
      required: [item_id, item_version, config_key, value_hash]

    ConfigReleaseReview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        release_id:
          type: integer
          format: int64
        reviewer:
          type: string
        decision:
          type: string
          enum: [approved, rejected]
        comment:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, release_id, reviewer, decision, created_at]

    ConfigRelease:
      type: object
      description: 不可变发布快照头；生效切换只改释放指针。
      properties:
        id:
          type: integer
          format: int64
        env:
          type: string
          enum: [local, dev, test, staging, prod]
        namespace:
          type: string
        release_no:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, pending_review, approved, active, superseded, rolled_back, rejected, cancelled]
        strategy:
          type: string
          enum: [all, percentage, tenant_list, channel_list, instance_list]
          description: M1 只产生 all（发布即全量生效）；其余取值保留给 P1，当前服务端不会签发。
        target_rule_json:
          type: string
          description: 灰度规则 JSON；M1 恒为空，为 P1 预留。
        snapshot_hash:
          type: string
        snapshot_size:
          type: integer
        snapshot_key_id:
          type: string
          description: 快照签名 Ed25519 密钥版本；未配置签名密钥时省略。
        snapshot_signature:
          type: string
          description: 快照 Ed25519 签名（base64）；未配置签名密钥时省略。
        based_on_release_id:
          type: integer
          format: int64
          nullable: true
        created_by:
          type: string
        submitted_by:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          description: 仅详情返回。
          items:
            $ref: "#/components/schemas/ConfigReleaseItem"
        reviews:
          type: array
          description: 仅详情返回。
          items:
            $ref: "#/components/schemas/ConfigReleaseReview"
      required:
        - id
        - env
        - namespace
        - release_no
        - name
        - status
        - strategy
        - snapshot_hash
        - snapshot_size
        - created_by
        - created_at
        - updated_at

    ConfigReleaseListData:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigRelease"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    ConfigReleaseEntry:
      type: object
      required: [item_id, item_version]
      properties:
        item_id:
          type: integer
          format: int64
        item_version:
          type: integer
          format: int64

    ConfigReleaseCreate:
      type: object
      required: [env, namespace, name, entries]
      properties:
        env:
          type: string
          enum: [local, dev, test, staging, prod]
        namespace:
          type: string
        name:
          type: string
        description:
          type: string
        strategy:
          type: string
          enum: [all]
          default: all
          description: M1 仅支持 all（全量发布）；percentage / tenant_list / channel_list / instance_list 为 P1，传入即 40000。
        target_rule_json:
          type: string
          description: 灰度规则 JSON；M1 不接受，仅为 P1 预留字段。
        entries:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigReleaseEntry"
        based_on_release_id:
          type: integer
          format: int64
          nullable: true

    ConfigReleaseApprove:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        comment:
          type: string
          description: 驳回必填；提交人不得自审（40300）。

    ConfigReleasePublish:
      type: object
      properties:
        expected_pointer_version:
          type: integer
          format: int64
          nullable: true
          description: 释放指针乐观锁；不匹配返回 40900。

    ConfigReleaseRollback:
      type: object
      required: [break_glass, break_glass_reason]
      properties:
        expected_pointer_version:
          type: integer
          format: int64
          nullable: true
        comment:
          type: string
          description: 回滚说明；服务端会生成新 Release 指向历史快照。
        break_glass:
          type: boolean
          description: 必须为 true；回滚绕过双人审批（CC-R-08）。
        break_glass_reason:
          type: string
          description: 破玻璃原因；审计后须在 24h 内补审。

    ConfigReleaseCancel:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: 取消原因；写入审计。
