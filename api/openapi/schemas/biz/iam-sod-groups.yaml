components:
  schemas:
    SodGroup:
      type: object
      required: [id, channel, code, name, max_active_roles, status, version, role_ids, created_at, updated_at]
      properties:
        id:
          type: string
        channel:
          $ref: "./common.yaml#/components/schemas/Channel"
        merchant_id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        max_active_roles:
          type: integer
          minimum: 1
          maximum: 64
        status:
          type: string
          enum: [active, disabled]
        version:
          type: integer
          format: int64
          minimum: 1
        role_ids:
          type: array
          items:
            type: string
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SodGroupListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SodGroup"
        total:
          type: integer

    CreateSodGroupRequest:
      type: object
      required: [code, name, role_ids]
      properties:
        channel:
          $ref: "./common.yaml#/components/schemas/Channel"
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        max_active_roles:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
        role_ids:
          type: array
          minItems: 2
          maxItems: 64
          items:
            type: string
        reason:
          type: string

    UpdateSodGroupRequest:
      type: object
      required: [version]
      description: nil 字段表示不修改；成员 / 阈值 / 启用变更会重新做存量预检。
      properties:
        name:
          type: string
        description:
          type: string
        max_active_roles:
          type: integer
          minimum: 1
          maximum: 64
        role_ids:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string

    DeleteSodGroupRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: 期望版本号，亦可由 If-Match 提供
        reason:
          type: string

    PreflightSodGroupRequest:
      type: object
      required: [role_ids]
      properties:
        role_ids:
          type: array
          minItems: 2
          maxItems: 64
          items:
            type: string
        max_active_roles:
          type: integer
          minimum: 1
          maximum: 64
          default: 1

    SodViolation:
      type: object
      required: [subject_type, subject_id, role_ids]
      properties:
        subject_type:
          type: string
          enum: [staff, merchant_staff]
        subject_id:
          type: string
        merchant_id:
          type: string
        role_ids:
          type: array
          items:
            type: string

    SodViolationListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SodViolation"
        total:
          type: integer
