components:
  schemas:
    RoleStatus:
      type: string
      enum: [active, disabled]

    RoleType:
      type: string
      enum: [system, custom, breakglass]

    DataScopeType:
      type: string
      description: all / merchant_set 仅 A 端允许
      enum: [all, merchant, self, merchant_set]

    DataScope:
      type: object
      required: [resource, scope_type]
      properties:
        resource:
          type: string
          description: 资源段："*" 或权限码首段（如 iam）
          example: iam
        scope_type:
          $ref: "#/components/schemas/DataScopeType"
        merchant_ids:
          type: array
          description: 仅 scope_type=merchant_set 使用，最多 100 个
          items:
            type: string

    Role:
      type: object
      required:
        - id
        - channel
        - scope_type
        - code
        - name
        - role_type
        - status
        - version
        - permissions
        - data_scopes
        - created_at
        - updated_at
      properties:
        id:
          type: string
        channel:
          $ref: "./common.yaml#/components/schemas/Channel"
        scope_type:
          type: string
          # 枚举与 internal/iam/domain 的 RoleScopeType 对齐：platform / merchant。
          # 旧文档把 A 端写成 admin，与实现不符（B 端看不到 platform 角色，
          # 但同一组件名在 bundle 时与 A 端合并，必须保持同一枚举）。
          description: 角色作用域；A 端为 platform，B 端为 merchant
          enum: [platform, merchant]
        merchant_id:
          type: string
        parent_id:
          type: string
          description: 父角色 ID；为空表示根角色。权限与数据范围沿父链向上继承（RBAC1）
        code:
          type: string
          description: 端别内唯一角色码
        name:
          type: string
        description:
          type: string
        role_type:
          $ref: "#/components/schemas/RoleType"
        status:
          $ref: "#/components/schemas/RoleStatus"
        version:
          type: integer
          format: int64
          description: 乐观锁版本；写接口必须回传
        permissions:
          type: array
          items:
            type: string
        data_scopes:
          type: array
          items:
            $ref: "#/components/schemas/DataScope"
        binding_count:
          type: integer
          description: 仅详情返回
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoleListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        total:
          type: integer

    CreateRoleRequest:
      type: object
      required: [code, name, scope_type, permissions]
      properties:
        channel:
          $ref: "./common.yaml#/components/schemas/Channel"
        scope_type:
          type: string
          enum: [admin, merchant]
        parent_id:
          type: string
          description: 父角色 ID；为空表示根角色。必须同端别、同商户，且不得成环（深度 ≤ 8）
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        data_scopes:
          type: array
          items:
            $ref: "#/components/schemas/DataScope"
        reason:
          type: string
          description: 变更原因，写入审计

    UpdateRoleRequest:
      type: object
      required: [version]
      description: |
        nil 字段表示不修改；至少提供一个字段，否则 40000。
        status=disabled 属高风险变更：`iam.security.require_reason=true` 时 `reason` 必填。
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/RoleStatus"
        parent_id:
          type: string
          description: 父角色 ID；空串表示提升为根角色，省略表示不改继承关系
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          description: 变更原因，写入审计；停用角色时强制

    ReplacePermissionsRequest:
      type: object
      required: [permissions, version]
      properties:
        permissions:
          type: array
          description: 全量替换；空数组表示清空
          items:
            type: string
        data_scopes:
          type: array
          description: 省略表示不修改；空数组表示清空
          items:
            $ref: "#/components/schemas/DataScope"
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string

    ReplacePermissionsData:
      type: object
      required: [role, added, removed]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string

    CloneRoleRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1

    DeleteRoleRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string

    RoleConstraint:
      type: object
      required: [role_id, max_bindings, required_role_ids, version]
      properties:
        role_id:
          type: string
        max_bindings:
          type: integer
          nullable: true
          minimum: 1
          description: 单角色最大有效绑定数；null 表示不限
        required_role_ids:
          type: array
          maxItems: 16
          items:
            type: string
        version:
          type: integer
          format: int64
          minimum: 1

    UpdateRoleConstraintRequest:
      type: object
      required: [required_role_ids, version]
      description: PUT 全量替换；max_bindings 为 null 表示取消上限。
      properties:
        required_role_ids:
          type: array
          maxItems: 16
          items:
            type: string
        max_bindings:
          type: integer
          nullable: true
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
