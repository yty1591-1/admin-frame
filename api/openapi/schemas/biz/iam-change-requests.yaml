components:
  schemas:
    ChangeStatus:
      type: string
      description: |
        审批单状态机：pending → approved → applied；
        pending → rejected；pending → cancelled。终态不可再流转。
      enum: [pending, approved, rejected, applied, cancelled]

    ChangeAction:
      type: string
      description: |
        B 端可申请的动作；breakglass_request 属平台级能力，B 端固定返回 40300。
      enum:
        - role_create
        - role_update
        - role_permission_replace
        - role_constraint_update
        - role_clone
        - role_delete
        - binding_create
        - binding_delete

    ChangeTargetType:
      type: string
      enum: [iam_role, iam_binding]

    ChangeRequest:
      type: object
      required:
        - id
        - channel
        - action
        - target_type
        - status
        - reason
        - requested_by
        - requested_at
        - version
      description: B 端响应不回显 merchant_id（商户取自 Token，回显无信息增益）
      properties:
        id:
          type: string
        channel:
          $ref: "./common.yaml#/components/schemas/Channel"
        action:
          $ref: "#/components/schemas/ChangeAction"
        target_type:
          $ref: "#/components/schemas/ChangeTargetType"
        target_id:
          type: string
          description: 目标聚合 ID；新建类动作为空，应用成功后才回填
        payload:
          type: object
          description: 申请载荷原样返回，便于审批人核对；不得包含敏感字段
          additionalProperties: true
        status:
          $ref: "#/components/schemas/ChangeStatus"
        reason:
          type: string
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1

    ChangeRequestListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRequest"
        total:
          type: integer

    CreateChangeRequestRequest:
      type: object
      required: [action, payload, reason]
      properties:
        channel:
          description: 可选；只能为空或 biz，传 admin 返回 40000
          allOf:
            - $ref: "./common.yaml#/components/schemas/Channel"
        action:
          $ref: "#/components/schemas/ChangeAction"
        target_id:
          type: string
          description: 新建类动作可为空；其它动作必填
        payload:
          type: object
          description: |
            动作载荷，JSON 对象，最大 16 KiB，未知字段返回 40000；
            禁止包含 merchant_id（返回 40300）与 token / secret 等敏感字段。
          additionalProperties: true
        reason:
          type: string

    DecideChangeRequestRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: 乐观锁版本；与当前审批单不一致返回 40900
        reason:
          type: string
