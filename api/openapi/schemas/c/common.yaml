components:
  schemas:
    VersionInfo:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: c-api
        version:
          type: string
          example: 1.4.2
        commit:
          type: string
          description: git commit（RELS-03）；本地可为 none
          example: abcdef0
        build_time:
          type: string
          description: UTC 构建时间（RELS-03）
          example: "2026-10-13T12:00:00Z"

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              error:
                type: string
