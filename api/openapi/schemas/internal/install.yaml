# ADR-0017：安装态响应 Schema。
# `InstallState` 本体在 components.yaml 共享定义——A 端安装向导代理（ADR-0018）
# 复用同一契约，避免 admin / internal 两份 DTO 漂移。本文件只保留响应信封装配。

InstallStatusResponse:
  allOf:
    - $ref: ../../components.yaml#/components/schemas/SuccessEnvelope
    - type: object
      properties:
        data:
          $ref: ../../components.yaml#/components/schemas/InstallState

InstallApplyResponse:
  allOf:
    - $ref: ../../components.yaml#/components/schemas/SuccessEnvelope
    - type: object
      properties:
        data:
          type: object
          required: [namespaces, item_count, state]
          properties:
            namespaces:
              type: integer
            item_count:
              type: integer
            state:
              $ref: ../../components.yaml#/components/schemas/InstallState
