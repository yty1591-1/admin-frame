# M2：config-api 内部密钥解析 Schema。
components:
  schemas:
    SecretResolveRequest:
      type: object
      required: [env, namespace, names]
      properties:
        env:
          type: string
          enum: [local, dev, test, staging, prod]
        namespace:
          type: string
        names:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: 密钥名列表；单次 ≤ 20。

    SecretResolveItem:
      type: object
      required: [name, version, value, lease_expires_at]
      properties:
        name:
          type: string
        version:
          type: integer
          format: int64
        value:
          type: string
          description: 明文；仅出现在本内部响应，不得落盘 / 日志。
        grace_version:
          type: integer
          format: int64
          nullable: true
          description: dual_version=1 时的 grace 版本号。
        grace_value:
          type: string
          nullable: true
          description: dual_version=1 时的 grace 明文。
        lease_expires_at:
          type: string
          format: date-time

    SecretResolveData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecretResolveItem"
