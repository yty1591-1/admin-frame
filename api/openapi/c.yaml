openapi: 3.0.3
info:
  title: Consumer API (C)
  version: 3.0.0
  description: |
    C 端用户（App / 小程序 / H5）。字段最小化；禁止运营内部字段。
    破坏性变更须提升本文件 `info.version` 的 **major**（见 `docs/API_STANDARDS.md`）。
    2.0.0：生产级信封/分页/强制 Idempotency-Key（相对 1.0.0 骨架契约）。
    3.0.0：移除订单演示域契约（破坏性）；当前仅保留平台 probe 端点。
servers:
  - url: http://localhost:8083
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
paths:
  /healthz:
    get:
      tags: [probe]
      summary: Liveness
      operationId: cHealthz
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [probe]
      summary: Readiness
      operationId: cReadyz
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /version:
    get:
      tags: [probe]
      summary: Build version
      operationId: cVersion
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "演示 Token：c.<user_id>（生产替换为 C 端独立 JWT）"
  schemas:
    VersionInfo:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: c-api
        version:
          type: string
          example: 1.4.2
        commit:
          type: string
          description: git commit（RELS-03）；本地可为 none
          example: abcdef0
        build_time:
          type: string
          description: UTC 构建时间（RELS-03）
          example: "2026-10-13T12:00:00Z"
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              error:
                type: string
