openapi: 3.0.3
info:
  title: Consumer API (C)
  version: 3.1.0
  description: |
    C 端用户（App / 小程序 / H5）。字段最小化；禁止运营内部字段。
    破坏性变更须提升本文件 `info.version` 的 **major**（见 `docs/API_STANDARDS.md`）。
    2.0.0：生产级信封/分页/强制 Idempotency-Key（相对 1.0.0 骨架契约）。
    3.0.0：移除历史订单契约（破坏性）；当前仅保留平台 probe 端点。
    3.1.0：新增 C 端认证（短信验证码 / OAuth 授权码 / 刷新 / 登出）。
servers:
  - url: http://localhost:8083
    description: 本地直连（make run-c）
  - url: http://c.localhost
    description: 开发集群（deploy values-dev.yaml）。Ingress path /c 原样转发，路径已含 /c/v1，勿重复拼接
  - url: https://c.staging.example.com
    description: 预发（deploy values-staging.yaml）
  - url: https://c.example.com
    description: 生产（deploy values-prod.yaml）
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
  - name: auth
    description: |
      C 端身份认证：短信验证码登录、OAuth 授权码登录、一次性刷新与登出。
      令牌不携带角色；短信验证码与 OAuth 失败统一 40100，防刷超限 42900。
paths:
  /healthz:
    get:
      tags: [probe]
      summary: Liveness
      operationId: cHealthz
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [probe]
      summary: Readiness
      operationId: cReadyz
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /version:
    get:
      tags: [probe]
      summary: Build version
      operationId: cVersion
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /c/v1/auth/sms/send:
    post:
      tags: [auth]
      summary: 发送短信验证码
      description: |
        手机号必须为 E.164。无论账号是否存在都返回 204，防止手机号枚举；
        受重发间隔、单手机号日限与单 IP 时限约束，超限返回 42900。
        短信未启用时返回 50300。
      operationId: cAuthSendSMSCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/SMSSendRequest"
      responses:
        "204":
          description: no content
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "429":
          $ref: "./components.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /c/v1/auth/login:
    post:
      tags: [auth]
      summary: 短信验证码登录
      description: |
        验证码错误、过期与未注册手机号统一返回 40100；不自动建号。
        登录成功后创建 C 端会话并签发访问 / 刷新令牌。
      operationId: cAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/SMSLoginRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/TokenPair"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "429":
          $ref: "./components.yaml#/components/responses/TooManyRequests"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /c/v1/auth/oauth/{provider}/authorize:
    post:
      tags: [auth]
      summary: 发起 OAuth 授权
      description: |
        生成一次性 state 与 PKCE verifier，返回第三方授权地址。
        provider 未配置时路由不存在（404）；state 有效期 10 分钟。
      operationId: cAuthOAuthAuthorize
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          description: 已配置的提供方名称
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/OAuthAuthorizeResult"
        "404":
          $ref: "./components.yaml#/components/responses/NotFound"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /c/v1/auth/oauth/{provider}/callback:
    post:
      tags: [auth]
      summary: OAuth 授权回调
      description: |
        state 一次性消费；无效 state、provider 不匹配、授权码拒绝与未映射身份
        （`auto_provision=false`）统一返回 40100，提供方故障返回 50300。
      operationId: cAuthOAuthCallback
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          description: 已配置的提供方名称
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 1
                  description: 提供方回调的授权码
                state:
                  type: string
                  minLength: 1
                  description: authorize 下发的一次性 state
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/TokenPair"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /c/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌（一次性轮换）
      description: 旧令牌成功轮换后立即失效；已轮换令牌再次出现视为重放，撤销整条会话链。
      operationId: cAuthRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components.yaml#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./components.yaml#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "./components.yaml#/components/schemas/TokenPair"
        "400":
          $ref: "./components.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
  /c/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出当前会话
      description: 幂等；同时把当前访问令牌的 `jti` 加入黑名单。
      operationId: cAuthLogout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: no content
        "401":
          $ref: "./components.yaml#/components/responses/Unauthorized"
        "500":
          $ref: "./components.yaml#/components/responses/InternalError"
        "503":
          $ref: "./components.yaml#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "C 端独立 JWT（Bearer）；权限与主体由令牌声明决定"
  schemas:
    VersionInfo:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: c-api
        version:
          type: string
          example: 1.4.2
        commit:
          type: string
          description: git commit（RELS-03）；本地可为 none
          example: abcdef0
        build_time:
          type: string
          description: UTC 构建时间（RELS-03）
          example: "2026-10-13T12:00:00Z"
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail]
        checks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              error:
                type: string
