openapi: 3.0.3
info:
  title: Consumer API (C)
  version: 4.2.0
  description: |
    C 端用户（App / 小程序 / H5）。字段最小化；禁止运营内部字段。
    破坏性变更须提升本文件 `info.version` 的 **major**（见 `docs/API_STANDARDS.md`）。
    2.0.0：生产级信封/分页/强制 Idempotency-Key（相对 1.0.0 骨架契约）。
    3.0.0：移除历史订单契约（破坏性）；当前仅保留平台 probe 端点。
    3.1.0：新增 C 端认证（短信验证码 / OAuth 授权码 / 刷新 / 登出）。
    3.2.0：新增短信验证码注册（开户即登录）、手机号换绑与账号注销端点。
    4.0.0：手机号换绑新增必填 `old_code`，必须同时证明持有旧号与新号（破坏性）；
    账号注销新增可选当前手机号验证码再认证。
    4.1.0：新增 `GET/PATCH /c/v1/me`（C 端个人中心资料，纯增量）。
    4.2.0：新增外部身份绑定 / 解绑端点（`/c/v1/me/bindings`、`/c/v1/auth/bindings/{provider}/*`）。
servers:
  - url: http://localhost:8083
    description: 本地直连（make run-c）
  - url: http://c.localhost
    description: 开发集群（deploy values-dev.yaml）。Ingress path /c 原样转发，路径已含 /c/v1，勿重复拼接
  - url: https://c.staging.example.com
    description: 预发（deploy values-staging.yaml）
  - url: https://c.example.com
    description: 生产（deploy values-prod.yaml）
tags:
  - name: probe
    description: 存活/就绪/版本（无需鉴权）
  - name: auth
    description: |
      C 端身份认证：短信验证码登录、OAuth 授权码登录、一次性刷新与登出。
      令牌不携带角色；短信验证码与 OAuth 失败统一 40100，防刷超限 42900。
paths:
  /healthz:
    $ref: './paths/c/probe.yaml#/healthz'
  /readyz:
    $ref: './paths/c/probe.yaml#/readyz'
  /version:
    $ref: './paths/c/probe.yaml#/version'
  /c/v1/auth/sms/send:
    $ref: './paths/c/auth.yaml#/c-v1-auth-sms-send'
  /c/v1/auth/login:
    $ref: './paths/c/auth.yaml#/c-v1-auth-login'
  /c/v1/auth/sms/register:
    $ref: './paths/c/auth.yaml#/c-v1-auth-sms-register'
  /c/v1/auth/phone/rebind:
    $ref: './paths/c/auth.yaml#/c-v1-auth-phone-rebind'
  /c/v1/auth/account:
    $ref: './paths/c/auth.yaml#/c-v1-auth-account'
  /c/v1/auth/oauth/{provider}/authorize:
    $ref: './paths/c/auth.yaml#/c-v1-auth-oauth-by-provider-authorize'
  /c/v1/auth/oauth/{provider}/callback:
    $ref: './paths/c/auth.yaml#/c-v1-auth-oauth-by-provider-callback'
  /c/v1/auth/refresh:
    $ref: './paths/c/auth.yaml#/c-v1-auth-refresh'
  /c/v1/auth/logout:
    $ref: './paths/c/auth.yaml#/c-v1-auth-logout'
  /c/v1/me:
    $ref: './paths/c/me.yaml#/c-v1-me'
  /c/v1/me/bindings:
    $ref: './paths/c/bindings.yaml#/c-v1-me-bindings'
  /c/v1/me/bindings/{provider}:
    $ref: './paths/c/bindings.yaml#/c-v1-me-bindings-by-provider'
  /c/v1/auth/bindings/{provider}/authorize:
    $ref: './paths/c/bindings.yaml#/c-v1-auth-bindings-by-provider-authorize'
  /c/v1/auth/bindings/{provider}/callback:
    $ref: './paths/c/bindings.yaml#/c-v1-auth-bindings-by-provider-callback'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "C 端独立 JWT（Bearer）；权限与主体由令牌声明决定"

