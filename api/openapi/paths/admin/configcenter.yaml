# M1-3：配置中心管理端路径（A 端，/admin/v1/configs/*）。
#
# 读、写、审批、发布四权分离：config:read / config:write /
# config:approve / config:publish。B/C 端无任何配置管理端点。
# 敏感项（sensitive=true）不返回 value，只返回 value_hash。

admin-v1-configs-namespaces:
  get:
    tags: [config]
    summary: 查询已声明的配置命名空间
    description: |
      需要 `config:read`。返回代码 key spec 已声明的 namespace 及其键数量；
      注册表为空时返回空列表（M1-4 才回填全量键）。
    operationId: adminListConfigNamespaces
    security:
      - bearerAuth: []
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigNamespaceListData"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-items:
  get:
    tags: [config]
    summary: 查询配置键列表
    description: |
      需要 `config:read`。按 env + namespace 过滤，status 可选；
      page_size 上限 100，超出返回 40000。
    operationId: adminListConfigItems
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: env
        required: true
        schema:
          type: string
          enum: [local, dev, test, staging, prod]
      - in: query
        name: namespace
        required: true
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum: [draft, active, deprecated, archived]
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItemListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
  post:
    tags: [config]
    summary: 创建配置键
    description: |
      需要 `config:write`。键必须已在代码 key spec 声明，未声明返回 40000；
      提供 value 时同时写入版本 1。写 `config.change` 审计。
    operationId: adminCreateConfigItem
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItemCreate"
    responses:
      "201":
        description: 已创建
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItem"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-items-by-id:
  get:
    tags: [config]
    summary: 查询配置键详情
    description: |
      需要 `config:read`。非敏感项返回当前 value；敏感项只返回 value_hash，
      响应中不出现 value 字段。
    operationId: adminGetConfigItem
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItem"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
  put:
    tags: [config]
    summary: 追加配置键新值
    description: |
      需要 `config:write`。值不可原地修改，只能追加新版本并推进 current_version；
      expected_version 不匹配返回 40900。敏感键的明文走 config_secret（M2），
      本端点拒绝写入。写 `config.change` 审计。
    operationId: adminUpdateConfigItemValue
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItemUpdate"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItem"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-items-by-id-versions:
  get:
    tags: [config]
    summary: 查询配置键版本历史
    description: |
      需要 `config:read`。版本升序分页；敏感项只返回 value_hash，
      响应中不出现 value 字段。
    operationId: adminListConfigItemVersions
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItemVersionListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-items-by-id-versions-by-version:
  get:
    tags: [config]
    summary: 查询配置键单个版本
    description: |
      需要 `config:read`。版本内容不可变；敏感项只返回 value_hash，
      响应中不出现 value 字段。
    operationId: adminGetConfigItemVersion
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: version
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigItemVersion"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-releases:
  get:
    tags: [config]
    summary: 查询发布单列表
    description: 需要 `config:read`。release_no 降序分页；page_size 上限 100。
    operationId: adminListConfigReleases
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: env
        required: true
        schema:
          type: string
          enum: [local, dev, test, staging, prod]
      - in: query
        name: namespace
        required: true
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum: [draft, pending_review, approved, active, superseded, rolled_back, rejected, cancelled]
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigReleaseListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
  post:
    tags: [config]
    summary: 创建发布单（draft）
    description: |
      需要 `config:write`。快照条目必须属于同一 env + namespace，且版本存在；
      快照摘要不可变。写 `config.change` 审计。
    operationId: adminCreateConfigRelease
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigReleaseCreate"
    responses:
      "201":
        description: 已创建
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigRelease"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-releases-by-id:
  get:
    tags: [config]
    summary: 查询发布单详情（含快照与审批记录）
    description: 需要 `config:read`。返回 release + items + reviews。
    operationId: adminGetConfigRelease
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigRelease"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-releases-by-id-submit:
  post:
    tags: [config]
    summary: 提交发布单审批
    description: 需要 `config:write`。仅 draft 可提交，迁移到 pending_review。
    operationId: adminSubmitConfigRelease
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigRelease"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-releases-by-id-approve:
  post:
    tags: [config]
    summary: 审批发布单（通过 / 驳回）
    description: |
      需要 `config:approve`。提交人不得自审（40300）；驳回必须给 comment。
      通过后状态为 approved，生效需单独调用 publish。
    operationId: adminApproveConfigRelease
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigReleaseApprove"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigRelease"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-releases-by-id-publish:
  post:
    tags: [config]
    summary: 发布生效
    description: |
      需要 `config:publish`。仅 approved 可发布；指针 CAS 失败返回 40900。
      写 `config.release_publish` 审计。
    operationId: adminPublishConfigRelease
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigReleasePublish"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigRelease"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"

admin-v1-configs-releases-by-id-rollback:
  post:
    tags: [config]
    summary: 回滚到历史发布
    description: |
      需要 `config:publish`。目标必须是已生效过的 Release；服务端按目标快照
      生成新 Release 并立即生效，旧 active 转 rolled_back。指针 CAS 失败返回 40900。
      写 `config.release_rollback` 审计。
    operationId: adminRollbackConfigRelease
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigReleaseRollback"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/configcenter.yaml#/components/schemas/ConfigRelease"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
