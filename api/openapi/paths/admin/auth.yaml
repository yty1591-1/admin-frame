    tags: [auth]
    summary: 停用账号
    description: |
      需要权限点 `identity:account:write`。停用后递增 `token_version`、撤销全部会话，
      旧令牌在 ≤60s 内失效。已停用账号幂等返回 204，不重复写审计。
    operationId: adminAuthDisableAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
