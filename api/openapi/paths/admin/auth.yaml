              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/AuthSessionListData"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-sessions-by-sid:
  delete:
    tags: [auth]
    summary: 撤销目标账号指定会话
    description: |
      需要权限点 `identity:account:write`。仅撤销会话与刷新能力；
      已签发的 Access Token 仍有效到自然过期（IDN-P1-02 修复后收紧）。
    operationId: adminAuthRevokeAccountSession
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
      - name: sid
        in: path
        required: true
        description: 会话 ID
        schema:
          type: string
          minLength: 1
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-sessions-revoke-all:
  post:
    tags: [auth]
    summary: 撤销目标账号全部会话
    description: |
      需要权限点 `identity:account:write`。递增 token_version 并撤销全部会话，
      旧 Access Token 在 ≤60s 内失效。
    operationId: adminAuthRevokeAccountSessions
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/AccountActionRequest"
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-disable:
