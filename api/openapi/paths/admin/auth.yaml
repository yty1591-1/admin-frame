admin-v1-auth-login:
  post:
    tags: [auth]
    summary: 密码登录
    description: |
      账号不存在、密码错误、账号停用与锁定统一返回 40100；真实原因只写审计。
      请求中的 `channel` / `roles` / `merchant_id` 一律拒绝（40000）。

      A 端已绑定 MFA 时返回 `MFAChallenge`（不含任何令牌），需再调用
      `POST /admin/v1/auth/mfa/verify` 完成第二步；A 端强制绑定但尚未完成绑定时
      返回 `MFABindingRequired`（不含任何令牌），需先用 `POST /admin/v1/auth/mfa/setup`
      与 `POST /admin/v1/auth/mfa/verify` 完成绑定，绑定成功后直接签发令牌。
      两种中间态都不得签发管理令牌（AC-ENT-01-4、AC-ENT-01-6）。
    operationId: adminAuthLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/LoginRequest"
    responses:
      "200":
        description: 令牌对，或需要完成 MFA 校验 / 绑定的中间态
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      oneOf:
                        - $ref: "../../components.yaml#/components/schemas/TokenPair"
                        - $ref: "../../components.yaml#/components/schemas/MFAChallenge"
                        - $ref: "../../components.yaml#/components/schemas/MFABindingRequired"
                        - $ref: "../../components.yaml#/components/schemas/PasswordChangeRequired"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-refresh:
  post:
    tags: [auth]
    summary: 刷新令牌（一次性轮换）
    description: 旧令牌成功轮换后立即失效；已轮换令牌再次出现视为重放，撤销整条会话链。
    operationId: adminAuthRefresh
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/RefreshRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-logout:
  post:
    tags: [auth]
    summary: 登出当前会话
    description: 幂等；同时把当前访问令牌的 `jti` 加入黑名单。
    operationId: adminAuthLogout
    security:
      - bearerAuth: []
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-logout-all:
  post:
    tags: [auth]
    summary: 登出全部会话
    description: 递增账号 `token_version`，使所有已签发访问令牌失效，并撤销全部会话。
    operationId: adminAuthLogoutAll
    security:
      - bearerAuth: []
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-sessions:
  get:
    tags: [auth]
    summary: 列出本账号会话
    description: 仅返回本账号会话；不下发任何令牌、IP 或 UA 原文。
    operationId: adminAuthListSessions
    security:
      - bearerAuth: []
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/AuthSessionListData"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-sessions-revoke-all:
  post:
    tags: [auth]
    summary: 撤销全部会话
    description: 语义等同 `logout-all`，便于会话管理页调用。
    operationId: adminAuthRevokeAllSessions
    security:
      - bearerAuth: []
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-sessions-by-id:
  delete:
    tags: [auth]
    summary: 撤销指定会话
    description: 仅可撤销本账号会话；他人会话与不存在统一返回 40400，避免横向枚举。
    operationId: adminAuthRevokeSession
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 会话 ID
        schema:
          type: string
          minLength: 1
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-password-change:
  post:
    tags: [auth]
    summary: 自助修改密码
    description: |
      校验旧密码与新密码策略；成功后递增账号 `token_version` 并撤销全部会话，
      旧访问令牌与刷新令牌立即不可用，用户需重新登录。
      新密码与旧密码相同返回 40000；旧密码错误统一 40100。
    operationId: adminAuthChangePassword
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/ChangePasswordRequest"
    responses:
      "200":
        description: 强制改密完成：返回令牌，或仍需 MFA 的中间态
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      oneOf:
                        - $ref: "../../components.yaml#/components/schemas/TokenPair"
                        - $ref: "../../components.yaml#/components/schemas/MFAChallenge"
                        - $ref: "../../components.yaml#/components/schemas/MFABindingRequired"
      "204":
        description: no content（Bearer 自助改密）
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts:
  get:
    tags: [auth]
    summary: 列出身份账号
    description: |
      需要权限点 `identity:account:read`。按创建时间倒序分页；`status` 与 `keyword`
      （主体子串）可选，软删账号同样返回并带 `deleted_at`。
    operationId: adminAuthListAccounts
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: 页码，从 1 开始
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        description: 每页条数，服务端上限 100
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          type: string
          enum: [pending, active, locked, disabled]
      - name: keyword
        in: query
        description: 主体关键词（子串匹配，大小写不敏感）
        schema:
          type: string
          maxLength: 255
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/AccountListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id:
  get:
    tags: [auth]
    summary: 查看账号详情
    description: 需要权限点 `identity:account:read`；返回凭据与 MFA 状态，软删账号同样可查。
    operationId: adminAuthGetAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/AccountDetail"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"
  delete:
    tags: [auth]
    summary: 软删账号
    description: |
      需要权限点 `identity:account:write`。递增 token_version 并撤销全部会话；
      subject 仍占用唯一键，可通过 restore 恢复。
    operationId: adminAuthDeleteAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/AccountActionRequest"
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-lock:
  post:
    tags: [auth]
    summary: 手动锁定账号
    description: |
      需要权限点 `identity:account:write`。递增 token_version、撤销全部会话并写
      `auth.account.locked`；`duration_minutes` 省略时使用默认锁定策略。
    operationId: adminAuthLockAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/AccountLockRequest"
    responses:
      "204":
        description: no content
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-password-reset:
  post:
    tags: [auth]
    summary: 重置账号密码
    description: |
      需要权限点 `identity:account:write`。生成一次性临时口令并置强制改密标记；
      用户下次登录只返回 `PasswordChangeRequired`，改密后才签发令牌。
      响应中的临时口令只出现一次，必须经安全通道交付给用户。
    operationId: adminAuthResetAccountPassword
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/AccountActionRequest"
    responses:
      "200":
        description: 临时口令
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/ResetPasswordData"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-restore:
  post:
    tags: [auth]
    summary: 恢复软删账号
    description: 需要权限点 `identity:account:write`；不恢复旧会话，用户须重新登录。
    operationId: adminAuthRestoreAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/AccountActionRequest"
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-sessions:
  get:
    tags: [auth]
    summary: 列出目标账号会话
    description: 需要权限点 `identity:account:read`；返回目标账号全部会话，current 恒为 false。
    operationId: adminAuthListAccountSessions
    security:
      - bearerAuth: []
