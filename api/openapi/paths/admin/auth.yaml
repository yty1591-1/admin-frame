    summary: 启用账号
    description: |
      需要权限点 `identity:account:write`。恢复停用账号，不恢复旧会话，用户必须重新登录。
      目标账号未停用返回 40900。
    operationId: adminAuthEnableAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/AccountActionRequest"
    responses:
      "204":
        description: no content
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

admin-v1-auth-accounts-by-id-unlock:
  post:
    tags: [auth]
    summary: 解锁账号
    description: |
      需要权限点 `identity:account:write`。管理员手动解除失败锁定并写审计；
      未锁定账号幂等返回 204，停用账号返回 40900。
    operationId: adminAuthUnlockAccount
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 账号 ID
        schema:
          type: string
          minLength: 1
    requestBody:
      required: false
