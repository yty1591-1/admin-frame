        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/iam-menus.yaml#/components/schemas/MenuStatusRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-menus.yaml#/components/schemas/MenuAdmin"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-me-menus:
  get:
    tags: [iam]
    summary: 当前主体可见菜单
    description: |
      仅需认证，不额外要求权限点。按主体权限快照裁剪菜单树：
      只保留 permission_code 为空或已授予的节点，递归补齐可见节点的祖先链，
      并丢弃裁剪后无可见子节点的目录；目录 redirect 按首个可见后代重算，
      避免跳向被裁剪的页面。菜单只影响前端入口展示，
      接口鉴权仍以权限点中间件为准。
    operationId: adminGetMenus
    security:
      - bearerAuth: []
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../../schemas/admin/iam-menus.yaml#/components/schemas/MenuTreeNode"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"
