    summary: 回滚激活指定密钥版本
    description: |
      需要 `config:secret:write`。目标版本变为 active，当前 active 变 grace。
      须显式 break_glass（绕过轮换审批）；写 `config.secret_rotate` 审计（CC-R-14）。
