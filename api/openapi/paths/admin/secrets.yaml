# M2：业务密钥管理端路径（A 端，/admin/v1/configs/secrets/*）。
#
# 权限：config:secret:read / write / approve。明文仅允许创建与轮换请求体一次性输入。

admin-v1-configs-secrets:
  get:
    tags: [config-secret]
    summary: 查询业务密钥列表（脱敏）
    description: 需要 `config:secret:read`。响应不含明文 / 密文 / DEK。
    operationId: adminListConfigSecrets
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: env
        required: true
        schema:
          type: string
          enum: [local, dev, test, staging, prod]
      - in: query
        name: namespace
        required: true
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum: [draft, pending_review, active, rejected, revoked, destroyed]
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/secrets.yaml#/components/schemas/ConfigSecretListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
  post:
    tags: [config-secret]
    summary: 创建业务密钥
    description: |
      需要 `config:secret:write`。明文一次性输入，响应仅返回元数据与指纹；
      创建后进入 draft，需审批激活。写 `config.secret.create` 审计。
    operationId: adminCreateConfigSecret
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/secrets.yaml#/components/schemas/ConfigSecretCreateRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/secrets.yaml#/components/schemas/ConfigSecret"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"

