admin-v1-iam-certifications:
  get:
    tags: [iam]
    summary: 复核活动列表
    description: |
      需要 `iam:certification:read`。按创建时间倒序；A 端只返回平台级活动
      （merchant_id 为空），分页参数与其它列表接口一致（page / page_size，上限 100）。
    operationId: adminListIAMCertificationCampaigns
    security:
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        required: false
        description: 活动状态过滤
        schema:
          $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationCampaignStatus"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationCampaignListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
  post:
    tags: [iam]
    summary: 创建复核活动
    description: |
      需要 `iam:certification:write`。活动创建后为 draft 状态，需调用 activate
      生成待复核任务；due_at 必须晚于当前时间。B 端商户必须来自认证主体，
      载荷中的 channel 不得跨端（命中返回 40000）。
    operationId: adminCreateIAMCertificationCampaign
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CreateCertificationCampaignRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationCampaign"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-certifications-by-id:
  get:
    tags: [iam]
    summary: 复核活动详情
    description: 需要 `iam:certification:read`。跨商户一律 404，不泄露资源是否存在。
    operationId: adminGetIAMCertificationCampaign
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationCampaignID"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationCampaign"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-certifications-by-id-activate:
  post:
    tags: [iam]
    summary: 激活活动并生成待复核清单
    description: |
      需要 `iam:certification:write`。按当前有效绑定生成任务，按
      `(campaign_id, subject_id, role_id)` 幂等去重；重复调用不产生重复待办。
      任务责任人默认为活动创建者。
    operationId: adminActivateIAMCertificationCampaign
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationCampaignID"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationCampaign"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-certifications-by-id-tasks:
  get:
    tags: [iam]
    summary: 待复核任务列表
    description: 需要 `iam:certification:read`。先校验活动可见性，再按状态分页。
    operationId: adminListIAMCertificationTasks
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationCampaignID"
      - name: status
        in: query
        required: false
        description: 任务状态过滤
        schema:
          $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationTaskStatus"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationTaskListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-certifications-by-id-tasks-by-taskId-decision:
  post:
    tags: [iam]
    summary: 裁决复核任务
    description: |
      需要 `iam:certification:decide`。decision=confirm 保留绑定；decision=revoke
      先比对绑定指纹，不一致或绑定已撤销时任务置 skipped 并返回 40900，绝不回收。
      重复提交相同裁决幂等成功，原因必填。
    operationId: adminDecideIAMCertificationTask
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationCampaignID"
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationTaskID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/DecideCertificationTaskRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationTask"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-certifications-by-id-close:
  post:
    tags: [iam]
    summary: 关闭复核活动
    description: 需要 `iam:certification:write`。重复关闭幂等成功；关闭后不再接受裁决。
    operationId: adminCloseIAMCertificationCampaign
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationCampaignID"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CloseCertificationCampaignRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationCampaign"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-certifications-by-id-auto-expire:
  post:
    tags: [iam]
    summary: 执行到期处理
    description: |
      需要 `iam:certification:write`。仅对已过截止时间的 active 活动生效：
      `iam.certification.auto_revoke=false` 时只把 pending 任务置 expired；
      开启时按指纹二次校验后回收，失败置 skipped（死信）。可重入。
    operationId: adminAutoExpireIAMCertificationCampaign
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationCampaignID"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationAutoExpireData"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-iam-certifications-by-id-export:
  get:
    tags: [iam]
    summary: 导出复核证据
    description: |
      需要 `iam:certification:read`。format=json 返回规范化记录数组；
      format=csv（默认）返回同字段顺序的 CSV 附件。导出动作写入
      `rbac.certification` 审计。
    operationId: adminExportIAMCertificationEvidence
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/admin/common.yaml#/components/parameters/CertificationCampaignID"
      - name: format
        in: query
        required: false
        description: 导出格式
        schema:
          type: string
          enum: [csv, json]
          default: csv
    responses:
      "200":
        description: ok
        content:
          text/csv:
            schema:
              type: string
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: "../../schemas/admin/iam-certifications.yaml#/components/schemas/CertificationEvidenceRecord"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
