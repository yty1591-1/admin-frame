admin-v1-tenants:
  get:
    tags: [tenant]
    summary: 查询租户列表
    description: |
      需要 `tenant:read`。按 `status` / `keyword` 过滤，按创建时间倒序。
      `page_size` 超过上限时按上限收敛（不报错），避免分页参数直接放大查询。
    operationId: adminListTenants
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: status
        schema:
          type: string
          enum: [pending, active, suspended, terminated]
      - in: query
        name: keyword
        schema:
          type: string
        description: 名称包含匹配（LIKE 通配符已转义）。
      - $ref: "../../components.yaml#/components/parameters/Page"
      - $ref: "../../components.yaml#/components/parameters/PageSize"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
  post:
    tags: [tenant]
    summary: 创建租户
    description: |
      需要 `tenant:write`。新租户为 `pending`（未开通），须显式 `activate` 后才允许业务访问。
      创建动作写 `tenant.create` 审计事件。
    operationId: adminCreateTenant
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantCreateRequest"
    responses:
      "201":
        description: created
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/Tenant"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id:
  get:
    tags: [tenant]
    summary: 查询租户详情
    description: 需要 `tenant:read`。返回状态机当前状态与最近一次状态原因。
    operationId: adminGetTenant
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/Tenant"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
  patch:
    tags: [tenant]
    summary: 变更租户资料（改名与元数据）
    description: |
      需要 `tenant:write`。字段缺省表示不变，显式空串表示清空；至少提供一个字段。
      变更写 `tenant.update` 审计（含变更字段列表）。`code` 不可变——
      它是外部系统的对账引用，修订须走数据订正流程。
      资料变更与状态迁移共用乐观锁版本：并发「改名 + 停用」后到者返回 40900。
    operationId: adminUpdateTenant
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantUpdateRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/Tenant"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-activate:
  post:
    tags: [tenant]
    summary: 开通租户（pending → active）
    description: |
      需要 `tenant:write`。仅 `pending` 可开通，其它状态返回 40900。
      开通后租户进入服务期，写 `tenant.activate` 审计。
    operationId: adminActivateTenant
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/Tenant"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-suspend:
  post:
    tags: [tenant]
    summary: 停用租户（active → suspended）
    description: |
      需要 `tenant:write`。`reason` 必填（缺失返回 40000）——停用会让客户立即不可用，
      不能只有操作人没有理由。写 `tenant.suspend` 审计。
    operationId: adminSuspendTenant
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantTransitionRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/Tenant"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-resume:
  post:
    tags: [tenant]
    summary: 恢复租户（suspended → active）
    description: 需要 `tenant:write`。写 `tenant.resume` 审计，与首次开通区分开。
    operationId: adminResumeTenant
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/Tenant"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-terminate:
  post:
    tags: [tenant]
    summary: 终止租户（→ terminated，终态）
    description: |
      需要 `tenant:write`。`reason` 必填。终止是终态：之后任何迁移都返回 40900，
      租户数据按保留策略处置（ENT-15），不做物理删除。写 `tenant.terminate` 审计。
    operationId: adminTerminateTenant
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantTransitionRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/Tenant"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-members:
  get:
    tags: [tenant]
    summary: 列出租户成员
    description: |
      需要 `tenant:read`。默认只返回在册成员；`include_disabled=true` 时一并返回已停用成员。
      按 owner → admin → member 排序，同角色按 `subject_id` 排序；分页参数与租户列表同上限。
    operationId: adminListTenantMembers
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: include_disabled
        schema:
          type: boolean
        description: 为 true 时包含已停用成员。
      - $ref: "../../components.yaml#/components/parameters/Page"
      - $ref: "../../components.yaml#/components/parameters/PageSize"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantMemberListData"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
  post:
    tags: [tenant]
    summary: 添加租户成员
    description: |
      需要 `tenant:write`。已在册的成员重复添加返回 40900（不会静默改角色）；
      已停用成员再次添加视为复活，角色按入参更新并在审计中标记 `reactivated=true`。
      席位上限（T-13）：在册成员数 +1 超过 `user` 配额时返回 40900，
      错误信息携带当前在册数与上限——复活同样占用席位。
      终止态租户拒绝任何成员变更。
    operationId: adminAddTenantMember
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantMemberCreateRequest"
    responses:
      "201":
        description: created
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantMember"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-members-by-subject:
  patch:
    tags: [tenant]
    summary: 变更成员角色或状态
    description: |
      需要 `tenant:write`。`role` 与 `status` 至少提供一个。
      降级或停用租户最后一名在册 `owner` 返回 40900 —— 先把另一名成员设为 owner。
    operationId: adminUpdateTenantMember
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: subject_id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantMemberUpdateRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantMember"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-quotas:
  get:
    tags: [tenant]
    summary: 列出租户配额
    description: 需要 `tenant:read`。只返回已配置的资源；未配置由执行层（ENT-14）按默认值兜底。
    operationId: adminListTenantQuotas
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantQuotaListData"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-quotas-by-resource:
  put:
    tags: [tenant]
    summary: 设置租户配额
    description: |
      需要 `tenant:write`。按 `(tenant_id, resource)` 幂等写入上限；`limit=-1` 表示不限。
      资源键只允许小写字母、数字与 `.` `_` `-`（参与限流键与指标标签，需可枚举）。
      变更写 `tenant.quota_change` 审计；执行（计数与 42900）由 ENT-14 负责。
    operationId: adminSetTenantQuota
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: resource
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantQuotaSetRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantQuota"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-invitations:
  get:
    tags: [tenant]
    summary: 列出租户邀请
    description: |
      需要 `tenant:read`。按创建时间倒序；`status` 过滤可选
      （pending / accepted / revoked / expired）。
    operationId: adminListTenantInvitations
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum: [pending, accepted, revoked, expired]
      - $ref: "../../components.yaml#/components/parameters/Page"
      - $ref: "../../components.yaml#/components/parameters/PageSize"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitationListData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
  post:
    tags: [tenant]
    summary: 创建成员邀请
    description: |
      需要 `tenant:write`。同租户同邮箱仅允许一个 pending 邀请（重复返回 40900，走 resend）。
      明文 token 仅在本次响应返回一次，服务端只存 SHA-256 摘要；
      邮件投递依赖 ENT-10，就绪前由运营线下转交（「只落库不发送」的阶段语义）。
      写 `tenant.invitation.create` 审计。
    operationId: adminCreateTenantInvitation
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitationCreateRequest"
    responses:
      "201":
        description: created
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitationWithToken"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-invitations-accept:
  post:
    tags: [tenant]
    summary: 接受邀请（建立成员关系）
    description: |
      需要 `tenant:write`。凭据是 token 本身（按摘要查找，不暴露 invitation_id）。
      语义：无效 token 统一 400（防枚举）；过期返回 40900 并惰性回写 expired；
      同一主体重复接受幂等（200，`idempotent=true`）；换人抢受返回 40900。
      接受建立成员关系，同样受席位上限约束（超限 40900，邀请保持 pending）。
      写 `tenant.invitation.accept` 与 `tenant.member.add`（source=invitation）审计。
    operationId: adminAcceptTenantInvitation
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitationAcceptRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitationAcceptData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-invitations-by-invitation-id-revoke:
  post:
    tags: [tenant]
    summary: 撤销邀请
    description: |
      需要 `tenant:write`。仅 pending 可撤销（终态不可逆，重复撤销返回 40900）。
      撤销后 token 立即失效。写 `tenant.invitation.revoke` 审计。
    operationId: adminRevokeTenantInvitation
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: invitation_id
        required: true
        schema:
          type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitationRevokeRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitation"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"

admin-v1-tenants-by-id-invitations-by-invitation-id-resend:
  post:
    tags: [tenant]
    summary: 重发邀请（轮换 token 并顺延有效期）
    description: |
      需要 `tenant:write`。仅 pending 可重发；旧 token 立即失效（摘要被覆盖），
      新 token 在本次响应返回，有效期重新起算（默认 7 天）。
      转交链路怀疑泄露时，resend 即轮换手段。写 `tenant.invitation.resend` 审计。
    operationId: adminResendTenantInvitation
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: invitation_id
        required: true
        schema:
          type: string
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/admin/tenant.yaml#/components/schemas/TenantInvitationWithToken"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
