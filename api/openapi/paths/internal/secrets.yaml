# M2：config-api 内部密钥解析路径（仅集群内，/internal/v1/configs/secrets/*）。
#
# 人不可调用；服务身份由 mTLS 证书 SAN 确定；默认拒绝无 grant。

internal-v1-configs-secrets-resolve:
  post:
    tags: [config-secret-internal]
    summary: 解析业务密钥明文（短租约）
    description: |
      服务身份必须持有对应 grant。单次最多 20 个 key；返回短租约明文，
      默认 5m、上限 15m。错误体不含明文 / 密文 / DEK / KEK。
    operationId: internalResolveConfigSecrets
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../schemas/internal/secrets.yaml#/components/schemas/SecretResolveRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../schemas/internal/secrets.yaml#/components/schemas/SecretResolveData"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"
