# ADR-0017：config-api 首次安装态 API。

internal-v1-install-status:
  get:
    tags: [install]
    summary: 查询安装态
    operationId: getInstallStatus
    description: |
      返回当前部署环境的 `config_install_state`，并附带 `gaps`（缺失的必填键）与
      `blocking_count`（ADR-0018）。无需 setup token；业务进程 /readyz 与 Admin SPA
      据此判断是否进入安装向导或启动降级。
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              $ref: "../../schemas/internal/install.yaml#/InstallStatusResponse"
      "404":
        description: 安装态行不存在（未 migrate / 未 Ensure）
        content:
          application/json:
            schema:
              $ref: "../../components.yaml#/components/schemas/ErrorEnvelope"

internal-v1-install-schema:
  get:
    tags: [install]
    summary: 查询向导渲染元数据
    operationId: getInstallSchema
    description: |
      返回安装向导渲染表单所需的字段清单、分组、默认值来源与缺失必填键（ADR-0018）。
      与读配置不同，本端点不需 JWT，但**需要 setup token**：schema 会暴露键名、
      默认值与校验规则。`mode=repair` 时前端只应允许修改 `blocking_keys`。
    parameters:
      - $ref: "#/components/parameters/SetupTokenHeader"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              $ref: "../../schemas/internal/install.yaml#/InstallSchemaResponse"
      "401":
        description: setup token 无效
        content:
          application/json:
            schema:
              $ref: "../../components.yaml#/components/schemas/ErrorEnvelope"
      "404":
        description: 安装态行不存在（未 migrate / 未 Ensure）

internal-v1-install-begin:
  post:
    tags: [install]
    summary: 开始安装 / 开始修复（抢租约）
    operationId: beginInstall
    description: |
      `reason=first_install`（默认）只能从 `pending`/`failed`/过期 `installing` 进入；
      `reason=repair` 只允许在 `ready` 之后发起，且要求当前存在阻塞键（或运维通过
      `declared_keys` 声明），服务端会把 `namespace/key` 白名单冻结进 `repair_keys`，
      后续 apply 只接受这些键（ADR-0018）。
    parameters:
      - $ref: "#/components/parameters/SetupTokenHeader"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              owner:
                type: string
                description: 安装者标识；空则服务端生成
              reason:
                type: string
                enum: [first_install, repair]
                description: 省略时按当前状态推断（ready → repair，否则 first_install）
              declared_keys:
                type: array
                maxItems: 64
                description: |
                  运维声明的额外阻塞键（`namespace/key`），只在 `repair` 轮次有效。
                  用于服务端算不出阻塞键、但进程确实起不来的场景：键必须已声明、非敏感，
                  且尚未进入生效快照（已有值的键属正常变更，应走配置审批流）。
                items:
                  type: string
    responses:
      "200":
        description: 进入 installing
        content:
          application/json:
            schema:
              $ref: "../../schemas/internal/install.yaml#/InstallStatusResponse"
      "400":
        description: |
          reason 非法；repair 时状态不是 ready；declared_keys 与 first_install 同时提交；
          declared_keys 含未声明键 / 敏感键 / 已有值的键
      "401":
        description: setup token 无效
      "409":
        description: 40951 安装进行中 / 40952 已完成（首装已完成，或 repair 时无阻塞键可修）

internal-v1-install-apply:
  post:
    tags: [install]
    summary: 安装期播种 / 修复阻塞键
    operationId: applyInstall
    description: |
      把向导提交的值与默认值合并后播种成新的 item version + release + 指针；
      响应里的 `remaining_gaps` 是本次 apply 之后的剩余阻塞键。
      `mode=repair` 时只接受 `repair_keys` 白名单内的键，越权键直接 400。
    parameters:
      - $ref: "#/components/parameters/SetupTokenHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [owner]
            properties:
              owner:
                type: string
              values:
                type: object
                description: 按 namespace 分组的新契约（键为 namespace，值为 key → 字符串）
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
              overrides:
                type: object
                additionalProperties:
                  type: string
                description: 扁平键值，兼容旧客户端；与 values 合并，后者优先
    responses:
      "200":
        description: 播种完成（幂等）；响应内含 remaining_gaps
        content:
          application/json:
            schema:
              $ref: "../../schemas/internal/install.yaml#/InstallApplyResponse"
      "400":
        description: 请求体非法，或 repair 时提交了白名单之外的键
      "401":
        description: setup token 无效
      "409":
        description: 未持有租约或已完成

internal-v1-install-complete:
  post:
    tags: [install]
    summary: 完成安装
    operationId: completeInstall
    parameters:
      - $ref: "#/components/parameters/SetupTokenHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [owner]
            properties:
              owner:
                type: string
    responses:
      "200":
        description: status=ready
        content:
          application/json:
            schema:
              $ref: "../../schemas/internal/install.yaml#/InstallStatusResponse"
      "400":
        description: 缺少 namespace pointer，或仍存在阻塞键（此时状态保持 installing，可继续 apply）
      "401":
        description: setup token 无效
      "409":
        description: 未持有租约或已完成

components:
  parameters:
    SetupTokenHeader:
      name: X-Config-Install-Token
      in: header
      required: true
      schema:
        type: string
      description: 与 CONFIG_INSTALL_SETUP_TOKEN 一致；不入库
