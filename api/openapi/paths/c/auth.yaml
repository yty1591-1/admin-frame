c-v1-auth-sms-send:
  post:
    tags: [auth]
    summary: 发送短信验证码
    description: |
      手机号必须为 E.164。无论账号是否存在都返回 204，防止手机号枚举；
      受重发间隔、单手机号日限与单 IP 时限约束，超限返回 42900。
      短信未启用时返回 50300。
    operationId: cAuthSendSMSCode
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/SMSSendRequest"
    responses:
      "204":
        description: no content
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-login:
  post:
    tags: [auth]
    summary: 短信验证码登录
    description: |
      验证码错误、过期与未注册手机号统一返回 40100；不自动建号。
      登录成功后创建 C 端会话并签发访问 / 刷新令牌。
    operationId: cAuthLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/SMSLoginRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-sms-register:
  post:
    tags: [auth]
    summary: 短信验证码注册并登录
    description: |
      验证码通过后创建 C 端账号（手机号摘要主体）与手机号凭据，并直接签发令牌（方案 A）。
      已注册手机号与验证码错误统一返回 40100，避免通过注册端点枚举手机号；
      开户与审计在同一事务内完成。短信未启用时路由不存在（404）。
    operationId: cAuthSMSRegister
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/SMSLoginRequest"
    responses:
      "200":
        description: 令牌对
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-phone-rebind:
  post:
    tags: [auth]
    summary: 换绑手机号
    description: |
      需已登录 C 端账号。先用 `sms/send` 分别向当前手机号与新手机号发送验证码；
      请求必须同时携带 `old_code` 与 `code`，证明对旧号和新号的控制。
      成功后更新账号主体与手机号凭据、递增 token_version 并撤销全部会话，
      用户需用新手机号重新登录。新手机号已被占用返回 40900。
    operationId: cAuthRebindPhone
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/SMSRebindRequest"
    responses:
      "204":
        description: no content
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "409":
        $ref: "../../components.yaml#/components/responses/Conflict"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-account:
  delete:
    tags: [auth]
    summary: 注销账号
    description: |
      用户自助注销（软删）：递增 token_version、撤销全部会话并写 `auth.account.deleted`；
      手机号主体仍占用唯一键，不允许立即被他人重新注册。
      短信启用时必须携带当前手机号验证码 `code` 作为再认证；
      未启用短信或 OAuth-only 账号时，要求设备最近登录在再认证窗口内（默认 10 分钟），
      否则返回 40100，用户需重新登录后再注销。
    operationId: cAuthDeleteAccount
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/SMSDeleteRequest"
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-oauth-by-provider-authorize:
  post:
    tags: [auth]
    summary: 发起 OAuth 授权
    description: |
      生成一次性 state 与 PKCE verifier，返回第三方授权地址。
      provider 未配置时路由不存在（404）；state 有效期 10 分钟。
    operationId: cAuthOAuthAuthorize
    security: []
    parameters:
      - in: path
        name: provider
        required: true
        description: 已配置的提供方名称
        schema:
          type: string
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/OAuthAuthorizeResult"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-oauth-by-provider-callback:
  post:
    tags: [auth]
    summary: OAuth 授权回调
    description: |
      state 一次性消费；无效 state、provider 不匹配、授权码拒绝与未映射身份
      （`auto_provision=false`）统一返回 40100，提供方故障返回 50300。
    operationId: cAuthOAuthCallback
    security: []
    parameters:
      - in: path
        name: provider
        required: true
        description: 已配置的提供方名称
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, state]
            additionalProperties: false
            properties:
              code:
                type: string
                minLength: 1
                description: 提供方回调的授权码
              state:
                type: string
                minLength: 1
                description: authorize 下发的一次性 state
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-saml-by-provider-authorize:
  post:
    tags: [auth]
    summary: 发起 SAML 授权
    description: |
      生成一次性 state 与 AuthnRequest（HTTP-Redirect binding），返回 IdP 跳转地址。
      provider 未配置时路由不存在（404）；state 有效期由 `identity.saml.request_ttl` 控制。
    operationId: cAuthSAMLAuthorize
    security: []
    parameters:
      - in: path
        name: provider
        required: true
        description: 已配置的 SAML 提供方名称
        schema:
          type: string
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/OAuthAuthorizeResult"
      "404":
        $ref: "../../components.yaml#/components/responses/NotFound"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-saml-acs:
  post:
    tags: [auth]
    summary: SAML ACS 断言消费端点
    description: |
      IdP 以浏览器表单 POST 回传 `SAMLResponse` 与 `RelayState`。仅接受
      `application/x-www-form-urlencoded`，请求体上限 512KB。
      验签、时间条件、Audience、解密与断言 ID 去重全部通过后签发一次性 ticket，
      并以 303 跳转至 `login_redirect_url?ticket=...`；令牌不会出现在浏览器地址栏。
    operationId: cAuthSAMLACS
    security: []
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [SAMLResponse, RelayState]
            additionalProperties: false
            properties:
              SAMLResponse:
                type: string
                minLength: 1
                description: Base64 编码的 SAML Response
              RelayState:
                type: string
                minLength: 1
                maxLength: 1024
                description: authorize 下发的一次性 state
    responses:
      "303":
        description: 校验通过，跳转前端登录页并携带 ticket
        headers:
          Location:
            description: "`login_redirect_url?ticket=...`"
            schema:
              type: string
              format: uri
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "413":
        description: 请求体超过 512KB
      "415":
        description: Content-Type 必须为 application/x-www-form-urlencoded
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-saml-exchange:
  post:
    tags: [auth]
    summary: 用一次性 ticket 换取令牌
    description: |
      ticket 由 ACS 成功后跳转参数下发，有效期默认 60 秒且只能消费一次。
      过期、已消费或不存在统一返回 40100；存储故障返回 50300。
    operationId: cAuthSAMLExchange
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ticket]
            additionalProperties: false
            properties:
              ticket:
                type: string
                minLength: 1
                description: ACS 跳转下发的 ticket
    responses:
      "200":
        description: 令牌对
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-saml-metadata:
  get:
    tags: [auth]
    summary: SP 元数据
    description: |
      返回本系统 SP 元数据（entityID / ACS / 签名与解密证书），供 IdP 侧登记。
      响应为 `application/samlmetadata+xml`；SAML 未启用时返回 50300。
    operationId: cAuthSAMLMetadata
    security: []
    responses:
      "200":
        description: SP 元数据 XML
        content:
          application/samlmetadata+xml:
            schema:
              type: string
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-refresh:
  post:
    tags: [auth]
    summary: 刷新令牌（一次性轮换）
    description: 旧令牌成功轮换后立即失效；已轮换令牌再次出现视为重放，撤销整条会话链。
    operationId: cAuthRefresh
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/RefreshRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

c-v1-auth-logout:
  post:
    tags: [auth]
    summary: 登出当前会话
    description: 幂等；同时把当前访问令牌的 `jti` 加入黑名单。
    operationId: cAuthLogout
    security:
      - bearerAuth: []
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"
