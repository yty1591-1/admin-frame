biz-v1-iam-change-requests-by-id-apply:
  post:
    tags: [iam]
    summary: 应用审批单
    description: |
      需要 `iam:change:review`。仅 approved 单据可应用；目标变更与审批单状态同事务提交，
      失败保持 approved 可重试。目标角色 / 绑定必须属于本商户，跨商户返回 40400。
    operationId: bizApplyIAMChangeRequest
    security:
      - bearerAuth: []
    parameters:
      - $ref: "../../schemas/biz/common.yaml#/components/parameters/ChangeRequestID"
    requestBody:
      required: true
