biz-v1-auth-login:
  post:
    tags: [auth]
    summary: 密码登录
    description: |
      账号不存在、密码错误、账号停用与锁定统一返回 40100；`merchant_id` 必填，
      必须与账号绑定租户一致，令牌不得跨商户。
    operationId: bizAuthLogin
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/BizLoginRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "429":
        $ref: "../../components.yaml#/components/responses/TooManyRequests"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

biz-v1-auth-refresh:
  post:
    tags: [auth]
    summary: 刷新令牌（一次性轮换）
    description: 旧令牌成功轮换后立即失效；已轮换令牌再次出现视为重放，撤销整条会话链。
    operationId: bizAuthRefresh
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/RefreshRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TokenPair"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

biz-v1-auth-logout:
  post:
    tags: [auth]
    summary: 登出当前会话
    description: 幂等；同时把当前访问令牌的 `jti` 加入黑名单。
    operationId: bizAuthLogout
    security:
      - bearerAuth: []
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

biz-v1-auth-logout-all:
  post:
    tags: [auth]
    summary: 登出全部会话
    description: 递增账号 `token_version`，使所有已签发访问令牌失效，并撤销全部会话。
    operationId: bizAuthLogoutAll
    security:
      - bearerAuth: []
    responses:
      "204":
        description: no content
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"

biz-v1-auth-tenant-switch:
  post:
    tags: [auth]
    summary: 切换当前生效租户（T-22）
    description: |
      凭据是当前 Bearer 令牌（须携带有效会话）。目标租户必须是主体的在册成员
      且处于服务期；成功后返回**同会话重签**的访问令牌（`current_tenant` 声明
      已更新），refresh token 不变——切换租户不是重新认证。
      旧令牌行为：切换前签发的令牌继续有效至自然过期，生效租户回落
      `merchant_id`；B 端请求的守卫按 `current_tenant`（缺省回落）判定。
      切换写 `auth.tenant_switch` 审计。
    operationId: bizAuthTenantSwitch
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../../components.yaml#/components/schemas/TenantSwitchRequest"
    responses:
      "200":
        description: ok
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../../components.yaml#/components/schemas/Envelope"
                - type: object
                  properties:
                    data:
                      $ref: "../../components.yaml#/components/schemas/TenantSwitchResult"
      "400":
        $ref: "../../components.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../../components.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../../components.yaml#/components/responses/Forbidden"
      "500":
        $ref: "../../components.yaml#/components/responses/InternalError"
      "503":
        $ref: "../../components.yaml#/components/responses/ServiceUnavailable"
