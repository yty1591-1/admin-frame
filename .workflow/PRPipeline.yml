# Gitee Go — Pull Request 质量门禁
# 对齐 docs/CI_STANDARDS.md 与 .github/workflows/ci.yml（CI-03～CI-09）。
# 开通：仓库启用 Gitee Go 后识别 .workflow/；golangVersion 请改为控制台可用的最高版本（须满足 go.mod）。

version: "1.0"
name: pr-pipeline
displayName: PR CI

triggers:
  pr:
    branches:
      precise:
        - main
        - master

variables:
  GOLANGCI_LINT_VERSION: v2.14.0
  # golangVersion 字段已钉扎为 "1.26"；若控制台无此版本，全文替换为可用最高版（须满足 go.mod）

stages:
  - name: quality-gates
    displayName: 质量门禁
    strategy: fast
    trigger: auto
    steps:
      - step: build@golang
        name: fmt
        displayName: fmt
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh fmt

      - step: build@golang
        name: mod
        displayName: mod
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh mod

      - step: build@golang
        name: lint
        displayName: lint
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - export GOLANGCI_LINT_VERSION=${GOLANGCI_LINT_VERSION}
          - bash scripts/ci/gitee-job.sh lint

      - step: build@golang
        name: test
        displayName: test
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh test

      - step: build@golang
        name: vuln
        displayName: vuln
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh vuln

      - step: build@golang
        name: arch
        displayName: arch
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - bash scripts/ci/gitee-job.sh arch

      - step: build@golang
        name: secrets
        displayName: secrets
        golangVersion: "1.22"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh secrets

      - step: build@golang
        name: build
        displayName: build
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh build
