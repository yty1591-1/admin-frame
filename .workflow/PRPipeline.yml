# Gitee Go — Pull Request 质量门禁
# 对齐 docs/CI_STANDARDS.md 与 .github/workflows/ci.yml（含 secrets、openapi）。
# 开通：仓库启用 Gitee Go 后识别 .workflow/；golangVersion 请改为控制台可用的最高版本（须满足 go.mod）。

version: "1.0"
name: pr-pipeline
displayName: PR CI

triggers:
  pr:
    branches:
      precise:
        - main
        - master

variables:
  GOLANGCI_LINT_VERSION: v2.14.0
  # golangVersion 字段已钉扎为 "1.26"；若控制台无此版本，全文替换为可用最高版（须满足 go.mod）

stages:
  - name: quality-gates
    displayName: 质量门禁
    strategy: fast
    trigger: auto
    steps:
      - step: build@golang
        name: fmt
        displayName: fmt
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh fmt

      - step: build@golang
        name: mod
        displayName: mod
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh mod

      - step: build@golang
        name: lint
        displayName: lint
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - export GOLANGCI_LINT_VERSION=${GOLANGCI_LINT_VERSION}
          - bash scripts/ci/gitee-job.sh lint

      - step: build@golang
        name: test
        displayName: test
        golangVersion: "1.26"
        # SQL 仓储集成测试（tests/integration/iam）需 IAM_TEST_MYSQL_DSN 指向 MySQL 8.0；
        # 未配置时用例显式跳过并打印原因。GitHub Actions 由 mysql:8.0 service 注入。
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - export IAM_TEST_MYSQL_DSN="${IAM_TEST_MYSQL_DSN:-}"
          - bash scripts/ci/gitee-job.sh test

      - step: build@golang
        name: vuln
        displayName: vuln
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh vuln

      - step: build@golang
        name: arch
        displayName: arch
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - bash scripts/ci/gitee-job.sh arch

      - step: build@golang
        name: secrets
        displayName: secrets
        golangVersion: "1.22"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh secrets

      - step: build@golang
        name: openapi
        displayName: openapi
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - git fetch --no-tags --depth=1 origin main master 2>/dev/null || true
          - bash scripts/ci/gitee-job.sh openapi

      # 前端门禁（FE-01～FE-20；docs/frontend-architecture.md §15/§16.2）。
      - step: build@nodejs
        name: frontend
        displayName: frontend
        nodeVersion: "20"
        commands:
          - set -euo pipefail
          - bash scripts/ci/gitee-job.sh frontend

      - step: build@golang
        name: build
        displayName: build
        golangVersion: "1.26"
        commands:
          - set -euo pipefail
          - export GOPROXY=https://goproxy.cn,direct
          - bash scripts/ci/gitee-job.sh build
