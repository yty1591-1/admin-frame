# 前端静态站点 Nginx 基线（INF-REL-02）。
# 运行于 nginx-unprivileged，监听 8080，工作进程以非 root 运行。
# 缓存策略：
#   - /assets/*  : 构建产物带内容哈希，长缓存 + immutable
#   - /index.html、/config.js : 必须 no-store，保证发版与配置变更即时生效
#   - 其余路径 : SPA 回退到 index.html，同样不缓存

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # 文案与响应体压缩；已压缩类型不重复压缩。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # 探针不写访问日志，避免噪声。
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 运行时配置由 Helm ConfigMap / 发布流水线覆盖，禁止任何缓存。
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 入口必须每次回源：否则旧 index.html 会引用已删除的 hash 资源。
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 构建产物文件名含内容哈希，可安全长缓存；缺失时 404，不回退到 index.html。
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA 回退：未知路径交给前端路由，响应本身不缓存。
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
