{{- range $key, $w := .Values.workloads }}
{{- if $w.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "admin-frame-frontend.fullname" $ }}-{{ $key }}
  labels:
    {{- include "admin-frame-frontend.labels" (dict "root" $ "component" $key) | nindent 4 }}
spec:
  replicas: {{ $w.replicas }}
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 静态站点滚动发布：先起新副本再摘旧副本，避免 404/白屏窗口。
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "admin-frame-frontend.selectorLabels" (dict "root" $ "component" $key) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "admin-frame-frontend.selectorLabels" (dict "root" $ "component" $key) | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # 配置变化触发滚动，避免 Pod 继续提供旧 config.js。
        checksum/config: {{ $w.runtime | toJson | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "admin-frame-frontend.image" (dict "root" $ "workload" $w) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if $w.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $w.probes.path }}
              port: http
            initialDelaySeconds: {{ $w.probes.initialDelaySeconds }}
            periodSeconds: {{ $w.probes.periodSeconds }}
            timeoutSeconds: {{ $w.probes.timeoutSeconds }}
            failureThreshold: {{ $w.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $w.probes.path }}
              port: http
            initialDelaySeconds: {{ add $w.probes.initialDelaySeconds 5 }}
            periodSeconds: {{ $w.probes.periodSeconds }}
            timeoutSeconds: {{ $w.probes.timeoutSeconds }}
            failureThreshold: {{ $w.probes.failureThreshold }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                # 给 kube-proxy / Ingress 摘流留出时间，再停止 Nginx。
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "admin-frame-frontend.fullname" $ }}-{{ $key }}-runtime
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
