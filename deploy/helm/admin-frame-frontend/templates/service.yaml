{{- range $key, $w := .Values.workloads }}
{{- if and $w.enabled $w.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "admin-frame-frontend.fullname" $ }}-{{ $key }}
  labels:
    {{- include "admin-frame-frontend.labels" (dict "root" $ "component" $key) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $w.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "admin-frame-frontend.selectorLabels" (dict "root" $ "component" $key) | nindent 4 }}
{{- end }}
{{- end }}
