{{- range $key, $w := .Values.workloads }}
{{- if $w.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "admin-frame-frontend.fullname" $ }}-{{ $key }}-runtime
  labels:
    {{- include "admin-frame-frontend.labels" (dict "root" $ "component" $key) | nindent 4 }}
data:
  # 运行期配置：仅非敏感项；由 Deployment 以 subPath 挂载覆盖镜像内默认 config.js。
  config.js: |
    window.__APP_CONFIG__ = {{ $w.runtime | toJson }};
{{- end }}
{{- end }}
