# 生产覆盖示例（INF-REL-03 / INF-REL-05）。
# 仅列与环境相关的差异；未出现的键继承 values.yaml。
# 发布流水线必须把 image.digest 写成 sha256:<64 hex>，禁止 tag=latest。

image:
  pullPolicy: IfNotPresent

workloads:
  admin:
    replicas: 3
    image:
      # TODO(发布)：由流水线写入 digest，例如 sha256:...。
      digest: ""
    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "2m"
      host: admin.example.com
      path: /
      pathType: Prefix
      # TODO(发布)：替换为实际 TLS Secret 名称。
      tls:
        - secretName: admin-frame-admin-tls
          hosts:
            - admin.example.com
    pdb:
      enabled: true
      minAvailable: 2

  biz:
    replicas: 3
    image:
      digest: ""
    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "2m"
      host: biz.example.com
      path: /
      pathType: Prefix
      tls:
        - secretName: admin-frame-biz-tls
          hosts:
            - biz.example.com
    pdb:
      enabled: true
      minAvailable: 2
