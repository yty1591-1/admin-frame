# 预发基线：真实依赖、2 副本、StatefulSet（雪花 node_id 由 ordinal 派生）。
image:
  tag: ""

config:
  env: staging
  auth:
    mode: jwt
    jwt:
      alg: RS256
      issuer: admin-frame
      audience: [admin, biz, c, worker]
      public_key_file: /etc/admin-frame/jwt/public.pem
      # 预发与生产同构：A/B 端开启身份域，需要私钥签发令牌。
      active_kid: v1
      keys:
        - kid: v1
          public_key_file: /etc/admin-frame/jwt/public.pem
          private_key_file: /etc/admin-frame/jwt/private.pem
  db:
    driver: mysql
    dsn: "" # ADMIN_FRAME_DB_DSN 由 Secret 注入
  redis:
    addr: redis-master.redis.svc.cluster.local:6379
    key_prefix: "admin-frame/staging/"
  storage:
    driver: s3
    key_prefix: "staging/"
    s3:
      endpoint: https://minio.storage.svc.cluster.local:9000
      region: us-east-1
      bucket: admin-frame-staging
      force_path_style: true
  tracing:
    enabled: true
    exporter: otlp
    endpoint: otel-collector.observability.svc.cluster.local:4318
    sample_ratio: 1.0 # 交给 Collector 尾部采样
    insecure: true
  async:
    enabled: true
    driver: db
    outbox:
      publish_in_api: false
  iam:
    mode: shadow
    cache:
      driver: redis
  # 与 prod 同构：全局关闭，A/B 端由 configOverrides 开启。
  identity:
    enabled: false
  notification:
    channels:
      email:
        driver: smtp
        from: no-reply@staging.example.com
        from_name: AdminFrame
        smtp:
          host: smtp.staging.example.com
          port: 587
          encryption: starttls
          auth: plain
          username: no-reply@staging.example.com
          password_env: ADMIN_FRAME_NOTIFICATION_SMTP_PASSWORD
          tls_min_version: "1.2"
      sms:
        driver: disabled
      push:
        driver: disabled

jwtPublicKey:
  enabled: true
  secretName: admin-frame-jwt
  key: public.pem

jwtPrivateKey:
  enabled: true
  key: private.pem

identitySecrets:
  enabled: true
  secretName: admin-frame-identity
  hashKeyKey: hash_key
  mfaSecretKey: mfa_secret_key

env:
  - name: ADMIN_FRAME_DB_DSN
    valueFrom:
      secretKeyRef:
        name: admin-frame-db
        key: dsn
  - name: ADMIN_FRAME_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: admin-frame-redis
        key: password
        optional: true
  # 通知运行时装配期 fail closed：c-api 回调验签密钥（>=32 字节）与 worker 黑名单盐。
  # 密钥由外部密钥管理同步到 Secret，禁止写入 values 明文。
  - name: ADMIN_FRAME_NOTIFICATION_CALLBACK_SECRET
    valueFrom:
      secretKeyRef:
        name: admin-frame-notification
        key: callback_secret
  - name: ADMIN_FRAME_NOTIFICATION_BLACKLIST_SALT
    valueFrom:
      secretKeyRef:
        name: admin-frame-notification
        key: blacklist_salt
  - name: ADMIN_FRAME_NOTIFICATION_SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: admin-frame-notification
        key: smtp_password

workloads:
  admin:
    replicas: 2
    statefulset:
      enabled: true
    configOverrides:
      identity:
        enabled: true
        mfa:
          admin_required: true
    ingress:
      enabled: true
      className: nginx
      host: admin.staging.example.com
      path: /admin
  biz:
    replicas: 2
    statefulset:
      enabled: true
    configOverrides:
      identity:
        enabled: true
        mfa:
          admin_required: false
    ingress:
      enabled: true
      className: nginx
      host: biz.staging.example.com
      path: /biz
  c:
    replicas: 2
    statefulset:
      enabled: true
    configOverrides:
      iam:
        mode: "off"
    ingress:
      enabled: true
      className: nginx
      host: c.staging.example.com
      path: /c
  worker:
    replicas: 1
    statefulset:
      enabled: true
    configOverrides:
      iam:
        mode: "off"

migrate:
  enabled: true

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true
