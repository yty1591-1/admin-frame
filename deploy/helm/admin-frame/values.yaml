# admin-frame Chart 默认值（开发基线）。
# 环境差异只允许出现在 values-<env>.yaml，禁止在模板中写死。
# 密钥一律通过 Secret / env 注入，禁止写入本文件或 ConfigMap。

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  namespace: admin-frame
  # 空则回退 Chart.AppVersion；生产用 values-prod 覆盖为 digest。
  tag: ""
  # 形如 sha256:<64 hex>；设置后优先于 tag（AC-ENT-05-3）。
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# 渲染到每个 workload ConfigMap 的应用配置。
# service / channel / addr / id 由 workload 注入，无需在此声明。
config:
  env: dev
  shutdown_timeout: 15s
  log:
    level: info
    format: json
  http:
    read_header_timeout: 5s
    read_timeout: 15s
    write_timeout: 30s
    idle_timeout: 60s
    timeout: 30s
  auth:
    mode: demo
  db:
    driver: memory
    dsn: ""
    # 连接池：0 表示沿用 pkg/db 默认值（open=25 / idle=5 / lifetime=30m）。
    # max_open_conns 同时是 db_pool_max_open_connections 指标与 DBPoolExhaustion 告警的分母。
    max_open_conns: 0
    max_idle_conns: 0
    conn_max_lifetime: 0s
  redis:
    addr: ""
    username: ""
    password: ""
    db: 0
    key_prefix: "admin-frame/"
  storage:
    driver: memory
    key_prefix: "local/"
  tracing:
    enabled: true
    exporter: none
    endpoint: ""
    insecure: true
  async:
    enabled: false
  audit:
    # 审计异步导出（ENT-04 T5）：async=true 才提供 POST 导出与任务下载路由。
    # 导出文件落对象存储，API 与 worker 必须指向同一个桶——`storage.driver=memory`
    # 不跨进程共享，只能用于单进程联调（kind/prod 请用 local/s3/oss/cos/obs）。
    export:
      async: false
      ttl_days: 7
      retry_max: 3
      poll_interval: 10s
      stale_timeout: 10m
      bucket: ""
    # 到期归档：非空时「先写归档对象、再删行」，归档失败即中止清理。
    # 留空则直接删除（AUD-07 不推荐的销毁路径，仅用于本地）。
    retention:
      archive_prefix: ""
  iam:
    # 必须带引号：YAML 1.1 会把裸 off 解析成布尔 false，渲染后变成
    # `iam.mode: false`，容器启动即报 `unsupported iam.mode: false` 并 CrashLoop。
    # helm lint / kubectl --dry-run=server 都发现不了（属运行时配置校验），
    # 只有真部署才暴露。make check-deploy 有断言防回归。
    mode: "off"
  identity:
    enabled: false

# JWT 公钥挂载（RS256 必需）；Secret 由组织创建，Chart 不渲染密钥值。
jwtPublicKey:
  enabled: false
  secretName: ""
  key: public.pem

# 身份域密钥注入：values-identity-enabled.yaml 会打开并引用同一 Secret。
# Secret 需包含 hash_key（32B HMAC 主密钥）与 mfa_secret_key（32B AES-GCM 主密钥）。
identitySecrets:
  enabled: false
  secretName: admin-frame-identity
  hashKeyKey: hash_key
  mfaSecretKey: mfa_secret_key

# 额外环境变量（Secret 引用示例见 values-prod.yaml）。
env: []
envFrom: []

workloads:
  admin:
    enabled: true
    serviceName: admin-api
    channel: admin
    nodeID: 1
    image:
      repository: admin-api
    port: 8080
    replicas: 1
    # 多副本 + 雪花 ID 时启用 StatefulSet（node_id 由 HOSTNAME ordinal 派生）。
    statefulset:
      enabled: false
    configOverrides: {}
    probes:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      # 可选：按 Pod 暴露的辅助信号（如 identity_login_qps），需 Prometheus Adapter。
      podsMetrics: []
    pdb:
      enabled: false
      minAvailable: 1
    service:
      enabled: true
      port: 80
    ingress:
      enabled: false
      className: ""
      annotations: {}
      host: admin.localhost
      path: /admin
      pathType: Prefix
      tls: []

  biz:
    enabled: true
    serviceName: biz-api
    channel: biz
    nodeID: 2
    image:
      repository: biz-api
    port: 8080
    replicas: 1
    statefulset:
      enabled: false
    configOverrides: {}
    probes:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: false
      minAvailable: 1
    service:
      enabled: true
      port: 80
    ingress:
      enabled: false
      className: ""
      annotations: {}
      host: biz.localhost
      path: /biz
      pathType: Prefix
      tls: []

  c:
    enabled: true
    serviceName: c-api
    channel: c
    nodeID: 3
    image:
      repository: c-api
    port: 8080
    replicas: 1
    statefulset:
      enabled: false
    configOverrides: {}
    probes:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: false
      minAvailable: 1
    service:
      enabled: true
      port: 80
    ingress:
      enabled: false
      className: ""
      annotations: {}
      host: c.localhost
      path: /c
      pathType: Prefix
      tls: []

  worker:
    enabled: true
    serviceName: worker
    channel: worker
    nodeID: 4
    image:
      repository: worker
    port: 8090
    replicas: 1
    statefulset:
      enabled: false
    configOverrides: {}
    # worker 暴露 /metrics、/healthz、/readyz；生产 overlay 开启探针与 Service，供指标抓取。
    probes:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: false
      minAvailable: 1
    service:
      enabled: false
      port: 80
    ingress:
      enabled: false

# 迁移 Job：post-install/post-upgrade 执行，失败阻断（需 helm --atomic --wait）。
migrate:
  enabled: false
  image:
    repository: migrate
    tag: ""
    digest: ""
  dir: /app/migrations
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

serviceMonitor:
  enabled: false
  # 集群缺少 monitoring.coreos.com/v1（Prometheus Operator CRD）时的行为。
  # false（默认）：渲染失败并提示先安装 Operator —— 避免 `helm install` 抛
  #               难懂的 `no matches for kind "ServiceMonitor"`。
  # true：跳过 ServiceMonitor 渲染（该环境不抓取指标时才这样设；指标会缺失）。
  # 离线渲染（helm template）不会自带 CRD，用
  #   --api-versions monitoring.coreos.com/v1
  # 声明模拟的 API 集合，而不是把这个开关设成 true。必须写组版本；
  # 带 Kind 后缀的 `monitoring.coreos.com/v1/ServiceMonitor` 不命中判断。
  allowMissingCRD: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []

networkPolicy:
  enabled: false
  # Ingress 控制器所在命名空间的标签；按实际安装调整。
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # 允许出站的依赖端口（DB/Redis/OTel/OAuth/短信 HTTPS）。
  # 443 用于 C 端 OAuth2 IdP 与云短信 API；如强调最小权限，可改为
  # 基于 to.namespaceSelector / ipBlock 的域名级策略。
  egressPorts:
    - port: 3306
      protocol: TCP
    - port: 5432
      protocol: TCP
    - port: 6379
      protocol: TCP
    - port: 4317
      protocol: TCP
    - port: 4318
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 80
      protocol: TCP
