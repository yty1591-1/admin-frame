# 本地 kind 集群验证基线（ENT-05 AC-ENT-05-1 / AC-ENT-05-4 的可重复执行环境）。
#
# 用途：在没有 staging 集群时，用 kind 真跑一遍「渲染 → 部署 → 冒烟 → 回滚」。
# 与 values-staging.yaml 的差异**只在集群外依赖**，编排语义保持一致：
#   保留：迁移 Job、探针、PDB、安全上下文、只读根文件系统、ServiceMonitor
#   替代：storage 用 memory（本地无 MinIO）、tracing 关闭（本地无 Collector）、
#         ingress 关闭（本地无 ingress controller）、副本 1（单节点）
#
# 前置（一次性）：
#   kind create cluster --name af-verify --image kindest/node:v1.34.3
#   helm install prometheus-operator-crds prometheus-community/prometheus-operator-crds -n monitoring --create-namespace
#   kubectl create ns admin-frame
#   # MySQL / Redis / Secret 见 docs/deploy-kind-verify.md
#
# 镜像：镜像需先 `kind load docker-image` 或导入节点（本地构建 tag=verify）。
image:
  registry: docker.io
  namespace: admin-frame
  tag: verify
  pullPolicy: IfNotPresent

config:
  env: staging
  auth:
    mode: jwt
    jwt:
      alg: RS256
      issuer: admin-frame
      audience: [admin, biz, c, worker]
      public_key_file: /etc/admin-frame/jwt/public.pem
  db:
    driver: mysql
    dsn: "" # 由 Secret admin-frame-db 注入
    # 本地集群刻意把池压小：ENT-06 T6 的 DBPoolExhaustion 注入需要 in_use/max > 0.9
    # 持续 5m，池越小越容易在个位数并发下命中，且不会打坏 kind 节点。
    max_open_conns: 6
    max_idle_conns: 3
    conn_max_lifetime: 10m
  redis:
    addr: redis.admin-frame.svc.cluster.local:6379
    key_prefix: "admin-frame/kind/"
  storage:
    driver: memory
    key_prefix: "kind/"
  tracing:
    enabled: true
    exporter: none
    endpoint: ""
    insecure: true
  async:
    enabled: true
    driver: db
    outbox:
      publish_in_api: false
  iam:
    mode: shadow
    cache:
      driver: redis
  # 本机 kind 无 SMTP/短信/推送依赖：env=staging 禁止 memory，
  # 因此三类渠道显式 disabled，保证告警与落库链路仍可验证。
  notification:
    channels:
      email:
        driver: disabled
      sms:
        driver: disabled
      push:
        driver: disabled

jwtPublicKey:
  enabled: true
  secretName: admin-frame-jwt
  key: public.pem

env:
  - name: ADMIN_FRAME_DB_DSN
    valueFrom:
      secretKeyRef:
        name: admin-frame-db
        key: dsn
  - name: ADMIN_FRAME_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: admin-frame-redis
        key: password
        optional: true
  # NT-07 / 通知黑名单：c-api 回调验签密钥（>=32 字节）与 worker 黑名单盐
  # 都是启动期 fail-closed 校验项，缺失会直接 CrashLoopBackOff。
  # 仅本机 kind 演练用，值来自 Secret admin-frame-notification（见部署文档）。
  - name: ADMIN_FRAME_NOTIFICATION_CALLBACK_SECRET
    valueFrom:
      secretKeyRef:
        name: admin-frame-notification
        key: callback_secret
  - name: ADMIN_FRAME_NOTIFICATION_BLACKLIST_SALT
    valueFrom:
      secretKeyRef:
        name: admin-frame-notification
        key: blacklist_salt

workloads:
  admin:
    replicas: 1
    ingress:
      enabled: false
  biz:
    replicas: 1
    ingress:
      enabled: false
  c:
    replicas: 1
    configOverrides:
      iam:
        mode: "off"
    ingress:
      enabled: false
  worker:
    replicas: 1
    configOverrides:
      iam:
        mode: "off"

migrate:
  enabled: true
  image:
    repository: migrate
    tag: verify

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: false
