{{- if .Values.migrate.enabled }}
# 迁移 Job：pre-install / pre-upgrade 执行。
#
# 为什么必须是 pre-* 而不是 post-*：post-install hook 在 API Deployment 之后
# 才执行，Pod 与 Job 同时启动，API 可能在表还没建好时就对外提供 503/500 或
# 在旧 schema 上运行新代码。pre-* 保证「迁移失败 → 发布不继续」。
#
# 代价与配套：pre-install 阶段 release 资源尚未创建，主 ConfigMap 不存在，
# 因此 Job 挂载的是同内容、以 hook 形式渲染的 <fullname>-migrate-config
# （weight -10，见 migrate-config.yaml）。
#
# 发布须使用 `helm upgrade --install --atomic --wait`：Job 失败会回滚（T7）。
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "admin-frame.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "admin-frame.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # 保留最近一次成功 / 失败的 Job 以便查迁移日志；
    # 下一次发布由 before-hook-creation 清理，不会累积。
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "admin-frame.labels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "admin-frame.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "admin-frame.image" (dict "root" . "workload" (dict "image" .Values.migrate.image)) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/admin-frame/config.yaml
            - -dir
            - {{ .Values.migrate.dir }}
            - -action
            - up
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/admin-frame
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if ((.Values.secretMounts | default dict).enabled) }}
            # 迁移同样走托管源：否则出现「服务端读文件、迁移仍读环境变量」的分裂。
            - name: app-secrets
              mountPath: {{ .Values.secretMounts.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "admin-frame.fullname" . }}-migrate-config
        - name: tmp
          emptyDir: {}
        {{- if ((.Values.secretMounts | default dict).enabled) }}
        - name: app-secrets
          projected:
            defaultMode: 0400
            sources:
              {{- range .Values.secretMounts.sources }}
              - secret:
                  name: {{ .secretName }}
                  {{- if .optional }}
                  optional: true
                  {{- end }}
                  items:
                    {{- toYaml .items | nindent 20 }}
              {{- end }}
        {{- end }}
{{- end }}
