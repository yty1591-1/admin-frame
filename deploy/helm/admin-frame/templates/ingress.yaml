{{- range $key, $w := .Values.workloads }}
{{- if and $w.enabled $w.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "admin-frame.fullname" $ }}-{{ $key }}
  labels:
    {{- include "admin-frame.labels" (dict "root" $ "component" $key) | nindent 4 }}
  {{- with $w.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $w.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $w.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $w.ingress.host }}
      http:
        paths:
          - path: {{ $w.ingress.path }}
            pathType: {{ $w.ingress.pathType }}
            backend:
              service:
                name: {{ include "admin-frame.fullname" $ }}-{{ $key }}
                port:
                  number: {{ $w.service.port }}
{{- end }}
{{- end }}
