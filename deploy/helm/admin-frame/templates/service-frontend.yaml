{{- $apps := dict "web-admin" .Values.frontend.webAdmin "web-biz" .Values.frontend.webBiz }}
{{- range $name, $app := $apps }}
{{- if $app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "admin-frame.fullname" $ }}-{{ $name }}
  labels:
    {{- include "admin-frame.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "admin-frame.selectorLabels" (dict "root" $ "component" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $app.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
