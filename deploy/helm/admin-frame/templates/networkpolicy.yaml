{{- if .Values.networkPolicy.enabled }}
# 默认拒绝：覆盖本 Release 的全部 Pod，再按需放行。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "admin-frame.fullname" . }}-default-deny
  labels:
    {{- include "admin-frame.labels" (dict "root" . "component" "") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
---
# 允许 Ingress 控制器访问 API 的 http 端口。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "admin-frame.fullname" . }}-allow-api-ingress
  labels:
    {{- include "admin-frame.labels" (dict "root" . "component" "") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["admin", "biz", "c"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
---
# 允许 DNS 与依赖端口出站（DB / Redis / OTel）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "admin-frame.fullname" . }}-allow-egress
  labels:
    {{- include "admin-frame.labels" (dict "root" . "component" "") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        {{- toYaml .Values.networkPolicy.egressPorts | nindent 8 }}
{{- if .Values.workloads.config.enabled }}
---
# M2：仅允许本 Release 的 API / worker 访问 config-api（无公网 Ingress）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "admin-frame.fullname" . }}-allow-config-api
  labels:
    {{- include "admin-frame.labels" (dict "root" . "component" "config") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: config
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["admin", "biz", "c", "worker"]
      ports:
        - protocol: TCP
          port: {{ .Values.workloads.config.port | default 8085 }}
{{- end }}
{{- end }}
