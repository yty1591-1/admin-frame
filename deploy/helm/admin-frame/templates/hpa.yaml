{{- range $key, $w := .Values.workloads }}
{{- if and $w.enabled $w.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "admin-frame.fullname" $ }}-{{ $key }}
  labels:
    {{- include "admin-frame.labels" (dict "root" $ "component" $key) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ if $w.statefulset.enabled }}StatefulSet{{ else }}Deployment{{ end }}
    name: {{ include "admin-frame.fullname" $ }}-{{ $key }}
  minReplicas: {{ $w.autoscaling.minReplicas }}
  maxReplicas: {{ $w.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $w.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
