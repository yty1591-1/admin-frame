{{- range $key, $w := .Values.workloads }}
{{- if and $w.enabled $w.statefulset.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "admin-frame.fullname" $ }}-{{ $key }}-headless
  labels:
    {{- include "admin-frame.labels" (dict "root" $ "component" $key) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "admin-frame.selectorLabels" (dict "root" $ "component" $key) | nindent 4 }}
  ports:
    - name: http
      port: {{ $w.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
