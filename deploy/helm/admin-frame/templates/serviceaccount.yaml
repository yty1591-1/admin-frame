{{- if .Values.serviceAccount.create }}
{{- /*
ServiceAccount 必须是 pre-install hook（weight -20）。

原因：迁移 Job 在 pre-install 阶段运行，而 release 资源此时尚未创建，
Pod 创建会被拒：`serviceaccount "<fullname>" not found`，Job 永远卡在
Running 且没有 Pod（2026-11-02 kind 实测）。

代价可控：该 SA 无 RBAC 绑定（templates/ 下没有 Role/RoleBinding）、
无状态、幂等，因此 hook 化不改变 rollback 语义。`helm uninstall` 不会
删除它，下次 install 由 before-hook-creation 先删后建。
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "admin-frame.serviceAccountName" . }}
  labels:
    {{- include "admin-frame.labels" (dict "root" . "component" "") | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- end }}
