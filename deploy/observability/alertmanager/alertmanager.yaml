# Alertmanager 基线（ENT-06 T5）
#
# 路由约定：
#   P1 → 立即呼叫（Pager）；P2 → 工单/值班频道；P3 → 工作时间处理。
#   维护窗期间用 silence 抑制；DB 池耗尽时抑制同服务 P2 噪音。
# 注意：receiver URL 为占位，接入时替换为组织实际 Pager/IM Webhook。
route:
  receiver: ticket
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "P1"
      receiver: pager
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    - matchers:
        - severity = "P2"
      receiver: ticket
      group_wait: 1m
      repeat_interval: 4h
    - matchers:
        - severity = "P3"
      receiver: ticket
      repeat_interval: 12h

inhibit_rules:
  # 数据库不可用时，抑制同服务的下游 P2 噪音（5xx/latency 另行保留 P1）。
  - source_matchers:
      - alertname = "DBPoolExhaustion"
    target_matchers:
      - severity = "P2"
    equal: [service]
  # 发布回滚期间抑制重复告警，避免切换窗口告警风暴。
  - source_matchers:
      - alertname = "ReleaseHealthFailed"
    target_matchers:
      - severity =~ "P1|P2"
    equal: [service]

receivers:
  - name: pager
    webhook_configs:
      - url: "https://pager.example.invalid/hooks/admin-frame"
        send_resolved: true
        max_alerts: 0
  - name: ticket
    webhook_configs:
      - url: "https://ticket.example.invalid/hooks/admin-frame"
        send_resolved: true
        max_alerts: 0
