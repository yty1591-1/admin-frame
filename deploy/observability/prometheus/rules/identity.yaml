# 身份域核心告警（IDN-GAP-P0-06）。
#
# 指标由 internal/identity/observability 注册；标签均为低基数枚举。
# 注意：登录失败率告警需结合业务基线调整阈值，避免把正常的密码输错误报为故障。

groups:
  - name: admin-frame-identity
    rules:
      - alert: IdentityTokenReuseDetected
        expr: increase(identity_token_reuse_total[5m]) > 0
        for: 0m
        labels:
          severity: P1
          alert_id: identity.token.reuse
        annotations:
          summary: "检测到刷新令牌重放"
          description: "5 分钟内出现刷新令牌重放，整条设备链已被撤销；立即排查账号是否被盗用。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityLockoutSpike
        expr: sum(increase(identity_lockout_total[5m])) > 5
        for: 5m
        labels:
          severity: P1
          alert_id: identity.lockout.spike
        annotations:
          summary: "账号锁定次数异常升高"
          description: "5 分钟内锁定超过 5 次，可能是撞库或锁定阈值配置过低；结合登录失败原因排查。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityRevocationStoreErrors
        expr: sum(increase(identity_revocation_store_errors_total[5m])) > 0
        for: 1m
        labels:
          severity: P1
          alert_id: identity.revocation.store_error
        annotations:
          summary: "撤销存储读 / 回源失败"
          description: "Redis 或 DB 回源失败，可能触发 fail_closed 全量 503；检查 Redis 与数据库健康度。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityRevocationCacheWriteErrors
        expr: sum(increase(identity_revocation_cache_write_error_total[5m])) > 0
        for: 5m
        labels:
          severity: P2
          alert_id: identity.revocation.cache_write_error
        annotations:
          summary: "撤销快照写入失败"
          description: "撤销快照写 Redis 失败；最长 60s 后回源生效，需关注 Redis 抖动。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityM2MSecretRotationDue
        expr: max by (client) (identity_m2m_secret_age_seconds) >= 90 * 24 * 3600
        for: 1h
        labels:
          severity: P3
          alert_id: identity.m2m.secret_rotation_due
        annotations:
          summary: "M2M 客户端 secret 超过轮换周期"
          description: "某客户端用于签发令牌的 secret 年龄超过 90 天（默认 max_secret_age=2160h）。仅提示轮换，不会自动失效；按 key-rotation 手册轮换并保留旧 secret 至宽限期结束。"
          runbook_url: docs/runbooks/key-rotation.md

      - alert: IdentityRefreshFailureRateHigh
        expr: |
          (
            sum(rate(identity_refresh_total{result="failure"}[5m]))
            /
            clamp_min(sum(rate(identity_refresh_total[5m])), 1e-9)
          ) > 0.1
        for: 10m
        labels:
          severity: P2
          alert_id: identity.refresh.failure_rate
        annotations:
          summary: "刷新令牌失败率超过 10%"
          description: "结合 token reuse、撤销存储错误与账号状态排查；持续高失败率会影响会话续期。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityLoginFailureRateHigh
        expr: |
          (
            sum(rate(identity_login_total{result="failure"}[5m]))
            /
            clamp_min(sum(rate(identity_login_total[5m])), 1e-9)
          ) > 0.3
        for: 10m
        labels:
          severity: P2
          alert_id: identity.login.failure_rate
        annotations:
          summary: "登录失败率超过 30%"
          description: "可能是撞库、凭据错误或上游依赖故障；结合 reason 标签与 AccessLog 排查。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityMFARecoveryUsed
        expr: increase(identity_mfa_recovery_used_total[5m]) > 0
        for: 0m
        labels:
          severity: P2
          alert_id: identity.mfa.recovery_used
        annotations:
          summary: "有账号使用 MFA 恢复码"
          description: "恢复码使用意味着用户丢失 TOTP 设备；建议通知账号所有者并核查操作来源。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentitySessionRevokeFailures
        expr: sum(increase(identity_session_revoke_total{result="failure"}[5m])) > 0
        for: 5m
        labels:
          severity: P2
          alert_id: identity.session.revoke_failure
        annotations:
          summary: "设备会话撤销失败"
          description: "撤销失败可能导致旧令牌继续可用；检查 DB/Redis 错误日志与事务回滚原因。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityCleanupFailures
        expr: increase(identity_cleanup_runs_total{result="failure"}[1h]) > 0
        for: 5m
        labels:
          severity: P2
          alert_id: identity.cleanup.failure
        annotations:
          summary: "身份域清理任务执行失败"
          description: "检查 worker 日志、DB 连接与归档表锁；失败期间会话表会持续增长。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityCleanupBacklog
        expr: increase(identity_cleanup_batch_limit_hit_total[1h]) > 0
        for: 10m
        labels:
          severity: P2
          alert_id: identity.cleanup.backlog
        annotations:
          summary: "身份域清理达到批次上限"
          description: "单轮清理未清空，存在积压；上调 batch_size/max_batches_per_run 或缩短 cleanup_interval。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityRefreshLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(identity_refresh_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: P2
          alert_id: identity.refresh.latency
        annotations:
          summary: "刷新令牌 P95 超过 500ms"
          description: "结合 DB / Redis 时延与撤销快照写入失败排查；持续超阈值会影响会话续期体验。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityMFALatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(identity_mfa_verify_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: P2
          alert_id: identity.mfa.latency
        annotations:
          summary: "MFA 校验 P95 超过 500ms"
          description: "TOTP / 恢复码校验与票据消费变慢；检查数据库锁等待与限流命中。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityStepUpLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(identity_step_up_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: P2
          alert_id: identity.step_up.latency
        annotations:
          summary: "特权操作 step-up P95 超过 500ms"
          description: "管理员高频操作被 MFA 校验拖慢；检查 MFA 限流与数据库负载。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityOAuthLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(identity_oauth_callback_duration_seconds_bucket[5m])) by (le, provider)
          ) > 3
        for: 10m
        labels:
          severity: P2
          alert_id: identity.oauth.latency
        annotations:
          summary: "OAuth 回调 P95 超过 3s"
          description: "IdP 响应变慢或网络抖动；结合 provider 熔断状态与超时配置排查。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityOutboxBacklog
        expr: identity_outbox_pending > 0
        for: 10m
        labels:
          severity: P2
          alert_id: identity.outbox.backlog
        annotations:
          summary: "identity.audit Outbox 存在积压"
          description: "审计事件未投递；检查 worker 存活、审计表写入与死信累积。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityOutboxLagHigh
        expr: identity_outbox_lag_seconds > 300
        for: 5m
        labels:
          severity: P2
          alert_id: identity.outbox.lag
        annotations:
          summary: "identity.audit 最老事件积压超过 5 分钟"
          description: "审计延迟影响合规；优先检查消费者吞吐与下游审计库。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentitySMSBreakerOpen
        expr: identity_sms_breaker_open == 1
        for: 5m
        labels:
          severity: P2
          alert_id: identity.sms.breaker_open
        annotations:
          summary: "短信供应商熔断打开"
          description: "验证码通道不可用；检查供应商余额、网络与凭据，恢复后熔断会自动半开探测。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityCleanupNotRunning
        expr: absent(identity_cleanup_runs_total)
        for: 2h
        labels:
          severity: P2
          alert_id: identity.cleanup.not_running
        annotations:
          summary: "身份域清理指标缺失"
          description: "worker 未暴露清理指标或清理任务未启动；确认 worker ServiceMonitor 抓取与 StartCleanup 日志。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      # SSO 失败类告警。校验失败是 fail-closed 快速返回（40100 / 50300），
      # 失败请求比成功更快，identity.oauth.latency 不会随之升高，
      # 因此必须直接观测 result 维度，而不能只靠延迟。
      - alert: IdentityOAuthCallbackFailureRate
        expr: |
          (sum by (provider) (rate(identity_oauth_callback_total{result="failure"}[10m]))
           / sum by (provider) (rate(identity_oauth_callback_total[10m]))) > 0.5
          and
          sum by (provider) (rate(identity_oauth_callback_total{result="failure"}[10m])) > 0.05
        for: 5m
        labels:
          severity: P1
          alert_id: identity.oauth.failure_rate
        annotations:
          summary: "OIDC 回调失败率超过 50%（provider={{ $labels.provider }}）"
          description: "签名 / issuer / audience / nonce 校验失败或 IdP 不可达；先看 reason 分布再动手，禁止关闭验签或放宽 audience。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityOIDCJWKSCacheStale
        expr: identity_oauth_jwks_cache_age_seconds > 3600
        for: 10m
        labels:
          severity: P1
          alert_id: identity.oidc.jwks_stale
        annotations:
          summary: "OIDC 公钥缓存 1 小时未刷新（provider={{ $labels.provider }}）"
          description: "默认 jwks_ttl=15m，超过 1 小时说明刷新持续失败或 IdP 不可达；未知 kid 会失败关闭，登录可能已全挂。阈值需按该 provider 配置的 jwks_ttl 调整。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentityOIDCJWKSRefreshFailing
        expr: increase(identity_oauth_jwks_refresh_total{result="failure"}[15m]) > 0
        for: 10m
        labels:
          severity: P2
          alert_id: identity.oidc.jwks_refresh_failing
        annotations:
          summary: "OIDC 公钥集刷新失败（provider={{ $labels.provider }}）"
          description: "前导指标：缓存尚可用时登录不受影响，但 IdP 一旦轮换签名 key 就会登录失败；检查网络、证书信任链与 JWKS 端点。"
          runbook_url: docs/runbooks/identity-auth-failure.md

      - alert: IdentitySAMLACSFailureRate
        expr: |
          (sum by (provider) (rate(identity_saml_acs_total{result="failure"}[10m]))
           / sum by (provider) (rate(identity_saml_acs_total[10m]))) > 0.5
          and
          sum by (provider) (rate(identity_saml_acs_total{result="failure"}[10m])) > 0.05
        for: 5m
        labels:
          severity: P1
          alert_id: identity.saml.acs_failure_rate
        annotations:
          summary: "SAML ACS 断言校验失败率超过 50%（provider={{ $labels.provider }}）"
          description: "证书轮换、XML Encryption 算法不匹配或时钟偏移；对照 identity-authn.md §8.2.1 的 Keycloak 兼容项排查。"
          runbook_url: docs/runbooks/identity-auth-failure.md
