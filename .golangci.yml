# golangci-lint v2。与 docs/COMMENT_STANDARDS.md、docs/CODE_STYLE.md 对齐。
# 二进制须用 Go >= 1.26 构建（钉扎 v2.14.0），否则无法加载 go 1.26.10 模块。
version: "2"
linters:
  enable:
    - gosec
    - gocritic
    - misspell
    - nakedret
    - nolintlint
    - revive
    - usestdlibvars
    - whitespace
  settings:
    gosec:
      # G104 与 errcheck 重复；演示令牌解析不涉及弱随机。
      excludes:
        - G104
    gocritic:
      disabled-checks:
        - whyNoLint
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - style
        - performance
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    nakedret:
      max-func-lines: 40
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      severity: error
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          severity: error
          disabled: false
        - name: package-comments
          severity: error
          disabled: false
        - name: indent-error-flow
        - name: if-return
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: var-naming
        - name: increment-decrement
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        path: cmd/.*/main\.go
        text: package-comments
      - linters:
          - revive
        path: _test\.go
        text: package-comments|exported
      - linters:
          - revive
        text: error strings should not be capitalized|error strings should not end with punctuation
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/admin-frame/admin-frame
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
