# golangci-lint v2。与 docs/COMMENT_STANDARDS.md、docs/CODE_STYLE.md 对齐。
# 二进制须用 Go >= 1.26 构建（钉扎 v2.14.0），否则无法加载 go 1.26.11 模块。
version: "2"
linters:
  enable:
    - depguard
    - gosec
    - gocritic
    - misspell
    - nakedret
    - nolintlint
    - revive
    - usestdlibvars
    - whitespace
  settings:
    # depguard 把 scripts/ci/check-layering.sh 的分层规则编译期化：
    # 脚本只在 CI 跑，编辑器与本地 `go build` 看不到；lint 阶段即可拦截。
    # 规则与脚本一一对应，改动须同步（ARCHITECTURE §6.1 / LAYER-01/03/04/10）。
    depguard:
      rules:
        transport-no-platform:
          list-mode: lax
          files: ["**/internal/*/transport/**", "!**/*_test.go"]
          deny:
            - pkg: "github.com/admin-frame/admin-frame/internal/platform"
              desc: "transport must depend on shared contracts (LAYER-01)"
        shared-no-platform:
          list-mode: lax
          files: ["**/internal/shared/**", "!**/*_test.go"]
          deny:
            - pkg: "github.com/admin-frame/admin-frame/internal/platform"
              desc: "shared contract layer must not import platform (LAYER-04)"
        security-no-platform:
          list-mode: lax
          files: ["**/internal/security/**", "!**/*_test.go"]
          deny:
            - pkg: "github.com/admin-frame/admin-frame/internal/platform"
              desc: "security must not import platform (LAYER-03)"
        pkg-no-internal:
          list-mode: lax
          files: ["**/pkg/**", "!**/*_test.go"]
          deny:
            - pkg: "github.com/admin-frame/admin-frame/internal"
              desc: "pkg must stay reusable: no internal/* import (LAYER-10)"
    gosec:
      # G104 与 errcheck 重复；演示令牌解析不涉及弱随机。
      excludes:
        - G104
    gocritic:
      disabled-checks:
        - whyNoLint
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - style
        - performance
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    nakedret:
      max-func-lines: 40
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      severity: error
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          severity: error
          disabled: false
        - name: package-comments
          severity: error
          disabled: false
        - name: indent-error-flow
        - name: if-return
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: var-naming
        - name: increment-decrement
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        path: cmd/.*/main\.go
        text: package-comments
      - linters:
          - revive
        path: _test\.go
        text: package-comments|exported
      - linters:
          - revive
        text: error strings should not be capitalized|error strings should not end with punctuation
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/admin-frame/admin-frame
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
