title = "admin-frame"

[extend]
useDefault = true

[allowlist]
description = "文档与演示令牌说明，不是真实密钥"
paths = [
  '''(^|/)docs/''',
  '''(^|/)README\.md$''',
  '''(^|/)\.github/PULL_REQUEST_TEMPLATE\.md$''',
  '''(^|/)\.gitee/PULL_REQUEST_TEMPLATE\.md$''',
  '''(^|/)docs/SECURITY_STANDARDS\.md$''',
]
regexes = [
  '''Bearer (admin|biz|c)\.[A-Za-z0-9._-]+''',
  # 测试用固定假 token（pkg/push/apns/client_test.go），并非真实凭据。
  '''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''',
  # 测试用固定假 HMAC 密钥（32 字节十六进制示例串），并非真实凭据。
  #
  # 代码侧已改为 strings.Repeat 构造（见 internal/*/testsupport_test.go），本条目
  # 仅用于放行历史提交中已存在的该向量：gitleaks 扫描的是 git 历史，
  # 删除工作区字面量并不能消除既有 commit 中的命中。
  '''^0123456789abcdef0123456789abcdef$''',
  # pkg/password/argon2.go 的默认参数常量名被 generic-api-key 误判。
  '''^defaultArgon2KeyLen$''',
  # pkg/jwt/manager_test.go 手工构造的 alg=none 测试向量。
  '''^eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0\.[A-Za-z0-9_-]*\.?$''',
  # configs/prod/env.example 的随机演练值：文件头已声明「视同泄露、禁止用于生产」。
  # gitleaks 扫描 git 历史，替换工作区字面量不能消除既有提交中的命中。
  '''^fd51b4775c2cc81269accb4e1c511c7f4393d159927c95c8$''',
  '''^ca24256120caa7c42ccaa14f43aa56c8a3d72b4b3cd2ac88b51ed2492101d753$''',
  '''^AFPRODMNFN5QQZBGXY$''',
  '''^878d6f395e595e146fd395418bfe4d9cdf0a596cda8ecb88f85b4d95de402c77$''',
  '''^7a1ec0f4290851c052cee9fb3b972bc5a8c14297c65e4301bb320b3e6f426454$''',
  '''^a0c1663bfcdb9f923a4d7171709b6b0d36ab2298053a36f4c26cf7a3b5c17c8a$''',
  # tests/e2e 的历史测试夹具（三端共用的 JWT 密钥）：已改为 strings.Repeat 构造
  # （见 tests/e2e/e2e_test.go 的 e2eJWTSecret），本条目只放行既有提交中的命中。
  '''^e2e-jwt-secret-0123456789abcdef0123456789abcdef$''',
]
