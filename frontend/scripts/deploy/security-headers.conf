# 前端静态站安全响应头（FE-SEC-02）。
# 通过 include 复用到 server 级与需要独立 Cache-Control 的 location；
# nginx 的 add_header 一旦在子级出现就不继承父级，因此这里集中定义。
# TLS 终止层（Ingress/LB）也必须重复下发 HSTS；本容器通常只监听 HTTP。
# CSP 先以 Report-Only 观察，staging 一周无 script-src 违规后再切强制；
# 届时内联 loading 脚本需改为 nonce/hash。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
