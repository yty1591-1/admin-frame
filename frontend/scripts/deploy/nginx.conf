
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip on;
  # gzip_buffers 32 16k;
  # gzip_comp_level 6;
  # gzip_min_length 1k;
  # gzip_static on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  server {
    listen 8080;
    server_name localhost;

    # FE-SEC-02：静态站安全头（集中定义在 security-headers.conf，Dockerfile 一并复制）。
    include /etc/nginx/security-headers.conf;

    # SPA 入口禁止缓存（MFA/登录等敏感页由 index.html 承载；FE-SEC-03）。
    # 该 location 出现 add_header 后不再继承 server 级头，因此重复 include。
    location = /index.html {
      root /usr/share/nginx/html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      # 同源静态站不再下发 CORS；API 由独立入口/反代提供。
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
