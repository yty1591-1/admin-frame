# 发版镜像流水线（RELEASE_STANDARDS + CI_STANDARDS §3.5）
# 变更本文件须同步审查 docs/CI_STANDARDS.md、docs/RELEASE_STANDARDS.md。
#
# 触发：push 到 main/master、push v* tag、手动。
# 产物：<registry>/<owner>/<cmd>:<version>，多架构 linux/amd64 + linux/arm64，推后 Trivy 扫描。
# 供应链（ENT-19 / RELEASE_STANDARDS §6）：按 **digest** 生成 CycloneDX SBOM 并上传 artifact，
# 用 cosign keyless 对 digest 签名、把 SBOM 作为 attestation 附加到 digest 上。
# 发布资产（RELS-15）：`v*` tag 额外产出 GitHub Release——5 个二进制的 linux/amd64+arm64
# bundle、各 cmd 的 CycloneDX SBOM、images.json（镜像→digest）与 SHA256SUMS。
# workflow artifact 只留 90 天，Release 资产才是发版后仍可追溯的凭据。
# 发布流水线在部署前验签（scripts/ci/verify-supply-chain.sh），验不过不部署。
# 注册表：默认 GHCR（GITHUB_TOKEN 推送）；私有仓库可设 Repository variable
#         IMAGE_REGISTRY，并另外注入推送凭据。

name: Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

# 发版镜像不取消进行中的构建，避免「一半已推送、一半被取消」的不可追溯状态。
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # keyless 签名：cosign 用 workflow 的 OIDC 身份换取 Fulcio 短期证书。
  # 缺这一项签名为空，发布流水线验签直接失败（宁可失败，不允许无签名镜像上线）。
  id-token: write

env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  PLATFORMS: linux/amd64,linux/arm64
  # 供应链工具版本钉扎（SB-07）：禁止 latest / master，否则校验逻辑随上游漂移。
  COSIGN_VERSION: v2.4.1

jobs:
  image:
    name: image (${{ matrix.cmd }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmd: admin-api
            context: .
            dockerfile: ./Dockerfile
          - cmd: biz-api
            context: .
            dockerfile: ./Dockerfile
          - cmd: c-api
            context: .
            dockerfile: ./Dockerfile
          - cmd: worker
            context: .
            dockerfile: ./Dockerfile
          - cmd: migrate
            context: .
            dockerfile: ./Dockerfile
          # 前端镜像：frontend/ 为构建上下文，目标为 Dockerfile 内的 web-admin / web-biz
          - cmd: web-admin
            context: frontend
            dockerfile: frontend/scripts/deploy/Dockerfile
          - cmd: web-biz
            context: frontend
            dockerfile: frontend/scripts/deploy/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # metadata-action 需要 tag 才能生成 semver 标签。
          fetch-depth: 0

      - name: Resolve image name and version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # RELS-01/§3：CI/预发用 <git-sha>，生产用 <semver>；本地 :local 不得推送。
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${MATRIX_CMD}" == web-* ]]; then
            extra_args="GIT_SHA=${GITHUB_SHA}"
          else
            extra_args="$(printf 'CMD=%s\nVERSION=%s\nCOMMIT=%s\nBUILD_TIME=%s' "${MATRIX_CMD}" "${version}" "${commit}" "${build_time}")"
          fi
          {
            echo "extra_args<<EOF"
            echo "${extra_args}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${owner}/${MATRIX_CMD}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_CMD: ${{ matrix.cmd }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          # RELS-01：禁止浮动 latest 作为推送标签。
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{version}}-sha-{{sha}}
          labels: |
            org.opencontainers.image.title=${{ matrix.cmd }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.cmd }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            ${{ steps.ver.outputs.extra_args }}
          cache-from: type=gha,scope=image-${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.cmd }}

      - name: Trivy scan (HIGH/CRITICAL)
        # 推后扫描：命中高危则 job 失败，禁止该 digest 进入生产（RELS-06 / §6）。
        # 按 digest 扫而不是按 tag：tag 可以被重新指向，扫 tag 等于扫了一个「当时的样子」。
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ver.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM (CycloneDX, by digest)
        # RELS-13：SBOM 与镜像同源（同一个 digest），不做「先造 SBOM 再补镜像」的事。
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ver.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.cmd }}.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.cmd }}
          path: sbom-${{ matrix.cmd }}.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.1
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image digest (keyless)
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # RELS-13：签的是 digest，不是 tag——签 tag 等于什么都没签（tag 可变）。
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SBOM (CycloneDX)
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: sbom-${{ matrix.cmd }}.cdx.json
        run: |
          set -euo pipefail
          # attestation 挂到 digest 上（OCI referrer），发布侧用 verify-attestation 取回。
          cosign attest --yes --type cyclonedx --predicate "${SBOM}" "${IMAGE}@${DIGEST}"

  # RELS-15：只读镜像的人也能核对一次发版——bundle 可直接运行，images.json 给出
  # 镜像→digest 的对应关系，SBOM 与 SHA256SUMS 让制品在本地可校验。
  # 不在主干 push 上产出：sha- 镜像是可丢弃产物，进 Release 页只会让「哪个是正式版」变模糊。
  release:
    name: release assets (${{ github.ref_name }})
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 创建/更新 GitHub Release 需要写权限；其余权限保持最小集。
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gh --generate-notes 依赖 tag 历史，浅克隆拿不到上一个 tag。
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binary bundles (linux/amd64, linux/arm64)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          BUILD_TIME: ${{ steps.ver.outputs.build_time }}
        run: |
          set -euo pipefail
          # 与 Dockerfile 同一套 ldflags：bundle 里的 /version 输出必须能对上发版号。
          LD="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            bundle="admin-frame-${VERSION}-linux-${arch}"
            work="dist/${bundle}"
            mkdir -p "${work}"
            for cmd in admin-api biz-api c-api worker migrate; do
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
                -ldflags "${LD}" -o "${work}/${cmd}" "./cmd/${cmd}"
            done
            # 只带 *.example：configs/prod/.env 里是演练凭据，不能随制品外发（SEC-01）。
            mkdir -p "${work}/configs"
            while IFS= read -r file; do
              mkdir -p "${work}/configs/$(dirname "${file}")"
              cp "configs/${file}" "${work}/configs/${file}"
            done < <(cd configs && find . -type f -name '*.example' | sort)
            cp -r migrations "${work}/migrations"
            tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
            rm -rf "${work}"
          done

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true
          path: dist

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digests
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          : > dist/digests.txt
          for cmd in admin-api biz-api c-api worker migrate web-admin web-biz; do
            image="${REGISTRY}/${owner}/${cmd}:${VERSION}"
            digest=""
            for attempt in 1 2 3 4 5; do
              digest="$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')"
              if printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                break
              fi
              echo "    ${image} 尚未就绪（第 ${attempt}/5 次），10s 后重试"
              sleep 10
            done
            if ! printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::${image} 的 digest 不可用：'${digest}'（Release 必须给出可核对的不可变引用）"
              exit 1
            fi
            printf '%s %s\n' "${cmd}" "${digest}" >> dist/digests.txt
          done

      - name: Write images manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
          BUILD_TIME: ${{ steps.ver.outputs.build_time }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "{"
            printf '  "version": "%s",\n' "${VERSION}"
            printf '  "commit": "%s",\n' "${COMMIT}"
            printf '  "build_time": "%s",\n' "${BUILD_TIME}"
            echo '  "images": {'
            first=1
            while read -r cmd digest; do
              [[ "${first}" -eq 1 ]] || echo ","
              first=0
              printf '    "%s": "%s/%s/%s@%s"' "${cmd}" "${REGISTRY}" "${owner}" "${cmd}" "${digest}"
            done < dist/digests.txt
            echo ""
            echo "  }"
            echo "}"
          } > dist/images.json

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.cdx.json ./images.json > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 重复推送同一 tag 时更新资产而不是报错；--clobber 让资产内容与本次构建一致。
          assets=()
          for f in dist/*.tar.gz dist/*.cdx.json dist/images.json dist/SHA256SUMS; do
            assets+=("${f}")
          done
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              "${assets[@]}"
          fi
