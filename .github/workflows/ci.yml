# CI_STANDARDS.md（CI-01～CI-14）
# 变更本文件须同步审查 docs/CI_STANDARDS.md。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0

      - name: Check gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Check goimports
        run: |
          out="$(goimports -local github.com/admin-frame/admin-frame -l .)"
          if [ -n "$out" ]; then
            echo "goimports needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

  mod:
    name: mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...
          skip-cache: false

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # MySQL 8.0 service 供 tests/integration/iam 验证 SQL 仓储（租户隔离、唯一约束、乐观锁、
    # 快照查询）。版本与 docs/rbac-iam.md §13.1 的数据库基线一致；不使用生产数据源（CI-12）。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iam_test
          MYSQL_USER: iam
          MYSQL_PASSWORD: iam
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      IAM_TEST_MYSQL_DSN: "iam:iam@tcp(127.0.0.1:3306)/iam_test?parseTime=true&loc=UTC"
      TENANT_TEST_MYSQL_DSN: "iam:iam@tcp(127.0.0.1:3306)/iam_test?parseTime=true&loc=UTC"
      NOTIFY_TEST_MYSQL_DSN: "iam:iam@tcp(127.0.0.1:3306)/iam_test?parseTime=true&loc=UTC"
      FEATUREFLAG_TEST_MYSQL_DSN: "iam:iam@tcp(127.0.0.1:3306)/iam_test?parseTime=true&loc=UTC"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race + coverage + gates
        run: bash scripts/ci/run-tests.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage.out
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  # Tier B：真实 MySQL / Redis / MinIO 集成测试（ENT-16 前置切片）。
  # 独立 job，保持 make ci 轻量；不注入 secrets，凭据均为 compose 测试默认值。
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests (MySQL + Redis + MinIO)
        run: bash scripts/ci/run-integration-tests.sh

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: govulncheck ./...

      - name: Dependency standards (replace + licenses)
        run: bash scripts/ci/check-deps.sh

  arch:
    name: arch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # check-oncall.sh 的 OC-03 通过 paging_probe.py 解析 Alertmanager 路由，
      # 该脚本依赖 PyYAML；runner 系统 Python 未预装，需在此钉扎安装。
      - name: Install PyYAML
        run: python3 -m pip install --quiet -r scripts/ci/requirements.txt

      - name: Arch gates (transport + DATA/REL/OBS)
        run: bash scripts/ci/gitee-job.sh arch

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Debug endpoints, gitleaks, config examples
        run: bash scripts/ci/gitee-job.sh secrets

  openapi:
    name: openapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch PR base for breaking check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: OpenAPI validate + breaking
        env:
          OPENAPI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/ci/gitee-job.sh openapi

  # 非合并门禁：产出契约文档 / TS 类型 / changelog，供客户端与发布说明消费。
  openapi-docs:
    name: openapi-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch PR base for changelog
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Build OpenAPI artifacts
        env:
          OPENAPI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make openapi-artifacts

      - name: Upload OpenAPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openapi-artifacts
          path: dist/openapi/
          if-no-files-found: error
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all commands
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/admin-api ./cmd/admin-api
          go build -ldflags "-s -w" -o bin/biz-api ./cmd/biz-api
          go build -ldflags "-s -w" -o bin/c-api ./cmd/c-api
          go build -ldflags "-s -w" -o bin/worker ./cmd/worker
          go build -ldflags "-s -w" -o bin/migrate ./cmd/migrate

  # ENT-05/ENT-06：Chart 渲染、告警规则与看板一致性（helm/promtool 由 job 安装）。
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - name: Install promtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz | tar -xz
          echo "${PWD}/prometheus-2.55.1.linux-amd64" >> "${GITHUB_PATH}"

      - name: Helm template + alert rules + release gates
        run: |
          bash scripts/ci/check-deploy.sh
          bash scripts/ci/check-alerts.sh
          # check-release 的金丝雀渲染断言需要 helm；本地 make ci 无 helm 时该段 SKIP。
          bash scripts/ci/check-release.sh
