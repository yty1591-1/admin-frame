# CI_STANDARDS.md（CI-01～CI-18）
# 变更本文件须同步审查 docs/CI_STANDARDS.md。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0

      - name: Check gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Check goimports
        run: |
          out="$(goimports -local github.com/admin-frame/admin-frame -l .)"
          if [ -n "$out" ]; then
            echo "goimports needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

  mod:
    name: mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...
          skip-cache: false

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # MySQL 8.0 service 供 tests/integration/iam 验证 SQL 仓储（租户隔离、唯一约束、乐观锁、
    # 快照查询）。版本与 docs/rbac-iam.md §13.1 的数据库基线一致；不使用生产数据源（CI-12）。
    #
    # 注意：`services` 是 GitHub Actions 专有能力，Gitea Act Runner 不会拉起该容器。
    # 因此 DSN 不再写死在 job 级 env（否则在 Gitea 上会「注入了 DSN、库却不存在」，
    # SQL 用例批量 connection refused 且不走跳过分支，见 2026-11-26 实测）。
    # 改由 scripts/ci/test-mysql-env.sh 探测端口后再注入。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iam_test
          MYSQL_USER: iam
          MYSQL_PASSWORD: iam
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 探测 127.0.0.1:3306：可连则注入与 service 一致的 DSN；不可连（Gitea 等
      # 不提供 services 的平台）则不注入，让用例按既有约定 t.Skip 并打印原因。
      # GitHub 必然提供 services.mysql，探不到就是真问题（如 service 没起来），
      # 置 MYSQL_REQUIRED=1 使其硬失败，防止 SQL 覆盖被静默跳过。
      - name: Resolve MySQL test DSN
        env:
          MYSQL_REQUIRED: ${{ github.server_url == 'https://github.com' && '1' || '0' }}
        run: bash scripts/ci/test-mysql-env.sh

      - name: Test with race + coverage + gates
        env:
          # 变更行覆盖率门禁（P1-5）；只在 PR 事件提供基线。
          GIT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/run-tests.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage.out
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  # Tier B：真实 MySQL / Redis / MinIO 集成测试（ENT-16 前置切片）。
  # 独立 job，保持 make ci 轻量；不注入 secrets，凭据均为 compose 测试默认值。
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 端口冲突（2026-11-26 Gitea 实测）：
      #   Bind for 127.0.0.1:3306 failed: port is already allocated
      # Gitea Act Runner 让多个 job 共用宿主 docker，`test` job 的 3306 已被占用
      # （同一提交的 lint/test/vuln 等在并行跑），本 job 再用 3306 必然绑定失败。
      # run-integration-tests.sh 在 CI 环境（$CI 非空）下自动用唯一 project name +
      # 随机空闲端口，因此这里不钉死端口（钉死会让并发 workflow 互相再次撞车）。
      - name: Integration tests (MySQL + Redis + MinIO)
        run: bash scripts/ci/run-integration-tests.sh

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: bash scripts/ci/check-vuln.sh

      - name: Dependency standards (replace + licenses)
        run: bash scripts/ci/check-deps.sh

  arch:
    name: arch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # check-audit.sh 会跑 `go test ./internal/audit/...`，arch job 因此需要 Go。
      # GitHub 的 ubuntu-latest 自带 Go，Gitea 的 runner-images:ubuntu-latest 没有，
      # 2026-11-27 实测报 `ERROR: go not found; cannot run audit package tests`。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # check-oncall.sh 的 OC-03 通过 paging_probe.py 解析 Alertmanager 路由，
      # 该脚本依赖 PyYAML；runner 系统 Python 未预装，需在此钉扎安装。
      # 走 make ci-deps 而非裸 pip：Debian 12/Ubuntu 24.04（含 Gitea Act Runner
      # 镜像）按 PEP 668 标记系统 Python 为 externally-managed，裸 pip 会被拒绝，
      # 2026-11-26 Gitea 上本 job 即因 externally-managed-environment 秒失败。
      # ci-deps.sh 会创建仓库内 .venv，check-oncall.sh 优先使用该解释器。
      - name: Install PyYAML
        run: bash scripts/ci/ci-deps.sh

      - name: Arch gates (transport + DATA/REL/OBS)
        run: bash scripts/ci/gitee-job.sh arch

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Debug endpoints, gitleaks, config examples
        run: bash scripts/ci/gitee-job.sh secrets

  openapi:
    name: openapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch PR base for breaking check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: OpenAPI validate + breaking
        env:
          OPENAPI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/ci/gitee-job.sh openapi

  # 非合并门禁：产出契约文档 / TS 类型 / changelog，供客户端与发布说明消费。
  openapi-docs:
    name: openapi-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # make openapi-artifacts 依赖 Go（openapi-bundle 由 go 生成规范），
      # 不能靠 runner 预装：GitHub 的 ubuntu-latest 自带 Go，Gitea Act Runner 的
      # docker.gitea.com/runner-images:ubuntu-latest 没有，2026-11-26 实测本 job
      # 直接 `error: go not found in PATH`。显式声明后两个平台行为一致。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch PR base for changelog
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Build OpenAPI artifacts
        env:
          OPENAPI_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make openapi-artifacts

      - name: Upload OpenAPI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openapi-artifacts
          path: dist/openapi/
          if-no-files-found: error
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all commands
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/admin-api ./cmd/admin-api
          go build -ldflags "-s -w" -o bin/biz-api ./cmd/biz-api
          go build -ldflags "-s -w" -o bin/c-api ./cmd/c-api
          go build -ldflags "-s -w" -o bin/worker ./cmd/worker
          go build -ldflags "-s -w" -o bin/migrate ./cmd/migrate

  # ENT-05/ENT-06：Chart 渲染、告警规则与看板一致性（helm/promtool 由 job 安装）。
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - name: Install promtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz | tar -xz
          echo "${PWD}/prometheus-2.55.1.linux-amd64" >> "${GITHUB_PATH}"

      - name: Helm template + alert rules + release gates
        run: |
          bash scripts/ci/check-deploy.sh
          bash scripts/ci/check-alerts.sh
          # check-release 的金丝雀渲染断言需要 helm；本地 make ci 无 helm 时该段 SKIP。
          bash scripts/ci/check-release.sh

  # FE-CI-01：前端必跑门禁（FE-25～28），与 make frontend-check 同源。
  # 不设置 paths 过滤：required check 被 skip 会让分支保护形同虚设。
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # FE-B-04：check-frontend-dockerfile.sh 需要 helm 做 chart 渲染断言（缺 helm 时该段 SKIP）。
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Frontend gates
        env:
          CI: "true"
        run: bash scripts/ci/frontend-check.sh
