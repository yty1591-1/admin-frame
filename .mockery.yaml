# CODEGEN_STANDARDS GEN-04：mockery 配置（引入接口 mock 时启用）。
# 钉扎版本建议在 Makefile 的 mock 目标中固定。
dir: '{{.InterfaceDir}}/mocks'
filename: 'mock_{{.InterfaceName | snakecase}}.go'
outpkg: mocks
with-expecter: true
